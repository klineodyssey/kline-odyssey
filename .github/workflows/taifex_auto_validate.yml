name: TAIFEX Auto Validate

on:
  push:
    paths:
      - "K線西遊記/kline-taifex/raw/*.csv"
      - "K線西遊記/kline-taifex/master/*.xlsx"
      - "K線西遊記/kline-taifex/scripts/*.py"
      - ".github/workflows/taifex_auto_validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: K線西遊記/kline-taifex

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl numpy

      - name: Run TAIFEX trailing-empty parser regression tests
        run: python -m unittest discover -s tests -p 'test_tx_trailing_empty_compat.py' -v

      - name: Find latest raw csv
        id: latest_raw
        run: |
          latest_csv=$(ls -1 raw/*.csv | sort | tail -n 1)
          echo "latest_csv=$latest_csv" >> $GITHUB_OUTPUT
          echo "Latest raw: $latest_csv"

      - name: Validate canonical master covers latest raw
        env:
          LATEST_RAW: ${{ steps.latest_raw.outputs.latest_csv }}
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          root = Path.cwd()
          pipeline_path = root / "scripts" / "tx_full_day_pipeline_v882_UTF8BOM.py"
          master_path = root / "master" / "台指近全.xlsx"

          spec = importlib.util.spec_from_file_location("tx_pipeline", pipeline_path)
          if spec is None or spec.loader is None:
              raise RuntimeError(f"Unable to load canonical pipeline: {pipeline_path}")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          master = module._load_master(str(master_path))
          module.validate_near_full(master)

          latest_raw = os.environ["LATEST_RAW"]
          source = module.read_csv_strict_19_multiline(latest_raw)
          near = module.make_near_full_day(source)
          raw_dates = {int(value) for value in near["交易日期"].tolist()}
          master_dates = {int(value) for value in master["交易日期"].tolist()}
          missing_dates = sorted(raw_dates - master_dates)
          if missing_dates:
              raise RuntimeError(
                  f"Canonical master is missing dates from {latest_raw}: {missing_dates}"
              )

          print(f"Canonical master valid: {master_path}")
          print(f"Latest raw covered: {latest_raw}; dates={sorted(raw_dates)}")
          PY
