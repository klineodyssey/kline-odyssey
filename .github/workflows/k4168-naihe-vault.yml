name: K4168 Naihe Vault
on:
  push:
    branches: [gm/k4168-naihe-vault-v1]
    paths:
      - 'KAIOS/K4168/**'
      - '.github/workflows/k4168-naihe-vault.yml'
  pull_request:
    paths:
      - 'KAIOS/K4168/**'
      - '.github/workflows/k4168-naihe-vault.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node KAIOS/K4168/naihe-vault.test.mjs
      - run: git diff --check
