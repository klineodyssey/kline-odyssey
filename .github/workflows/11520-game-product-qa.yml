name: 11520 Game Product QA

on:
  push:
    paths:
      - "K線西遊記/temples/11520/**"
      - "assets/kaios-audio*"
      - "tests/11520-product-standard.test.mjs"
      - ".github/workflows/11520-game-product-qa.yml"
  pull_request:
    paths:
      - "K線西遊記/temples/11520/**"
      - "assets/kaios-audio*"
      - "tests/11520-product-standard.test.mjs"
      - ".github/workflows/11520-game-product-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-qa:
    runs-on: ubuntu-latest
    # Full mobile + settlement + Player Life passed on 0610eef3, but the
    # aggregate reached 20 minutes during artifact/post-job cleanup. Keep
    # every per-script timeout below unchanged; reserve 5 minutes for runner
    # variability and evidence upload rather than skipping assertions.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate 11520 ES modules
        run: |
          node --check "K線西遊記/temples/11520/runtime/world-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/monster-aggression-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/game-ui-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/kgen-margin-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/evm-wallet-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/player-life-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/player-life-ui.mjs"
          node --check "K線西遊記/temples/11520/tests/11520-browser-player-life.mjs"
          node --check "K線西遊記/temples/11520/runtime/backpack-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/backpack-ui.mjs"
          node --check "K線西遊記/temples/11520/runtime/item-visual-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/wild-ecology-source-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/living-world-inventory-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/life-visual-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/kaios-atm-receiving-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/digital-ant-kaios-receiving-bridge.mjs"
          node --check "K線西遊記/temples/11520/controls/nonlinear-controls.mjs"
          node --check "K線西遊記/temples/11520/runtime/game-controls-v251.mjs"
          node --check "K線西遊記/temples/11520/runtime/joystick-xzxy.mjs"
          node --check "K線西遊記/temples/11520/runtime/xyz-input-authority-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/character-status-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/combat-mass-scale-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/combat-drive-adapter.mjs"
          node --check "K線西遊記/temples/11520/runtime/combat-drive-live-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/plane-map-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/xyz-map-navigation-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/mobile-control-layout.mjs"
          node --check "K線西遊記/temples/11520/runtime/mobile-action-rail-clearance-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/mobile-signed-c-immersive-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/public-market-quotes.mjs"
          node --check "K線西遊記/temples/11520/tests/monster-aggression-runtime.mjs"
          node --check "K線西遊記/temples/11520/tests/11520-browser-mobile-hud.mjs"
          node --check "K線西遊記/temples/11520/tests/11520-browser-smoke.mjs"
          node --check "K線西遊記/temples/11520/tests/11520-browser-signed-c-immersive.mjs"
          node --check "K線西遊記/temples/11520/tests/11520-browser-character-status.mjs"
          node --check "K線西遊記/temples/11520/tests/11520-browser-action-rail-clearance.mjs"
          node --check "K線西遊記/temples/11520/tests/11520-browser-combat-drive.mjs"
          node --check "K線西遊記/temples/11520/tests/11520-browser-monster-aggression.mjs"
          node --check "K線西遊記/temples/11520/tests/11520-browser-creature-archetypes.mjs"
          node --check "K線西遊記/temples/11520/tests/11520-browser-storage-fallback.mjs"
      - name: Run 11520 runtime and product invariant tests
        run: |
          # In-memory IDB model only; native browser evidence is a separate gate.
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org fake-indexeddb@6.2.5
          node --test "K線西遊記/temples/11520/tests/11520-player-life.test.mjs"
          node --test "K線西遊記/temples/11520/tests/11520-runtime.test.mjs" "K線西遊記/temples/11520/tests/11520-ui-static.test.mjs" "K線西遊記/temples/11520/tests/11520-backpack-living-world.test.mjs" "K線西遊記/temples/11520/tests/11520-plane-map.test.mjs" "K線西遊記/temples/11520/tests/11520-xyz-map-navigation.test.mjs" "K線西遊記/temples/11520/tests/11520-living-world-visual.test.mjs" "K線西遊記/temples/11520/tests/11520-item-visual.test.mjs" "K線西遊記/temples/11520/tests/11520-kaios-atm-receiving.test.mjs" "K線西遊記/temples/11520/tests/11520-public-market-quotes.test.mjs" "K線西遊記/temples/11520/tests/11520-pwa-bgm.test.mjs"
          node "K線西遊記/temples/11520/tests/combat-mass-scale-runtime.mjs"
          node "K線西遊記/temples/11520/tests/combat-drive-adapter.mjs"
          node "K線西遊記/temples/11520/tests/combat-drive-live-runtime.mjs"
          node "K線西遊記/temples/11520/tests/monster-aggression-runtime.mjs"
          node "tests/11520-product-standard.test.mjs"
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 three@0.180.0 ethers@6.15.0
          npx playwright install --with-deps chromium
      - name: Run mobile XYZ functional and visual smoke tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/k11520-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          echo "[11520-QA] XYZ browser smoke start $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s node "K線西遊記/temples/11520/tests/11520-browser-xzxy.mjs" 2>&1 | tee /tmp/k11520-browser-smoke.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -eq 0 ]; then
            # Full signed detent sweep: 49 touch selections in each orientation plus screenshots.
            timeout --signal=TERM --kill-after=10s 240s node "K線西遊記/temples/11520/tests/11520-browser-signed-c-immersive.mjs" 2>&1 | tee -a /tmp/k11520-browser-smoke.log
            RC=${PIPESTATUS[0]}
          fi
          if [ "$RC" -eq 0 ]; then
            timeout --signal=TERM --kill-after=10s 120s node "K線西遊記/temples/11520/tests/11520-browser-smoke.mjs" 2>&1 | tee -a /tmp/k11520-browser-smoke.log
            RC=${PIPESTATUS[0]}
          fi
          if [ "$RC" -eq 0 ]; then
            timeout --signal=TERM --kill-after=10s 90s node "K線西遊記/temples/11520/tests/11520-browser-character-status.mjs" 2>&1 | tee -a /tmp/k11520-browser-smoke.log
            RC=${PIPESTATUS[0]}
          fi
          if [ "$RC" -eq 0 ]; then
            timeout --signal=TERM --kill-after=10s 90s node "K線西遊記/temples/11520/tests/11520-browser-mobile-hud.mjs" 2>&1 | tee -a /tmp/k11520-browser-smoke.log
            RC=${PIPESTATUS[0]}
          fi
          if [ "$RC" -eq 0 ]; then
            timeout --signal=TERM --kill-after=10s 90s node "K線西遊記/temples/11520/tests/11520-browser-action-rail-clearance.mjs" 2>&1 | tee -a /tmp/k11520-browser-smoke.log
            RC=${PIPESTATUS[0]}
          fi
          if [ "$RC" -eq 0 ]; then
            timeout --signal=TERM --kill-after=10s 90s node "K線西遊記/temples/11520/tests/11520-browser-combat-drive.mjs" 2>&1 | tee -a /tmp/k11520-browser-smoke.log
            RC=${PIPESTATUS[0]}
          fi
          if [ "$RC" -eq 0 ]; then
            timeout --signal=TERM --kill-after=10s 90s node "K線西遊記/temples/11520/tests/11520-browser-monster-aggression.mjs" 2>&1 | tee -a /tmp/k11520-browser-smoke.log
            RC=${PIPESTATUS[0]}
          fi
          if [ "$RC" -eq 0 ]; then
            timeout --signal=TERM --kill-after=10s 90s node "K線西遊記/temples/11520/tests/11520-browser-plane-map.mjs" 2>&1 | tee -a /tmp/k11520-browser-smoke.log
            RC=${PIPESTATUS[0]}
          fi
          if [ "$RC" -eq 0 ]; then
            timeout --signal=TERM --kill-after=10s 90s node "K線西遊記/temples/11520/tests/11520-browser-living-world.mjs" 2>&1 | tee -a /tmp/k11520-browser-smoke.log
            RC=${PIPESTATUS[0]}
          fi
          if [ "$RC" -eq 0 ]; then
            timeout --signal=TERM --kill-after=10s 90s node "K線西遊記/temples/11520/tests/11520-browser-item-visual.mjs" 2>&1 | tee -a /tmp/k11520-browser-smoke.log
            RC=${PIPESTATUS[0]}
          fi
          if [ "$RC" -eq 0 ]; then
            timeout --signal=TERM --kill-after=10s 90s node "K線西遊記/temples/11520/tests/11520-browser-creature-archetypes.mjs" 2>&1 | tee -a /tmp/k11520-browser-smoke.log
            RC=${PIPESTATUS[0]}
          fi
          if [ "$RC" -eq 0 ]; then
            timeout --signal=TERM --kill-after=10s 90s node "K線西遊記/temples/11520/tests/11520-browser-storage-fallback.mjs" 2>&1 | tee -a /tmp/k11520-browser-smoke.log
            RC=${PIPESTATUS[0]}
          fi
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "[11520-QA] browser smoke failed or timed out rc=$RC"
            tail -n 360 /tmp/k11520-browser-smoke.log || true
            tail -n 200 /tmp/k11520-http.log || true
            exit "$RC"
          fi
          echo "[11520-QA] XYZ browser smoke completed $(date -u +%FT%TZ)"
      - name: Run deterministic settlement lifecycle in real Chromium (portrait and landscape)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/k11520-settlement-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          # Includes wallet lifecycle, liquidation and a second profitable-close cycle in both orientations.
          timeout 300s node "K線西遊記/temples/11520/tests/11520-browser-settlement.mjs"
      - name: Upload settlement browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 11520-settlement-${{ github.sha }}
          path: artifacts/11520-settlement-qa/
          if-no-files-found: error
      - name: Run Player Life persistence and isolation in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/k11520-player-life-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          # V2.8 isolation/recovery plus V2.9 real combat/Boss/audio in two orientations.
          timeout 540s node "K線西遊記/temples/11520/tests/11520-browser-player-life.mjs"
      - name: Upload Player Life mobile and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 11520-player-life-${{ github.sha }}
          path: artifacts/11520-player-life-qa/
          if-no-files-found: error
      - name: Verify mandatory runtime screenshot evidence exists
        if: always()
        shell: bash
        run: |
          set -e
          SCREENSHOT="artifacts/11520-visual-qa/11520-mobile-390x844.png"
          if [ ! -s "$SCREENSHOT" ]; then
            echo "[11520-QA] QA_RED: mandatory 390x844 runtime screenshot missing or empty: $SCREENSHOT"
            exit 1
          fi
          SIGNED="artifacts/11520-visual-qa/11520-mobile-signed-c-immersive.png"
          if [ ! -s "$SIGNED" ]; then echo "[11520-QA] QA_RED: signed-C immersive screenshot missing: $SIGNED"; exit 1; fi
          CHARACTER="artifacts/11520-visual-qa/11520-mobile-character-status.png"
          if [ ! -s "$CHARACTER" ]; then echo "[11520-QA] QA_RED: character status screenshot missing: $CHARACTER"; exit 1; fi
          for P in xz xy yz; do
            F="artifacts/11520-visual-qa/11520-plane-map-${P}.png"
            if [ ! -s "$F" ]; then echo "[11520-QA] QA_RED: plane map screenshot missing: $F"; exit 1; fi
          done
          LIVING="artifacts/11520-visual-qa/11520-living-world-digital-ant.png"
          if [ ! -s "$LIVING" ]; then echo "[11520-QA] QA_RED: living-world screenshot missing: $LIVING"; exit 1; fi
          ITEMS="artifacts/11520-visual-qa/11520-backpack-item-3d.png"
          if [ ! -s "$ITEMS" ]; then echo "[11520-QA] QA_RED: 3D item screenshot missing: $ITEMS"; exit 1; fi
          CREATURES="artifacts/11520-visual-qa/11520-creature-archetypes-390x844.png"
          if [ ! -s "$CREATURES" ]; then echo "[11520-QA] QA_RED: creature archetype screenshot missing: $CREATURES"; exit 1; fi
          STORAGE_FALLBACK="artifacts/11520-visual-qa/11520-portal-memory-fallback-390x844.png"
          STORAGE_DURABLE="artifacts/11520-visual-qa/11520-portal-indexeddb-390x844.png"
          if [ ! -s "$STORAGE_FALLBACK" ] || [ ! -s "$STORAGE_DURABLE" ]; then echo "[11520-QA] QA_RED: IndexedDB fallback/durable screenshots missing"; exit 1; fi
          HUD="artifacts/11520-visual-qa/11520-mobile-hud-3rail.png"
          COLLAPSED="artifacts/11520-visual-qa/11520-mobile-hud-collapsed.png"
          DRIVE="artifacts/11520-visual-qa/11520-mobile-combat-drive-c10-3lots.png"
          MONSTER="artifacts/11520-visual-qa/11520-mobile-monster-attack-hp.png"
          ACTION_RAIL="artifacts/11520-visual-qa/11520-mobile-action-rail-clearance.png"
          DOCK_OPEN="artifacts/11520-visual-qa/11520-mobile-dock-open.png"
          C100_SETTLEMENT="artifacts/11520-visual-qa/11520-c100-settlement-hardening-390x844.png"
          if [ ! -s "$HUD" ] || [ ! -s "$COLLAPSED" ]; then echo "[11520-QA] QA_RED: mobile HUD three-rail/collapse screenshots missing"; exit 1; fi
          if [ ! -s "$DRIVE" ]; then echo "[11520-QA] QA_RED: C/lot combat-drive screenshot missing"; exit 1; fi
          if [ ! -s "$MONSTER" ]; then echo "[11520-QA] QA_RED: monster attack HP screenshot missing"; exit 1; fi
          if [ ! -s "$ACTION_RAIL" ]; then echo "[11520-QA] QA_RED: action-layer/right-rail screenshot missing"; exit 1; fi
          if [ ! -s "$DOCK_OPEN" ]; then echo "[11520-QA] QA_RED: dock-open pointer-clearance screenshot missing"; exit 1; fi
          if [ ! -s "$C100_SETTLEMENT" ]; then echo "[11520-QA] QA_RED: C100 settlement screenshot missing"; exit 1; fi
          echo "[11520-QA] screenshot evidence present"
      - name: Upload 11520 runtime visual QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 11520-runtime-visual-qa-${{ github.sha }}
          path: artifacts/11520-visual-qa/
          if-no-files-found: error
          retention-days: 14

  native-idb-adapter:
    name: Native IndexedDB adapter diagnostics (mandatory)
    runs-on: ubuntu-latest
    # Independent resource budget; ordinary product/script budgets stay unchanged.
    # Adds at most 8 runner-minutes per workflow event (push and PR each run it).
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Prepare isolated native browser and exact historical sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/11520-player-life-idb-qa
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.51.1 ethers@6.15.0
          npx playwright install --with-deps chromium
          # Read-only source object. No mutable-main fixture and no old runtime execution in Node.
          git fetch --no-tags --depth=1 origin b513d4e7ca87ebfb5adf5c03b8d2c26ff834b720
          test "$(git rev-parse 'b513d4e7ca87ebfb5adf5c03b8d2c26ff834b720^{commit}')" = "b513d4e7ca87ebfb5adf5c03b8d2c26ff834b720"
          node --check "K線西遊記/temples/11520/tests/11520-browser-player-life.mjs"
      - name: Run native two-tab and clean-browser-restart adapter diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/11520-player-life-idb-qa/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          timeout --signal=TERM --kill-after=10s 240s node "K線西遊記/temples/11520/tests/11520-browser-player-life.mjs" --native-idb-only 2>&1 | tee artifacts/11520-player-life-idb-qa/browser.log
      - name: Validate mandatory adapter evidence without implying product acceptance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for FILE in report.json native-idb-before-restart-390x844.png native-idb-after-restart-390x844.png; do
            test -s "artifacts/11520-player-life-idb-qa/$FILE" || { echo "QA_RED: missing native IDB evidence $FILE"; exit 1; }
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('artifacts/11520-player-life-idb-qa/report.json','utf8'));
          assert.equal(r.schema,'K11520_NATIVE_IDB_DIAGNOSTICS_V1');
          assert.equal(r.scope,'NATIVE_ADAPTER_DIAGNOSTICS');
          assert.equal(r.fixtureSeeding,'SYNTHETIC_DIRECT_IDB_NOT_MIGRATION');
          assert.equal(r.functionalQA,'PASS');assert.equal(r.releaseStatus,'HOLD');assert.equal(r.wholePlayerLifeP0,'INCOMPLETE');
          assert.equal(r.visualQA,'ADAPTER_DIAGNOSTIC_ONLY_NOT_PRODUCT_VISUAL_QA');
          assert.equal(r.head,process.env.GITHUB_SHA);assert.equal(r.ciHead,process.env.GITHUB_SHA);assert.match(r.tree,/^[0-9a-f]{40}$/);assert.equal(r.trackedDirty,false);
          assert.equal(r.playwrightVersion,'1.51.1');assert.ok(typeof r.browserVersion==='string'&&r.browserVersion.length>0);
          const snapshot=e=>{assert.match(e.hash,/^[0-9a-f]{64}$/);assert.equal(e.records.length,6);for(const record of e.records){assert.match(record.sha256,/^[0-9a-f]{64}$/);assert.ok(Number.isSafeInteger(record.revision)&&record.revision>=0);}};
          const required=['NATIVE_IDB','CROSS_TAB_STALE_CAS','SIMULTANEOUS_CAS','REFRESH_EXPLICIT_RETRY','SELECTION_EPOCH_ISOLATION','MULTI_RECORD_ABORT','ATOMIC_COURIER_CREDIT','CORRUPT_RECORD_PRESERVATION','FULL_RECORD_ABSENCE_AND_CORRUPTION','REVIEW_CAPTURE_SOURCE_PRESERVATION','PINNED_OLD_WRITES_ISOLATED','CLEAN_BROWSER_RESTART'];
          assert.equal(r.cases.length,required.length);assert.equal(new Set(r.cases.map(c=>c.id)).size,required.length);
          for(const id of required){const c=r.cases.find(c=>c.id===id);assert.equal(c?.required,true);assert.equal(c?.status,'PASS');assert.ok(c.evidence);}
          const restart=r.cases.find(c=>c.id==='CLEAN_BROWSER_RESTART').evidence;
          assert.equal(restart.kind,'CLEAN_BROWSER_RESTART');assert.equal(restart.oldContextClosed,true);assert.equal(restart.oldBrowserDisconnected,true);assert.equal(restart.newBrowserConnected,true);assert.equal(restart.launches,2);assert.equal(restart.sameProfileDirectory,true);assert.equal(restart.sameOrigin,r.origin);assert.equal(restart.reseeded,false);assert.equal(restart.storageStateImported,false);assert.equal(restart.before.hash,restart.after.hash);
          snapshot(restart.before);snapshot(restart.after);
          const stale=r.cases.find(c=>c.id==='CROSS_TAB_STALE_CAS').evidence,simultaneous=r.cases.find(c=>c.id==='SIMULTANEOUS_CAS').evidence;
          assert.deepEqual(stale.admittedA,stale.admittedB);assert.equal(stale.staleOutcome,'REVISION_CONFLICT_RELOAD_REQUIRED');snapshot(stale.after);
          const retry=r.cases.find(c=>c.id==='REFRESH_EXPLICIT_RETRY').evidence;assert.equal(retry.reloadOccurred,true);assert.equal(retry.oldCachesOnBPreserved,true);snapshot(retry.beforeReload);snapshot(retry.afterReload);assert.equal(retry.beforeReload.hash,retry.afterReload.hash);
          assert.deepEqual(simultaneous.admittedA,simultaneous.admittedB);assert.equal(simultaneous.outcomes.filter(o=>o.status==='fulfilled').length,1);assert.equal(simultaneous.outcomes.filter(o=>o.status==='rejected'&&/REVISION_CONFLICT/.test(o.error)).length,1);snapshot(simultaneous.after);
          const abort=r.cases.find(c=>c.id==='MULTI_RECORD_ABORT').evidence;assert.equal(abort.injection,'NATIVE_REQUEST_SUCCESS_THEN_TRANSACTION_ABORT');assert.equal(abort.physicalQuotaTest,false);assert.equal(abort.injectionEvidence.productRequestSucceeded,1);assert.equal(abort.injectionEvidence.abortCalls,1);assert.equal(abort.injectionEvidence.requestDone,true);assert.deepEqual(abort.injectionEvidence.errors,[]);assert.match(abort.refusal,/AUTHORITY_TRANSACTION_ABORTED|AbortError/);snapshot(abort.before);snapshot(abort.after);assert.equal(abort.before.hash,abort.after.hash);
          const corrupt=r.cases.find(c=>c.id==='CORRUPT_RECORD_PRESERVATION').evidence,capture=r.cases.find(c=>c.id==='REVIEW_CAPTURE_SOURCE_PRESERVATION').evidence;
          assert.equal(corrupt.preserved,true);assert.equal(corrupt.repairAttempted,false);assert.match(corrupt.refusal,/CORRUPT_AUTHORITY/);assert.equal(capture.sourceStringsPreserved,true);assert.equal(capture.authorityInstalled,false);assert.match(capture.manifestSha256,/^[0-9a-f]{64}$/);
          const old=r.cases.find(c=>c.id==='PINNED_OLD_WRITES_ISOLATED').evidence;
