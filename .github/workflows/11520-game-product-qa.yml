name: 11520 Game Product QA

on:
  push:
    paths:
      - "K線西遊記/temples/11520/**"
      - "tests/11520-product-standard.test.mjs"
      - ".github/workflows/11520-game-product-qa.yml"
  pull_request:
    paths:
      - "K線西遊記/temples/11520/**"
      - "tests/11520-product-standard.test.mjs"
      - ".github/workflows/11520-game-product-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate 11520 ES modules
        run: |
          node --check "K線西遊記/temples/11520/runtime/world-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/game-ui-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/game-ui-product-fixes.mjs"
          node --check "K線西遊記/temples/11520/runtime/game-5d-bootstrap.mjs"
          node --check "K線西遊記/temples/11520/runtime/game-5d-main.mjs"
          node --check "K線西遊記/temples/11520/runtime/spatial-coordinate-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/map-object-navigation-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/life-visual-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/capture-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/kgen-margin-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/evm-wallet-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/backpack-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/wild-ecology-source-runtime.mjs"
          node --check "K線西遊記/temples/11520/runtime/living-world-inventory-runtime.mjs"
          node --check "K線西遊記/temples/11520/controls/nonlinear-controls.mjs"
      - name: Run 11520 runtime and product invariant tests
        run: |
          node --test "K線西遊記/temples/11520/tests/11520-runtime.test.mjs" "K線西遊記/temples/11520/tests/11520-ui-static.test.mjs" "K線西遊記/temples/11520/tests/11520-backpack-living-world.test.mjs" "K線西遊記/temples/11520/tests/11520-spatial-navigation.test.mjs" "K線西遊記/temples/11520/tests/11520-capture-runtime.test.mjs"
          node "tests/11520-product-standard.test.mjs"
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Run mobile browser smoke test
        shell: bash
        timeout-minutes: 4
        run: |
          set -o pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/k11520-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 2
          CODE=0
          timeout --signal=TERM --kill-after=10s 150s node "K線西遊記/temples/11520/tests/11520-browser-smoke.mjs" || CODE=$?
          if [ "$CODE" -ne 0 ]; then
            echo "11520 mobile smoke failed or timed out (exit=$CODE)"
            echo "--- local HTTP server log ---"
            cat /tmp/k11520-http.log || true
            echo "--- process snapshot ---"
            ps -ef | grep -E 'node|chrom|python3' | grep -v grep || true
            exit 1
          fi
