name: 11520 Trading Readiness

on:
  push:
    paths:
      - "KGEN/contracts/KGEN_BrainExchange.sol"
      - "KGEN/contracts/KGEN_MarketRiskKernel.sol"
      - "KGEN/contracts/KGEN_PositionEngine.sol"
      - "KGEN/contracts/KGEN_OrderTriggerEngine.sol"
      - "KGEN/contracts/KGEN_OracleSourceAdapter.sol"
      - "KGEN/scripts/rehearse_bsc_testnet.mjs"
      - "docs/K11520_BSC_TESTNET_DEPLOYMENT_MANIFEST.json"
      - "KGEN/contracts/tests/brain-v4-static-invariants.mjs"
      - "KGEN/contracts/tests/brain-v4-evm.test.mjs"
      - "KGEN/contracts/tests/market-risk-kernel-evm.test.mjs"
      - "KGEN/contracts/tests/position-engine-evm.test.mjs"
      - "KGEN/contracts/tests/brain-position-integration-evm.test.mjs"
      - "K線西遊記/temples/11520/runtime/real-trading-market-binding.mjs"
      - "K線西遊記/temples/11520/runtime/real-trading-order-intent.mjs"
      - "K線西遊記/temples/11520/runtime/real-trading-preflight-ui.mjs"
      - "K線西遊記/temples/11520/runtime/evm-wallet-runtime.mjs"
      - "tests/11520-real-trading-market-binding.test.mjs"
      - "tests/11520-real-trading-order-intent.test.mjs"
      - "tests/11520-real-trading-preflight-ui.test.mjs"
      - "tests/11520-order-route.test.mjs"
      - ".github/workflows/11520-trading-readiness.yml"
  pull_request:
    paths:
      - "KGEN/contracts/KGEN_BrainExchange.sol"
      - "KGEN/contracts/KGEN_MarketRiskKernel.sol"
      - "KGEN/contracts/KGEN_PositionEngine.sol"
      - "KGEN/contracts/KGEN_OrderTriggerEngine.sol"
      - "KGEN/contracts/KGEN_OracleSourceAdapter.sol"
      - "KGEN/scripts/rehearse_bsc_testnet.mjs"
      - "docs/K11520_BSC_TESTNET_DEPLOYMENT_MANIFEST.json"
      - "KGEN/contracts/tests/brain-v4-static-invariants.mjs"
      - "KGEN/contracts/tests/brain-v4-evm.test.mjs"
      - "KGEN/contracts/tests/market-risk-kernel-evm.test.mjs"
      - "KGEN/contracts/tests/position-engine-evm.test.mjs"
      - "KGEN/contracts/tests/brain-position-integration-evm.test.mjs"
      - "K線西遊記/temples/11520/runtime/real-trading-market-binding.mjs"
      - "K線西遊記/temples/11520/runtime/real-trading-order-intent.mjs"
      - "K線西遊記/temples/11520/runtime/real-trading-preflight-ui.mjs"
      - "K線西遊記/temples/11520/runtime/evm-wallet-runtime.mjs"
      - "tests/11520-real-trading-market-binding.test.mjs"
      - "tests/11520-real-trading-order-intent.test.mjs"
      - "tests/11520-real-trading-preflight-ui.test.mjs"
      - "tests/11520-order-route.test.mjs"
      - ".github/workflows/11520-trading-readiness.yml"

permissions:
  contents: read

jobs:
  canonical-real-funds-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The UUPS regression compiles the pinned pre-capital implementation.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assert no tracked duplicate active contract sources
        shell: bash
        run: |
          set -euo pipefail
          test ! -e KGEN/contracts/KGEN_BrainExchange_V4_0_0.sol
          test ! -e KGEN/contracts/KGEN_MarketRiskKernel_V1_0_0.sol
          test ! -e KGEN/contracts/KGEN_PositionEngine_V1_0_0.sol

      - name: Install pinned Solidity/EVM test dependencies
        run: |
          npm install --no-save --package-lock=false \
            solc@0.8.24 \
            @openzeppelin/contracts@5.0.2 \
            @openzeppelin/contracts-upgradeable@5.0.2 \
            ethers@6.15.0 \
            ganache@7.9.2

      - name: Compile exact canonical versionless contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/brain-v4-build
          mkdir -p /tmp/brain-v4-build
          npx solcjs \
            --optimize --optimize-runs 200 \
            --bin --abi \
            --base-path . \
            --include-path node_modules \
            -o /tmp/brain-v4-build \
            KGEN/contracts/KGEN_BrainExchange.sol \
            KGEN/contracts/KGEN_MarketRiskKernel.sol \
            KGEN/contracts/KGEN_PositionEngine.sol \
            KGEN/contracts/KGEN_OrderTriggerEngine.sol \
            KGEN/contracts/KGEN_OracleSourceAdapter.sol
          test -s /tmp/brain-v4-build/KGEN_contracts_KGEN_BrainExchange_sol_KGEN_BrainExchange_V4_0_0.bin
          test -s /tmp/brain-v4-build/KGEN_contracts_KGEN_PositionEngine_sol_KGEN_PositionEngine_V1_0_0.bin

          test -s /tmp/brain-v4-build/KGEN_contracts_KGEN_OrderTriggerEngine_sol_KGEN_OrderTriggerEngine.bin

      - name: Run fixed axis/market binding invariants
        run: node --test tests/11520-real-trading-market-binding.test.mjs

      - name: Run unsigned order-intent invariants
        run: node --test tests/11520-real-trading-order-intent.test.mjs tests/11520-kgen-margin-wallet-foundation.test.mjs

      - name: Run player-visible preflight invariants
        run: node --test tests/11520-real-trading-preflight-ui.test.mjs

      - name: Run local-vs-real order-route invariants
        run: node --test tests/11520-order-route.test.mjs

      - name: Run fund-safety static invariants
        run: node KGEN/contracts/tests/brain-v4-static-invariants.mjs

      - name: Run Brain custody EVM invariants
        run: node KGEN/contracts/tests/brain-v4-evm.test.mjs

      - name: Run market risk kernel EVM invariants
        run: node KGEN/contracts/tests/market-risk-kernel-evm.test.mjs

      - name: Run Position Engine EVM invariants
        run: node KGEN/contracts/tests/position-engine-evm.test.mjs

      - name: Run actual Brain proxy + Position + Trigger integration and 100C stress
        run: node KGEN/contracts/tests/brain-position-integration-evm.test.mjs

      - name: Validate testnet deployment package locally (never public broadcast)
        run: node KGEN/scripts/rehearse_bsc_testnet.mjs --local

      - name: Verify successor preparation and duplicate-deployment guards (no provider or signer)
        run: node KGEN/scripts/rehearse_bsc_testnet.mjs --test-successor-guards

      - name: Verify unsigned Mainnet package construction (synthetic inputs; no provider or signer)
        run: node KGEN/scripts/rehearse_bsc_testnet.mjs --test-mainnet-package

      - name: Reject tracked drift and parallel contract aliases
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test ! -e KGEN/contracts/KGEN_BrainExchange_V4_0_0.sol
          test ! -e KGEN/contracts/KGEN_MarketRiskKernel_V1_0_0.sol
          test ! -e KGEN/contracts/KGEN_PositionEngine_V1_0_0.sol
      - name: Upload local EVM rehearsal evidence (not Testnet)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-local-evm-${{ github.sha }}
          path: artifacts/settlement-local-evm.json
          if-no-files-found: error

  candidate-wallet-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned local EVM and Chromium dependencies
        run: |
          npm install --no-save --package-lock=false solc@0.8.24 \
            @openzeppelin/contracts@5.0.2 @openzeppelin/contracts-upgradeable@5.0.2 \
            ethers@6.15.0 ganache@7.9.2 playwright@1.51.1 three@0.180.0
          npx playwright install --with-deps chromium
      - name: Exercise candidate wallet against actual local contracts (never public broadcast)
        env:
          K11520_BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/k11520-capital-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node "K線西遊記/temples/11520/tests/11520-browser-settlement.mjs" --local-candidate
          git diff --exit-code
      - name: Upload actual local EVM mobile wallet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capital-wallet-local-evm-${{ github.sha }}
          path: artifacts/11520-candidate-wallet-qa/
          if-no-files-found: error

  m1-readonly-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned M1 read-only browser dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 three@0.180.0 ethers@6.15.0
          npx playwright install --with-deps chromium
      - name: M1 real BSC97 reads through synthetic EIP-1193 without any signer
        env:
          K11520_BASE_URL: http://127.0.0.1:4173
          BSC_TESTNET_RPC_URL: https://bsc-testnet-dataseed.bnbchain.org
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/k11520-m1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node "K線西遊記/temples/11520/tests/11520-browser-settlement.mjs" --m1-read-only \
            --read-only-accounts=0x3a909988E4d5c9C2326A7a0596714482AB25eE0A,0x6BE8fb4320d46475e2C5e9ba55DFB9F3573FFE11
          git diff --exit-code
      - name: Preserve M1 read-only evidence and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-readonly-wallet-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/11520-m1-readonly-qa/
          if-no-files-found: error
