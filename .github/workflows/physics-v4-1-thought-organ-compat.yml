name: Physics V4.1 Thought Organ Compatibility

on:
  push:
    branches:
      - codex/physics-civilization-full-runtime-v4-1
    paths:
      - .github/workflows/physics-v4-1-thought-organ-compat.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply proposed V4.1 compatibility patch in worktree only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          version = Path('docs/physics/KGEN_Universe_Physics_Runtime_V4_1.md')
          current = Path('docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md')
          worker = Path('core/jobs/public-read-only-worker.mjs')
          canonical = Path('core/data/canonical.json')
          text = version.read_text(encoding='utf-8')
          if 'VERSION: CURRENT / V4.1 CUMULATIVE LIVING PHYSICS' not in text:
              text = text.replace('VERSION: V4.1 CUMULATIVE LIVING PHYSICS\n', 'VERSION: CURRENT / V4.1 CUMULATIVE LIVING PHYSICS\nDOC_ID: PF-PHYSICS-CURRENT-V4-1\n', 1)
          version.write_text(text, encoding='utf-8', newline='\n')
          current.write_text(text, encoding='utf-8', newline='\n')
          w = worker.read_text(encoding='utf-8')
          w = w.replace(
            'const binding = seed?.next_stage?.thought_organ_binding_v3_8 ?? seed?.lives?.find((life) => life.life_id === "DIGITAL_ANT_0001")?.thought_organs?.[0];',
            'const binding = seed?.next_stage?.thought_organ_binding_current ?? seed?.next_stage?.thought_organ_binding_v3_8 ?? seed?.lives?.find((life) => life.life_id === "DIGITAL_ANT_0001")?.thought_organs?.find((organ) => organ.status === "ACTIVE") ?? seed?.lives?.find((life) => life.life_id === "DIGITAL_ANT_0001")?.thought_organs?.[0];', 1)
          w = w.replace(
            'const versionMatch = text.match(/^VERSION:\\s*CURRENT\\s*\\/\\s*(V3\\.8[^\\\\\\r\\n]*)/m);',
            'const versionMatch = text.match(/^VERSION:\\s*(?:CURRENT\\s*\\/\\s*)?([^\\\\\\r\\n]+)/m);', 1)
          worker.write_text(w, encoding='utf-8', newline='\n')
          data = json.loads(canonical.read_text(encoding='utf-8'))
          ant = next(l for l in data['lives'] if l['life_id']=='DIGITAL_ANT_0001')
          old = ant['thought_organs'][0]
          sha = hashlib.sha256(text.replace('\r\n','\n').encode()).hexdigest()
          new = dict(old)
          new.update({'binding_id':'DIGITAL_ANT_0001_PHYSICS_THOUGHT_ORGAN_V4_1','document_id':'PF-PHYSICS-CURRENT-V4-1','version':'V4.1 CUMULATIVE LIVING PHYSICS','sha256':sha,'status':'ACTIVE','loaded_at':'2026-08-20T00:00:00.000Z'})
          data.setdefault('next_stage', {})['thought_organ_binding_current'] = new
          ant.setdefault('thought_organs', []).append(new)
          canonical.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8', newline='\n')
          PY

      - name: Run suite and build compact TAP diagnosis
        shell: bash
        run: |
          set +e
          node --test tests/universal-exchange.test.mjs > "$RUNNER_TEMP/full.log" 2>&1
          code=$?
          set -e
          mkdir -p "$RUNNER_TEMP/diag"
          {
            echo "EXIT_CODE=$code"
            echo "=== FAILING TESTS ==="
            grep -nE '^not ok|^# Subtest:|failureType:|error:|code:|expected:|actual:|operator:|AssertionError|ERR_ASSERTION|VERSION_MISMATCH|HASH_MISMATCH|DOCUMENT_ID_MISMATCH' "$RUNNER_TEMP/full.log" | tail -n 500 || true
            echo "=== TAP SUMMARY ==="
            tail -n 80 "$RUNNER_TEMP/full.log"
          } > "$RUNNER_TEMP/diag/CI_THOUGHT_ORGAN_COMPAT_FAILURE_COMPACT.txt"
          cat "$RUNNER_TEMP/diag/CI_THOUGHT_ORGAN_COMPAT_FAILURE_COMPACT.txt"
          echo "$code" > "$RUNNER_TEMP/diag/exit_code"

      - name: Save compact diagnosis only
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat "$RUNNER_TEMP/diag/exit_code")"
          git reset --hard HEAD
          mkdir -p docs/physics/archive/v4_1_reconciliation
          cp "$RUNNER_TEMP/diag/CI_THOUGHT_ORGAN_COMPAT_FAILURE_COMPACT.txt" docs/physics/archive/v4_1_reconciliation/CI_THOUGHT_ORGAN_COMPAT_FAILURE_COMPACT.txt
          rm -f docs/physics/archive/v4_1_reconciliation/CI_THOUGHT_ORGAN_COMPAT_FAILURE.txt
          git config user.name 'physics-v4-1-diagnose'
          git config user.email 'physics-v4-1-diagnose@users.noreply.github.com'
          git add -A docs/physics/archive/v4_1_reconciliation
          git commit -m "Record compact V4.1 compatibility diagnosis (exit $code)"
          git push origin HEAD:codex/physics-civilization-full-runtime-v4-1
