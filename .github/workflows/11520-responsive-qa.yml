name: 11520 Responsive Product QA
on:
  pull_request:
    paths:
      - 'K線西遊記/temples/11520/**'
      - 'assets/kaios-audio*'
      - '.github/workflows/11520-responsive-qa.yml'
  push:
    branches: [main]
    paths:
      - 'K線西遊記/temples/11520/**'
      - 'assets/kaios-audio*'
      - '.github/workflows/11520-responsive-qa.yml'
  workflow_run:
    workflows: ['Deploy Pages Static']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      production:
        description: 'Read-only QA of public Pages instead of local candidate'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: responsive-11520-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.production || false }}
  cancel-in-progress: true
jobs:
  contextual-hud:
    # One additional bounded runner per candidate/public batch. Reuse this
    # existing harness and artifact route; no separate dispatch or poll loop.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Verify six-size contextual HUD at the exact head
        env:
          PUBLIC_QA: ${{ inputs.production || github.event_name == 'workflow_run' }}
          K11520_CONTEXTUAL_QA: '1'
          K11520_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/k11520-contextual-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          if [ "$PUBLIC_QA" = true ]; then
            export K11520_BASE_URL='https://klineodyssey.github.io/kline-odyssey'
            export K11520_PRODUCTION_QA=1
          fi
          node 'K線西遊記/temples/11520/tests/11520-browser-responsive.mjs'
          python3 - <<'PYQA'
          import json, pathlib, os
          out=pathlib.Path('artifacts/11520-responsive-qa')
          report=json.loads((out/'contextual-report.json').read_text())
          assert report['head']==os.environ['K11520_SOURCE_SHA'], 'Evidence head mismatch'
          assert report['failures']==[], report['failures']
          assert {(r['profile']['width'],r['profile']['height']) for r in report['reports']}=={(360,740),(390,844),(412,772),(432,856),(480,900),(844,390)}
          for result in report['reports']:
              name=result['profile']['name']
              for state in ['contextual-world','settings-owned','settings-preferences-retained','wallet-restored','contextual-recenter','contextual-market-expanded','contextual-market-hidden','contextual-courier-active','active-courier-settings-owned','contextual-full-idle-hidden']:
                  image=out/f'{name}-{state}.png'
                  assert image.is_file() and image.stat().st_size>1000, f'Missing screenshot: {image}'
              if result['profile']['width']==390 or result['profile'].get('landscape'):
                  assert result.get('interruptedRails'), 'Missing native interruption result'
                  image=out/f'{name}-settings-interrupted-rails.png'
                  assert image.is_file() and image.stat().st_size>1000, f'Missing interruption screenshot: {image}'
          if report['production']:
              assert report['sourceChecks'] and all(x['match'] for x in report['sourceChecks']), 'Public source provenance missing'
          PYQA
      - name: Preserve contextual HUD screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 11520-contextual-hud-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
          path: artifacts/11520-responsive-qa/
          if-no-files-found: error
          retention-days: 14
  world-first:
    if: github.event_name != 'workflow_run' && inputs.production != true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Minimal world / camera / market-life real-input QA
        env:
          K11520_WORLD_FIRST_QA: '1'
          K11520_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/k11520-world-first-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node 'K線西遊記/temples/11520/tests/11520-browser-responsive.mjs'
      - name: Preserve world visibility and gesture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 11520-world-first-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/11520-responsive-qa/
          if-no-files-found: error
          retention-days: 14
  responsive:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Test real-entry mobile layouts
        env:
          PUBLIC_QA: ${{ inputs.production || github.event_name == 'workflow_run' }}
          K11520_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/k11520-responsive-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          if [ "$PUBLIC_QA" = true ]; then
            export K11520_BASE_URL='https://klineodyssey.github.io/kline-odyssey'
            export K11520_PRODUCTION_QA=1
          fi
          node 'K線西遊記/temples/11520/tests/11520-browser-responsive.mjs'
          if [ "$PUBLIC_QA" != true ]; then
            timeout 100s node 'K線西遊記/temples/11520/tests/11520-browser-character-status.mjs' 2>&1 | tee artifacts/11520-responsive-qa/character-status-test.log
            if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_EVENT_NAME" = push ]; then
              # Identical local script is mandatory in Game/product-qa, including
              # its RC and screenshot gates. This reference is NOT a PASS;
              # release still requires that exact-tree Game job to succeed.
              python3 - <<'PYHUD'
          import hashlib, json, os, pathlib, subprocess
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['K11520_SOURCE_SHA'], 'Coverage reference head mismatch'
          script=pathlib.Path('K線西遊記/temples/11520/tests/11520-browser-mobile-hud.mjs')
          evidence={'head':head,'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'script':str(script),'scriptSha256':hashlib.sha256(script.read_bytes()).hexdigest(),
              'requiredWorkflow':'11520 Game Product QA','requiredJob':'product-qa','requiredConclusion':'success',
              'evidenceIsReferenceOnly':True,'localUrl':'http://127.0.0.1:4173',
              'requiredScreenshots':['11520-mobile-hud-3rail.png','11520-mobile-hud-collapsed.png'],
              'artifact':'11520-runtime-visual-qa-<Game checkout SHA>','matchingRule':'same head or merge commit with identical tree'}
          pathlib.Path('artifacts/11520-responsive-qa/mobile-hud-required-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PYHUD
            else
              # Standalone local dispatch has no companion Game trigger.
              timeout 180s node 'K線西遊記/temples/11520/tests/11520-browser-mobile-hud.mjs' 2>&1 | tee artifacts/11520-responsive-qa/mobile-hud-test.log
            fi
          fi
      - name: Preserve screenshots and focused failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 11520-responsive-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
          path: artifacts/11520-responsive-qa/
          if-no-files-found: error
          retention-days: 14
  m1-public-readonly:
    # Explicit release verification only: no automatic deployment fan-out.
    # The existing production dispatch runs general public QA first, then M1.
    needs: responsive
    if: github.event_name == 'workflow_dispatch' && inputs.production == true
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install pinned read-only browser dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 three@0.180.0 ethers@6.15.0
          npx playwright install --with-deps chromium
      - name: Verify public source and six-size current wallet identities
        env:
          K11520_BASE_URL: https://klineodyssey.github.io/kline-odyssey
          K11520_SOURCE_SHA: ${{ github.sha }}
          BSC_TESTNET_RPC_URL: https://bsc-testnet-dataseed.bnbchain.org
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify-m1-public-assets.py" <<'PY'
          """Fail closed unless public M1 assets equal the checked-out deployment commit."""
          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.parse import quote, urlparse
          from urllib.request import urlopen

          parser = argparse.ArgumentParser()
          parser.add_argument('--phase', choices=['before', 'after'], required=True)
          args = parser.parse_args()
          expected = os.environ['K11520_SOURCE_SHA']
          base = os.environ['K11520_BASE_URL'].rstrip('/')
          assert re.fullmatch(r'[0-9a-f]{40}', expected), 'INVALID_SOURCE_SHA'
          assert base == 'https://klineodyssey.github.io/kline-odyssey', 'UNEXPECTED_PUBLIC_ORIGIN'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected, 'CHECKOUT_SOURCE_MISMATCH'
          root = Path('artifacts/11520-m1-readonly-qa')
          root.mkdir(parents=True, exist_ok=True)
          report = {'sourceSha': expected, 'phase': args.phase, 'base': base, 'assets': [], 'status': 'PENDING'}

          def read_public(path):
              with urlopen(base + '/' + quote(path, safe='/'), timeout=30) as response:
                  assert response.status == 200, 'PUBLIC_ASSET_HTTP_ERROR'
                  assert urlparse(response.url).netloc == 'klineodyssey.github.io', 'PUBLIC_ASSET_REDIRECT'
                  return response.read()

          try:
              info = json.loads(read_public('KGEN-KAIOS/dashboard/build-info.json'))
              report['deployedCommit'] = info.get('main_commit')
              assert info.get('main_commit') == expected, 'PUBLIC_DEPLOYMENT_SHA_MISMATCH'
              paths = ['K線西遊記/temples/11520/game-5d.html', 'docs/K11520_BSC_TESTNET_DEPLOYMENT_MANIFEST.json', 'K線西遊記/assets/ethers-5.7.2.umd.min.js']
              paths += ['K線西遊記/temples/11520/runtime/' + name for name in [
                  'game-5d-main.mjs', 'game-5d-bootstrap.mjs', 'game-ui-product-fixes.mjs',
                  'real-trading-order-intent.mjs', 'real-trading-preflight-ui.mjs',
                  'wallet-game-bridge.mjs', 'evm-wallet-runtime.mjs',
                  'market-origin-wallet-layout-runtime.mjs', 'public-market-quotes.mjs',
                  'mobile-control-layout.mjs', 'mobile-ui-settings.mjs', 'game-mobile-shell.mjs']]
              report['coverageScope'] = 'EXPLICIT_M1_WALLET_AND_HUD_ASSETS_ONLY'
              report['wholeModuleGraphVerified'] = False
              for path in paths:
                  actual, local = read_public(path), Path(path).read_bytes()
                  same = actual == local
                  report['assets'].append({'path': path, 'sha256': hashlib.sha256(actual).hexdigest(), 'matchesCheckout': same})
                  assert same, 'PUBLIC_ASSET_SOURCE_MISMATCH: ' + path
              # A deployment changing during the asset reads must not certify a mixed page.
              assert json.loads(read_public('KGEN-KAIOS/dashboard/build-info.json')).get('main_commit') == expected, 'PUBLIC_DEPLOYMENT_CHANGED'
              report['status'] = 'PASS'
          except Exception as error:
              report['status'] = 'FAIL'
              report['error'] = str(error)
              raise
          finally:
              (root / ('public-source-' + args.phase + '.json')).write_text(json.dumps(report, indent=2) + '\n')
          PY
          python3 "$RUNNER_TEMP/verify-m1-public-assets.py" --phase before
          node 'K線西遊記/temples/11520/tests/11520-browser-settlement.mjs' --m1-read-only \
            --read-only-accounts=0x3a909988E4d5c9C2326A7a0596714482AB25eE0A,0x6BE8fb4320d46475e2C5e9ba55DFB9F3573FFE11
          python3 "$RUNNER_TEMP/verify-m1-public-assets.py" --phase after
          git diff --exit-code
      - name: Preserve deployed M1 source, method counts and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 11520-public-m1-${{ github.sha }}-${{ github.event_name }}
          path: artifacts/11520-m1-readonly-qa/
          if-no-files-found: error
          retention-days: 14
  public-input-diagnostics:
    # Bounded facing follow-up only; never an always-on duplicate lane.
    if: github.event_name == 'pull_request' && github.head_ref == 'dot/11520-facing-standoff-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      K11520_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      K11520_PUBLIC_ASSET_SHA: b513d4e7ca87ebfb5adf5c03b8d2c26ff834b720
      K11520_BASE_URL: https://klineodyssey.github.io/kline-odyssey
      K11520_PRODUCTION_QA: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Verify deployed source provenance
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          info=json.load(urllib.request.urlopen(os.environ['K11520_BASE_URL']+'/KGEN-KAIOS/dashboard/build-info.json', timeout=20))
          evidence={'harness_head':os.environ['K11520_SOURCE_SHA'],'expected_public_head':os.environ['K11520_PUBLIC_ASSET_SHA'],'build_info':info}
          out=pathlib.Path('artifacts/11520-responsive-qa');out.mkdir(parents=True,exist_ok=True)
          (out/'public-diagnostic-provenance.json').write_text(json.dumps(evidence,indent=2)+'\n')
          assert info['main_commit']==os.environ['K11520_PUBLIC_ASSET_SHA'], 'Public deployment moved; reconcile before diagnostics'
          PY
      - name: Observe public gameplay in isolated local simulation
        # No connected wallet, signer, transactions, server writes or deployment.
        # The existing harness verifies all public runtime asset fingerprints.
        run: node 'K線西遊記/temples/11520/tests/11520-browser-responsive.mjs'
      - name: Preserve public diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 11520-public-input-diagnostics-${{ github.event.pull_request.head.sha }}
          path: artifacts/11520-responsive-qa/
          if-no-files-found: error
          retention-days: 14
