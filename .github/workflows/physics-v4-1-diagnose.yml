name: Physics V4.1 Thought Organ Diagnostic

on:
  push:
    branches:
      - codex/physics-civilization-full-runtime-v4-1
    paths:
      - .github/workflows/physics-v4-1-diagnose.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply migration in workspace only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          version=Path('docs/physics/KGEN_Universe_Physics_Runtime_V4_1.md')
          current=Path('docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md')
          worker=Path('core/jobs/public-read-only-worker.mjs')
          canonical=Path('core/data/canonical.json')
          text=version.read_text(encoding='utf-8')
          text=text.replace('VERSION: V4.1 CUMULATIVE LIVING PHYSICS\n','VERSION: CURRENT / V4.1 CUMULATIVE LIVING PHYSICS\nDOC_ID: PF-PHYSICS-CURRENT-V4-1\n',1)
          version.write_text(text,encoding='utf-8',newline='\n'); current.write_text(text,encoding='utf-8',newline='\n')
          w=worker.read_text(encoding='utf-8')
          w=w.replace('const binding = seed?.next_stage?.thought_organ_binding_v3_8 ?? seed?.lives?.find((life) => life.life_id === "DIGITAL_ANT_0001")?.thought_organs?.[0];','const binding = seed?.next_stage?.thought_organ_binding_current ?? seed?.next_stage?.thought_organ_binding_v3_8 ?? seed?.lives?.find((life) => life.life_id === "DIGITAL_ANT_0001")?.thought_organs?.find((organ) => organ.status === "ACTIVE") ?? seed?.lives?.find((life) => life.life_id === "DIGITAL_ANT_0001")?.thought_organs?.[0];',1)
          w=w.replace('const versionMatch = text.match(/^VERSION:\\s*CURRENT\\s*\\/\\s*(V3\\.8[^\\\\\\r\\n]*)/m);','const versionMatch = text.match(/^VERSION:\\s*(?:CURRENT\\s*\\/\\s*)?([^\\\\\\r\\n]+)/m);',1)
          worker.write_text(w,encoding='utf-8',newline='\n')
          data=json.loads(canonical.read_text(encoding='utf-8'))
          ant=next(x for x in data['lives'] if x['life_id']=='DIGITAL_ANT_0001')
          old=ant['thought_organs'][0]; sha=hashlib.sha256(text.replace('\r\n','\n').encode()).hexdigest(); new=dict(old)
          new.update(binding_id='DIGITAL_ANT_0001_PHYSICS_THOUGHT_ORGAN_V4_1',document_id='PF-PHYSICS-CURRENT-V4-1',version='V4.1 CUMULATIVE LIVING PHYSICS',sha256=sha,status='ACTIVE',compatibility='DIGITAL_ANT_APP_0001_V1_6_0_COMPATIBLE')
          data.setdefault('next_stage',{})['thought_organ_binding_current']=new
          ant.setdefault('thought_organs',[]).append(new)
          canonical.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
      - name: Run tests and emit compact diagnosis
        id: tests
        shell: bash
        run: |
          set +e
          node --test tests/universal-exchange.test.mjs > "$RUNNER_TEMP/full.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          grep -E -B4 -A12 'not ok|AssertionError|ERR_ASSERTION|error:|failureType|expected:|actual:' "$RUNNER_TEMP/full.log" | head -300 > "$RUNNER_TEMP/summary.txt" || true
          cat "$RUNNER_TEMP/summary.txt"
          exit 0
      - name: Save compact diagnosis on failure
        if: steps.tests.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/physics/archive/v4_1_reconciliation
          cp "$RUNNER_TEMP/summary.txt" docs/physics/archive/v4_1_reconciliation/CI_THOUGHT_ORGAN_DIAGNOSIS.txt
          git config user.name 'physics-v4-1-diagnose'
          git config user.email 'physics-v4-1-diagnose@users.noreply.github.com'
          git add docs/physics/archive/v4_1_reconciliation/CI_THOUGHT_ORGAN_DIAGNOSIS.txt
          git commit -m 'Record compact V4.1 thought-organ test diagnosis'
          git push origin HEAD:codex/physics-civilization-full-runtime-v4-1
      - name: Mark diagnostic pass
        if: steps.tests.outputs.exit_code == '0'
        run: echo 'V4.1 thought-organ workspace migration passes Universal Exchange tests.'
