name: Sol Yaoce Proposal Safety

on:
  push:
    branches:
      - codex/sol-yaoce-t1-onboarding-v1
    paths:
      - KGEN-KAIOS/decision/decision_log.jsonl
      - KGEN-KAIOS/workforce/recruitment_queue.json
      - KGEN-Organization/WorkOrders/WORK_QUEUE.md
      - .github/workflows/sol_yaoce_proposal_safety.yml
  pull_request:
    paths:
      - KGEN-KAIOS/decision/decision_log.jsonl
      - KGEN-KAIOS/workforce/recruitment_queue.json
      - KGEN-Organization/WorkOrders/WORK_QUEUE.md
      - .github/workflows/sol_yaoce_proposal_safety.yml

permissions:
  contents: read

jobs:
  proposal-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate neutral proposal boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          decision_path = Path("KGEN-KAIOS/decision/decision_log.jsonl")
          queue_path = Path("KGEN-KAIOS/workforce/recruitment_queue.json")
          work_path = Path("KGEN-Organization/WorkOrders/WORK_QUEUE.md")
          forbidden_authority = "KAIOS_HUMAN_T1_ONBOARDING_AUTHORIZATION_V1"

          decisions = [json.loads(line) for line in decision_path.read_text().splitlines() if line.strip()]
          queue = json.loads(queue_path.read_text())
          work = work_path.read_text()

          proposal = next(
              item for item in decisions
              if item.get("decision_id") == "PROPOSAL-SOL-YAOCE-T1-ONBOARDING-001-20260823"
          )
          candidate = next(
              item for item in queue.get("candidates", [])
              if item.get("candidate_id") == "sol-yaoce-reviewer-candidate-001"
          )

          checks = [
              ("decision is proposal-only", proposal.get("decision_type") == "T1_CANDIDATE_ONBOARDING_PROPOSAL"),
              ("decision is HUMAN_REQUIRED", proposal.get("status") == "HUMAN_REQUIRED_IDENTITY_CHECK_HOLD"),
              ("no approver is manufactured", proposal.get("approver") is None),
              ("delegated authority remains HUMAN_REQUIRED", proposal.get("delegated_authority") == "HUMAN_REQUIRED"),
              ("queue provenance is preserved", queue.get("metadata", {}).get("task_id") == "KGEN-WORKFORCE-ROSTER-2026-0001"),
              ("new task is appended as related", "KAIOS-SOL-YAOCE-AI-COMPANY-INDEPENDENT-REVIEWER-INTERVIEW-V1-001" in queue.get("metadata", {}).get("related_task_ids", [])),
              ("candidate status is proposal-only", candidate.get("status") == "PROPOSED_HUMAN_REQUIRED"),
              ("onboarding level is not authorized", candidate.get("authorized_onboarding_level") is None),
              ("Human authorization is absent", candidate.get("human_authorization") is None),
              ("trial remains dispatch-held", candidate.get("trial_dispatch_status") == "HOLD_HUMAN_DECISION_IDENTITY_AND_ACKNOWLEDGMENTS_REQUIRED"),
              ("WorkQueue owner is unassigned", "| KAIOS-SOL-YAOCE-LIFECYCLE-ROLE-SEPARATION-DRYRUN-001 | HOLD | UNASSIGNED |" in work),
              ("WorkQueue records unbound authority", "Human authorization: NOT BOUND (`HUMAN_REQUIRED`)" in work),
          ]

          joined = decision_path.read_text() + queue_path.read_text() + work
          checks.append(("self-authenticating authority token is absent", forbidden_authority not in joined))

          failed = [name for name, ok in checks if not ok]
          if failed:
              for name in failed:
                  print(f"FAIL: {name}")
              raise SystemExit(1)

          for name, _ in checks:
              print(f"PASS: {name}")
          print(f"{len(checks)}/{len(checks)} PASS")
          PY
      - name: Validate whitespace
        run: git diff --check
