name: KAIOS UFO App Organ Life Review

on:
  pull_request:
    paths:
      - 'KGEN-KAIOS/contracts/KAIOSUFOOrganRuntimeV1.sol'
      - 'KGEN-KAIOS/contracts/KAIOSUFOLifeV1.sol'
      - 'KGEN-KAIOS/contracts/KAIOSUFOPropulsionPhysicsV1.sol'
      - 'KGEN-KAIOS/app/ufo-runtime-v1.mjs'
      - 'KGEN-KAIOS/tests/ufo-app-runtime.unit.test.mjs'
      - 'KGEN-KAIOS/tests/ufo-propulsion-physics.evm.test.mjs'
      - 'KGEN-KAIOS/docs/UFO_APP_ORGAN_LIFE_SPEC_V1.md'
      - 'KGEN-KAIOS/docs/UFO_PROPULSION_MASS_ENERGY_WHITEPAPER_V1.md'
      - '.github/workflows/kaios-ufo-app-organ-life-review.yml'
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --force --ignore-scripts --no-audit --no-fund
        working-directory: KGEN-KAIOS
      - run: npm run compile
        working-directory: KGEN-KAIOS
      - run: node --test --test-concurrency=1 tests/ufo-app-runtime.unit.test.mjs tests/ufo-propulsion-physics.evm.test.mjs
        working-directory: KGEN-KAIOS
      - run: git diff --check HEAD^ HEAD
