name: KGEN Autopilot Core

on:
  workflow_call:
    inputs:
      source_event:
        required: false
        type: string
        default: "unknown"
  pull_request:
    paths:
      - ".github/workflows/_autopilot_core.yml"

permissions:
  contents: read

jobs:
  autopilot:
    runs-on: ubuntu-latest
    concurrency:
      group: kgen-autopilot-core-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${expected}"
          echo "verified_sha=${actual}"

      - name: Hold until reviewed pipeline builder is wired
        shell: bash
        run: |
          set -euo pipefail
          source_event="${{ inputs.source_event || github.event_name }}"
          echo "source_event=${source_event}"
          if [ -e "scripts/build_kgen_pipeline.py" ]; then
            echo "::error::Autopilot builder exists but this core remains fail-closed pending explicit reviewed wiring."
            exit 1
          fi
          echo "AUTOPILOT_CORE_HOLD_NO_BUILDER"
          echo "Repository mutation is disabled: no write token, no persisted checkout credential, no commit/push step."
