name: Archive Physics V4.1 reconciliation

on:
  push:
    branches:
      - codex/physics-civilization-full-runtime-v4-1
    paths:
      - .github/workflows/build-physics-v4-1-cumulative.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-reconciliation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revalidate installed twins
        shell: bash
        run: |
          set -euo pipefail
          v38='docs/physics/KGEN_Universe_Physics_Runtime_V3_8.md'
          v41='docs/physics/KGEN_Universe_Physics_Runtime_V4_1.md'
          cur='docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md'
          cmp -s "$v41" "$cur"
          test "$(git hash-object "$v38")" = '6eaa6d14d19f4f6d06d9172f1bd1a5cd55b35fcc'
          grep -Fq '# PART 114. V3.8 Signature' "$v41"
          grep -Fq 'GLOBAL_LINEAR_K_INDEX_TO_KM = SUPERSEDED' "$v41"
          grep -Fq 'K280_YEAR_SECONDS = 31,556,926' "$v41"

      - name: Archive absorbed reconciliation evidence
        shell: bash
        run: |
          set -euo pipefail
          src='docs/physics/reconciliation'
          dst='docs/physics/archive/v4_1_reconciliation'
          mkdir -p "$dst"
          shopt -s nullglob
          files=("$src"/*.md)
          test "${#files[@]}" -gt 0
          git mv "${files[@]}" "$dst"/

          cat > "$dst/README.md" <<'EOF'
          # Physics V4.1 Reconciliation Archive

          STATUS: ARCHIVED
          SOURCE_OF_TRUTH: FALSE
          DO_NOT_USE_FOR_IMPLEMENTATION: TRUE
          SUPERSEDED_BY: ../../KGEN_Universe_Physics_Runtime_CURRENT.md
          VERSION_TWIN: ../../KGEN_Universe_Physics_Runtime_V4_1.md
          ARCHIVED_AT: 2026-08-20 Asia/Taipei

          These files are preserved as reconciliation, audit, supersession and construction evidence for the V4.1 cumulative Physics installation. Their accepted active content has been absorbed into the V4.1/CURRENT twin. Historical conflicts remain here for auditability; implementation must read CURRENT.
          EOF

          git rm .github/workflows/build-physics-v4-1-cumulative.yml

      - name: Commit archive cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'physics-v4-1-archiver'
          git config user.email 'physics-v4-1-archiver@users.noreply.github.com'
          git add -A
          git commit -m 'Archive absorbed Physics V4.1 reconciliation evidence'
          git push origin HEAD:codex/physics-civilization-full-runtime-v4-1
