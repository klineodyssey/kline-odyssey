name: 11520 Universal Exchange V2

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "2,7 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "core/**"
      - "KAIOS/software-life/**"
      - "assets/kaios-audio.mjs"
      - "KAIOS_CANONICAL_LIFE_SCHEMA_V1.json"
      - "KGEN-KAIOS/provenance/ORGANISM_MANIFEST_SCHEMA.json"
      - "KGEN-KAIOS/organism/taxonomy_registry.json"
      - "KGEN-KAIOS/civilization/BIOLOGY_TAXONOMY_STANDARD.md"
      - "tests/universal-exchange.test.mjs"
      - "tests/autonomous-company-engineering-cycle.test.mjs"
      - "tests/universal-exchange-workflow-security.test.mjs"
      - "K線西遊記/temples/11520/**"
      - "docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md"
      - ".github/ISSUE_TEMPLATE/civilization-request.yml"
      - ".github/workflows/kgen-cursor-dispatch-wake.yml"
      - ".github/workflows/universal_exchange_v2.yml"
  pull_request:
    paths:
      - "core/**"
      - "KAIOS/software-life/**"
      - "assets/kaios-audio.mjs"
      - "KAIOS_CANONICAL_LIFE_SCHEMA_V1.json"
      - "KGEN-KAIOS/provenance/ORGANISM_MANIFEST_SCHEMA.json"
      - "KGEN-KAIOS/organism/taxonomy_registry.json"
      - "KGEN-KAIOS/civilization/BIOLOGY_TAXONOMY_STANDARD.md"
      - "tests/universal-exchange.test.mjs"
      - "tests/autonomous-company-engineering-cycle.test.mjs"
      - "tests/universal-exchange-workflow-security.test.mjs"
      - "K線西遊記/temples/11520/**"
      - "docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md"
      - ".github/workflows/kgen-cursor-dispatch-wake.yml"
      - ".github/workflows/universal_exchange_v2.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Confirm exact pull request head and clean patch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          git diff --check "$BASE_SHA"...HEAD
      - name: Scan exact pull request patch for concrete secret literals
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/continuity-anchor.patch"
          git diff --unified=0 "$BASE_SHA"...HEAD > "$patch"
          if grep -Eiq -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9_-]{20,}|(ghp_|github_pat_)[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|bearer[[:space:]]+[A-Za-z0-9._~-]{20,}' "$patch"; then
            echo "Concrete secret-like literal detected in exact-head patch." >&2
            exit 1
          fi
      - name: Validate ES modules
        shell: bash
        run: find core tests -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Require complete Software Life Git history
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "SOFTWARE_LIFE_FULL_HISTORY_REQUIRED" >&2
            exit 1
          fi
          # Checkout omits .git; preserve the formal validator's exact URL check.
          # Check stored AND effective URLs so aliases cannot hide a foreign origin.
          mapfile -d '' -t origins < <(git config --null --get-all remote.origin.url)
          if [ "${#origins[@]}" -ne 1 ]; then
            echo "SOFTWARE_LIFE_CANONICAL_ORIGIN_REQUIRED" >&2
            exit 1
          fi
          origin="${origins[0]}"
          case "$origin" in
            https://github.com/klineodyssey/kline-odyssey|https://github.com/klineodyssey/kline-odyssey.git) ;;
            *) echo "SOFTWARE_LIFE_CANONICAL_ORIGIN_REQUIRED" >&2; exit 1 ;;
          esac
          # The sentinel retains trailing URL newlines, which $() alone removes.
          effective_origin="$(git remote get-url origin && printf '\001')"
          if [ "$effective_origin" != "$origin"$'\n\001' ]; then
            echo "SOFTWARE_LIFE_ORIGIN_REWRITE_FORBIDDEN" >&2
            exit 1
          fi
          if [ "$origin" = "https://github.com/klineodyssey/kline-odyssey" ]; then
            git remote set-url origin https://github.com/klineodyssey/kline-odyssey.git
          fi
          mapfile -d '' -t origins < <(git config --null --get-all remote.origin.url)
          test "${#origins[@]}" -eq 1
          test "${origins[0]}" = "https://github.com/klineodyssey/kline-odyssey.git"
          test "$(git remote get-url origin && printf '\001')" = $'https://github.com/klineodyssey/kline-odyssey.git\n\001'
          # Existing immutable authority and candidate source epochs, not new pins.
          for anchor in cc80135f2c6e6a74aad11f34e793c65ac0ee1938 e26f3a76ef0be7f43058225f46def3fbe123371e; do
            git cat-file -e "$anchor^{commit}"
            git merge-base --is-ancestor "$anchor" HEAD
          done
          # The existing transplant suite locates these historical fixtures by subject.
          for subject in \
            "test(kaios): bind semantic transplant evidence fixture" \
            "fix(kaios): allow completed transplant projections" \
            "test(kaios): add completion provenance fixture projection"; do
            fixture="$(git log -1 --format=%H --fixed-strings --grep="$subject")"
            if [ -z "$fixture" ]; then
              echo "SOFTWARE_LIFE_FIXTURE_HISTORY_MISSING: $subject" >&2
              exit 1
            fi
            git cat-file -e "$fixture^{commit}"
            git merge-base --is-ancestor "$fixture" HEAD
          done
          printf 'Software Life full history verified at %s\n' "$(git rev-parse HEAD)"
      - name: Run complete Software Life suites
        shell: bash
        run: |
          node --test \
            KAIOS/software-life/tests/software-organ-standards.test.mjs \
            KAIOS/software-life/tests/software-life-registry.test.mjs \
            KAIOS/software-life/tests/software-life-naming-audit.test.mjs
      - name: Run Continuity Anchor targeted tests
        run: node --test tests/starforge-spirit-life-genesis.test.mjs
      - name: Run full existing Node tests
        shell: bash
        run: node --test tests/*.test.mjs
      - name: Run Universal Exchange tests
        shell: bash
        run: |
          node --test tests/universal-exchange.test.mjs
          node --test tests/autonomous-company-engineering-cycle.test.mjs
          node --test tests/universal-exchange-workflow-security.test.mjs
          node --test tests/11520-kgen-native-market-cell.test.mjs

  digital-ant-public-read-only-worker:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    concurrency:
      group: digital-ant-public-hourly-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run one independent read-only hourly or ignition-window cycle
        env:
          BSC_RPC_URL: ${{ vars.BSC_RPC_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node core/jobs/public-read-only-worker.mjs \
            --status "K線西遊記/temples/11520/runtime/worker-status.json" \
            --events-dir "K線西遊記/temples/11520/runtime/work-events" \
            --output "$RUNNER_TEMP/digital-ant-hourly-worker.json"
      - name: Preserve public Work Event evidence without repository mutation
        uses: actions/upload-artifact@v7
        with:
          name: digital-ant-hourly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/digital-ant-hourly-worker.json
            K線西遊記/temples/11520/runtime/worker-status.json
          if-no-files-found: error
          retention-days: 30
