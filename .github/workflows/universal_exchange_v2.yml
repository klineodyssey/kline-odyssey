name: 11520 Universal Exchange V2

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "2,7 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "core/**"
      - "tests/universal-exchange.test.mjs"
      - "tests/autonomous-company-engineering-cycle.test.mjs"
      - "tests/universal-exchange-workflow-security.test.mjs"
      - "K線西遊記/temples/11520/**"
      - "docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md"
      - ".github/ISSUE_TEMPLATE/civilization-request.yml"
      - ".github/workflows/kgen-cursor-dispatch-wake.yml"
      - ".github/workflows/universal_exchange_v2.yml"
  pull_request:
    paths:
      - "core/**"
      - "tests/universal-exchange.test.mjs"
      - "tests/autonomous-company-engineering-cycle.test.mjs"
      - "tests/universal-exchange-workflow-security.test.mjs"
      - "K線西遊記/temples/11520/**"
      - "docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md"
      - ".github/workflows/kgen-cursor-dispatch-wake.yml"
      - ".github/workflows/universal_exchange_v2.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Confirm exact pull request head and clean patch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          git diff --check "$BASE_SHA"...HEAD
      - name: Scan exact pull request patch for concrete secret literals
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/continuity-anchor.patch"
          git diff --unified=0 "$BASE_SHA"...HEAD > "$patch"
          if grep -Eiq -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9_-]{20,}|(ghp_|github_pat_)[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|bearer[[:space:]]+[A-Za-z0-9._~-]{20,}' "$patch"; then
            echo "Concrete secret-like literal detected in exact-head patch." >&2
            exit 1
          fi
      - name: Validate ES modules
        shell: bash
        run: find core tests -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Run Continuity Anchor targeted tests
        run: node --test tests/starforge-spirit-life-genesis.test.mjs
      - name: Run full existing Node tests
        shell: bash
        run: node --test tests/*.test.mjs
      - name: Run Universal Exchange tests
        shell: bash
        run: |
          node --test tests/universal-exchange.test.mjs
          node --test tests/autonomous-company-engineering-cycle.test.mjs
          node --test tests/universal-exchange-workflow-security.test.mjs
          node --test tests/11520-kgen-native-market-cell.test.mjs

  digital-ant-public-read-only-worker:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      actions: read
    concurrency:
      group: digital-ant-public-hourly-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Locate previous Digital Ant runtime evidence
        id: previous-runtime
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: "universal_exchange_v2.yml",
              branch: "main",
              status: "completed",
              per_page: 50
            });
            const candidates = runs
              .filter((run) => String(run.id) !== String(context.runId) && run.status === "completed" && run.head_branch === "main" && ["schedule", "workflow_dispatch"].includes(run.event))
              .sort((a, b) => Number(b.run_number) - Number(a.run_number) || Number(b.run_attempt) - Number(a.run_attempt) || Number(b.id) - Number(a.id));
            for (const run of candidates) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo,
                run_id: run.id,
                per_page: 100
              });
              const expectedName = `digital-ant-hourly-${run.id}-${run.run_attempt}`;
              const artifact = artifacts.find((item) => item.expired !== true && item.name === expectedName);
              if (!artifact) continue;
              core.setOutput("run-id", String(run.id));
              core.setOutput("artifact-name", artifact.name);
              break;
            }
      - name: Download previous Digital Ant runtime evidence
        if: steps.previous-runtime.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.previous-runtime.outputs.artifact-name }}
          path: ${{ runner.temp }}/digital-ant-previous
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous-runtime.outputs.run-id }}
      - name: Restore previous read-only status for consecutive-cycle detection
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digital-ant-runtime/work-events"
          previous_runtime="$RUNNER_TEMP/digital-ant-previous/digital-ant-runtime"
          previous_status="$previous_runtime/worker-status.json"
          previous_events="$previous_runtime/work-events"
          if test -f "$previous_status"; then
            cp "$previous_status" "$RUNNER_TEMP/digital-ant-runtime/worker-status.json"
          fi
          if test -d "$previous_events" && compgen -G "$previous_events/DIGITAL_ANT_0001_HOURLY_*.json" > /dev/null; then
            cp "$previous_events"/DIGITAL_ANT_0001_HOURLY_*.json "$RUNNER_TEMP/digital-ant-runtime/work-events/"
          fi
      - name: Run one independent read-only hourly or ignition-window cycle
        env:
          BSC_RPC_URL: ${{ vars.BSC_RPC_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node core/jobs/public-read-only-worker.mjs \
            --status "$RUNNER_TEMP/digital-ant-runtime/worker-status.json" \
            --events-dir "$RUNNER_TEMP/digital-ant-runtime/work-events" \
            --output "$RUNNER_TEMP/digital-ant-hourly-worker.json"
      - name: Preserve status and actual incident Work Event evidence without repository mutation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digital-ant-hourly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/digital-ant-hourly-worker.json
            ${{ runner.temp }}/digital-ant-runtime/
          if-no-files-found: error
          retention-days: 30
