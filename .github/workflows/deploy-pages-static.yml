name: Deploy Pages Static

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact tag or SHA already reachable from main to publish as the official experimental build
        required: false
        default: main
        type: string
      release_mode:
        description: Public truth label written into build-info.json
        required: false
        default: experimental
        type: choice
        options:
          - experimental
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
          fetch-depth: 0

      - name: Public release secret and protected-IP gate
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          source_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "::error::Official Pages release source must already be reachable from origin/main."
            exit 1
          fi
          if git rev-parse "$source_sha^" >/dev/null 2>&1; then
            scan_base="$(git rev-parse "$source_sha^")"
            changed_files="$(git diff --name-only "$scan_base" "$source_sha")"
            release_diff_command=(git diff --unified=0 "$scan_base" "$source_sha")
          else
            scan_base=""
            changed_files="$(git ls-tree -r --name-only "$source_sha")"
            release_diff_command=(git show --format= --unified=0 --root "$source_sha")
          fi
          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eiq '(^|/)(\.env($|\.)|id_rsa|id_ed25519|.*\.pem$|.*\.key$|keystore|wallet-backup|seed-phrase|private-key|signer-credential)'; then
            echo "::error::Release diff contains a secret-bearing file name."
            exit 1
          fi

          if printf '%s\n' "$changed_files" | grep -Eiq '(proprietary[-_ ]?(long[-_ ]?short|trading|quant|alpha|signal)|private[-_ ]?(trading|quant|alpha|signal)|unpublished[-_ ]?quant|secret[-_ ]?signal)'; then
            echo "::error::Release diff contains an IP-protected path."
            exit 1
          fi

          if [ -n "$changed_files" ]; then
            "${release_diff_command[@]}" \
              | grep '^+' \
              | grep -Ev '^\+\+\+' \
              | grep -Eiq '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|PRIVATE[_-]?KEY[[:space:]]*=|SEED[_-]?PHRASE[[:space:]]*=|MNEMONIC[[:space:]]*=|AWS_SECRET_ACCESS_KEY[[:space:]]*=|GITHUB_TOKEN[[:space:]]*=)' \
              && { echo "::error::Release diff contains a credential-like value."; exit 1; } \
              || true
          fi

      - name: Build static site
        shell: bash
        env:
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_mode || 'experimental' }}
          SOURCE_REF_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
        run: |
          set -euo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_REF="${SOURCE_REF_INPUT}"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          ORIGIN_MAIN_SHA="$(git rev-parse origin/main)"
          SOURCE_AHEAD_OF_MAIN="$(git rev-list --count origin/main..HEAD)"
          SOURCE_BEHIND_MAIN="$(git rev-list --count HEAD..origin/main)"

          rm -rf _site
          mkdir -p _site

          # Force GitHub Pages to publish static files without Jekyll or Liquid.
          touch _site/.nojekyll

          copy_file() {
            local src="$1"
            local dest="${2:-$1}"
            if [ -f "$src" ]; then
              mkdir -p "_site/$(dirname "$dest")"
              cp -a "$src" "_site/$dest"
            fi
          }

          copy_dir() {
            local src="$1"
            local dest="${2:-$1}"
            if [ -d "$src" ]; then
              mkdir -p "_site/$(dirname "$dest")"
              cp -a "$src" "_site/$dest"
            fi
          }

          if [ ! -f "index.html" ]; then
            echo "::error::Root index.html is required for the official homepage."
            exit 1
          fi
          copy_file "index.html"

          copy_file "12345.html"
          copy_file "wallet-12345.html"
          copy_file "wallet.html"
          copy_file "kgen32.svg"
          copy_file "logo.png"
          copy_file "README.md"
          copy_file "MANIFEST.json"
          copy_file "VERSION"
          copy_file "PRIMEFORGE_GENESIS_BOOT_SEQUENCE.md"
          copy_file "PRIMEFORGE_GENESIS_BOOT_SEQUENCE_V1_4.md"
          copy_file "OfficialLinks.json"
          copy_file "KGEN-OFFICIAL-LINKS.json"
          copy_file "KGEN_PUBLIC_INFORMATION_AUDIT.md"
          copy_file "KGEN_LP_LOCK_PUBLIC_PROOF.md"

          copy_dir "K線西遊記"
          copy_dir "docs"
          copy_dir "archive"
          copy_dir "assets"
          copy_dir "api"
          copy_dir "KGEN"
          copy_dir "core"
          copy_dir "KGEN-Genesis"
          copy_dir "KGEN-Runtime"
          copy_dir "KGEN-SDK"
          copy_dir "KGEN-Canon"
          copy_dir "KGEN-Cursor-WorkOrders"
          copy_dir "KGEN-Agent-Office"
          copy_dir "KGEN-Organization"
          copy_dir "KGEN-AI-Company"
          copy_dir "KGEN-KAIOS"
          copy_dir "KAIOS"
          copy_dir "world-viewer"
          copy_dir "boot"
          copy_dir "operating-center"
          copy_dir "ai-company"
          copy_dir "workqueue"
          copy_dir "civilization"
          copy_dir "economy"
          copy_dir "exchange"
          copy_dir "wallet"
          copy_dir "membership"
          copy_dir "library"
          copy_dir "evolution-governance"
          copy_dir "workforce"
          copy_dir "video"
          copy_dir "official"
          copy_dir "community"
          copy_dir "markets"
          copy_dir "security"
          copy_dir "liquidity-lock"
          copy_dir "PRIMEFORGE_GENESIS_BOOT_SEQUENCE"
          copy_dir "PRIMEFORGE_GENESIS_BOOT_SEQUENCE_V1_4"

          mkdir -p "_site/KGEN-KAIOS/dashboard"
          cat > "_site/KGEN-KAIOS/dashboard/build-info.json" <<EOF
          {
            "main_commit": "${ORIGIN_MAIN_SHA}",
            "origin_main_commit": "${ORIGIN_MAIN_SHA}",
            "source_commit": "${SOURCE_SHA}",
            "source_tree": "${SOURCE_TREE}",
            "source_ref": "${SOURCE_REF}",
            "source_ahead_of_main": ${SOURCE_AHEAD_OF_MAIN},
            "source_behind_main": ${SOURCE_BEHIND_MAIN},
            "branch": "${SOURCE_REF}",
            "workflow": "deploy-pages-static.yml",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mode": "${RELEASE_MODE}",
            "channel": "official-public-experimental"
          }
          EOF

          mkdir -p "_site/KGEN-KAIOS/V8"
          cat > "_site/KGEN-KAIOS/V8/build-info.json" <<EOF
          {
            "main_commit": "${SOURCE_SHA}",
            "branch": "${SOURCE_REF}",
            "workflow": "deploy-pages-static.yml",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mode": "read-only",
            "kaios_version": "V8.0"
          }
          EOF

          mkdir -p "_site/KGEN-KAIOS/V8.1"
          cat > "_site/KGEN-KAIOS/V8.1/build-info.json" <<EOF
          {
            "main_commit": "${SOURCE_SHA}",
            "branch": "${SOURCE_REF}",
            "workflow": "deploy-pages-static.yml",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mode": "read-only",
            "kaios_version": "V8.1"
          }
          EOF

          mkdir -p "_site/KGEN-KAIOS/V8.2"
          cat > "_site/KGEN-KAIOS/V8.2/build-info.json" <<EOF
          {
            "main_commit": "${SOURCE_SHA}",
            "branch": "${SOURCE_REF}",
            "workflow": "deploy-pages-static.yml",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mode": "read-only",
            "kaios_version": "V8.2"
          }
          EOF

          mkdir -p "_site/KGEN-KAIOS/V8.3"
          cat > "_site/KGEN-KAIOS/V8.3/build-info.json" <<EOF
          {
            "main_commit": "${SOURCE_SHA}",
            "branch": "${SOURCE_REF}",
            "workflow": "deploy-pages-static.yml",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mode": "read-only",
            "kaios_version": "V8.3"
          }
          EOF

          mkdir -p "_site/KGEN-KAIOS/V9.0"
          cat > "_site/KGEN-KAIOS/V9.0/build-info.json" <<EOF
          {
            "main_commit": "${SOURCE_SHA}",
            "branch": "${SOURCE_REF}",
            "workflow": "deploy-pages-static.yml",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mode": "read-only",
            "kaios_version": "V9.0"
          }
          EOF

          mkdir -p "_site/KGEN-KAIOS/V9.1"
          cat > "_site/KGEN-KAIOS/V9.1/build-info.json" <<EOF
          {
            "main_commit": "${SOURCE_SHA}",
            "branch": "${SOURCE_REF}",
            "workflow": "deploy-pages-static.yml",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mode": "read-only",
            "kaios_version": "V9.1"
          }
          EOF

          mkdir -p "_site/KGEN-KAIOS/V9.2"
          cat > "_site/KGEN-KAIOS/V9.2/build-info.json" <<EOF
          {
            "main_commit": "${SOURCE_SHA}",
            "branch": "${SOURCE_REF}",
            "workflow": "deploy-pages-static.yml",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mode": "read-only",
            "kaios_version": "V9.2"
          }
          EOF

          mkdir -p "_site/KGEN-KAIOS/V9.3"
          cat > "_site/KGEN-KAIOS/V9.3/build-info.json" <<EOF
          {
            "main_commit": "${SOURCE_SHA}",
            "branch": "${SOURCE_REF}",
            "workflow": "deploy-pages-static.yml",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mode": "read-only",
            "kaios_version": "V9.3"
          }
          EOF

          mkdir -p "_site/KGEN-KAIOS/V10"
          cat > "_site/KGEN-KAIOS/V10/build-info.json" <<EOF
          {
            "main_commit": "${SOURCE_SHA}",
            "branch": "${SOURCE_REF}",
            "workflow": "deploy-pages-static.yml",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mode": "read-only",
            "kaios_version": "V10.0"
          }
          EOF
          copy_file "KGEN_MASTER_LIBRARY_INDEX.md"
          copy_file "KGEN_BIOLOGICAL_VERSIONING_AUDIT.md"
          copy_file "KGEN_UNAUTHORIZED_CONTRIBUTION_AUDIT.md"
          copy_dir "whitepaper"
          copy_dir "wukong-temple"

          for route in boot operating-center ai-company workqueue civilization economy exchange wallet membership library evolution-governance workforce video; do
            if [ ! -f "_site/${route}/index.html" ]; then
              echo "::error::Missing permanent Pages route: /${route}/"
              exit 1
            fi
          done

          echo "Static site sample:"
          find _site -maxdepth 3 -type f | sort | sed 's#^_site/##' | head -n 200 || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
