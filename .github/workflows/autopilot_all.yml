name: KLINE Autopilot (TX + BTC) - Stable

on:
  workflow_dispatch:
  push:
    paths:
      - "K線西遊記/kline-taifex/raw/**"
      - "K線西遊記/kline-btc/raw/**"
      - "K線西遊記/kline-taifex/scripts/**"
      - "K線西遊記/kline-taifex/tests/**"
      - "K線西遊記/tools/**"
      - "K線西遊記/kline-engine-public/**"
      - ".github/workflows/autopilot_all.yml"

permissions:
  contents: write

concurrency:
  group: kline-autopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest

    env:
      TX_RAW_DIR: "K線西遊記/kline-taifex/raw"
      TX_PIPELINE: "K線西遊記/kline-taifex/scripts/tx_full_day_pipeline_v882_UTF8BOM.py"
      TX_MASTER: "K線西遊記/kline-taifex/master/台指近全.xlsx"
      BTC_RAW_DIR: "K線西遊記/kline-btc/raw"
      BTC_MASTER: "K線西遊記/kline-btc/master/BTCUSDT_1d_1000.xlsx"
      OUTDIR_TX: "K線西遊記/kline-engine-public/output/tx"
      OUTDIR_BTC: "K線西遊記/kline-engine-public/output/btc"
      ENGINE_DIR: "engine_bin"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install pandas openpyxl numpy matplotlib requests

      - name: Prepare folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${TX_RAW_DIR}" "$(dirname "${TX_MASTER}")"
          mkdir -p "${BTC_RAW_DIR}" "$(dirname "${BTC_MASTER}")"
          mkdir -p "${OUTDIR_TX}" "${OUTDIR_BTC}" "${ENGINE_DIR}"
          mkdir -p "K線西遊記/kline-engine-public" "K線西遊記/tools"

      - name: Validate TX pipeline before touching master
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "${TX_PIPELINE}"
          python "K線西遊記/kline-taifex/tests/test_tx_pipeline.py"

      - name: Convert RAW to MASTER
        shell: bash
        run: |
          set -euo pipefail
          python "K線西遊記/tools/tx_btc_convert.py" \
            --tx_raw_dir "${TX_RAW_DIR}" \
            --tx_pipeline "${TX_PIPELINE}" \
            --tx_master "${TX_MASTER}" \
            --btc_raw_dir "${BTC_RAW_DIR}" \
            --btc_master "${BTC_MASTER}"

      - name: Verify generated TX master
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "${TX_RAW_DIR}/*.csv" > /dev/null; then
            test -s "${TX_MASTER}"
            python - <<'PY'
          import importlib.util
          from pathlib import Path
          import pandas as pd

          pipeline_path = Path("K線西遊記/kline-taifex/scripts/tx_full_day_pipeline_v882_UTF8BOM.py")
          spec = importlib.util.spec_from_file_location("tx_pipeline", pipeline_path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          master = pd.read_excel("K線西遊記/kline-taifex/master/台指近全.xlsx")
          module.validate_near_full(master)
          print(f"TX master verified: rows={len(master)}, last={master['交易日期'].iloc[-1]}")
          PY
          else
            echo "No TX raw CSV; TX master generation skipped."
          fi

      - name: Restore engine.zip from Secret
        id: restore_engine
        continue-on-error: true
        shell: bash
        env:
          ENGINE_ZIP_B64: ${{ secrets.ENGINE_ZIP_B64 }}
        run: |
          set -euo pipefail
          echo "engine_ok=0" >> "$GITHUB_OUTPUT"
          if [ -z "${ENGINE_ZIP_B64:-}" ]; then
            echo "::warning::Missing ENGINE_ZIP_B64; engine skipped, conversion and commit continue."
            exit 0
          fi
          python - <<'PY'
          import os, base64
          from pathlib import Path
          out = Path("engine_bin/engine.zip")
          out.write_bytes(base64.b64decode(os.environ["ENGINE_ZIP_B64"].strip()))
          print("engine.zip bytes:", out.stat().st_size)
          PY
          cd "${ENGINE_DIR}"
          unzip -t engine.zip >/dev/null
          unzip -o engine.zip >/dev/null
          echo "engine_ok=1" >> "$GITHUB_OUTPUT"

      - name: Strip UTF-8 BOM in engine Python files
        if: steps.restore_engine.outputs.engine_ok == '1'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          bom = b"\xef\xbb\xbf"
          fixed = 0
          for path in Path("engine_bin").rglob("*.py"):
              data = path.read_bytes()
              if data.startswith(bom):
                  path.write_bytes(data[len(bom):])
                  fixed += 1
          print("BOM fixed files:", fixed)
          PY

      - name: Run Engine TX
        if: steps.restore_engine.outputs.engine_ok == '1'
        shell: bash
        env:
          ENGINE_MODEL_B64: ${{ secrets.ENGINE_MODEL_B64 }}
        run: |
          set -euo pipefail
          test -f "${TX_MASTER}"
          python "K線西遊記/kline-engine-public/run_public.py" \
            --master "${TX_MASTER}" --engine_dir "${ENGINE_DIR}" --outdir "${OUTDIR_TX}"

      - name: Run Engine BTC
        if: steps.restore_engine.outputs.engine_ok == '1'
        shell: bash
        env:
          ENGINE_MODEL_B64: ${{ secrets.ENGINE_MODEL_B64 }}
        run: |
          set -euo pipefail
          test -f "${BTC_MASTER}"
          python "K線西遊記/kline-engine-public/run_public.py" \
            --master "${BTC_MASTER}" --engine_dir "${ENGINE_DIR}" --outdir "${OUTDIR_BTC}"

      - name: Write status interface
        shell: bash
        run: |
          set -euo pipefail
          python "K線西遊記/tools/write_status.py" \
            --tx_master "${TX_MASTER}" \
            --btc_master "${BTC_MASTER}" \
            --outdir_tx "${OUTDIR_TX}" \
            --outdir_btc "${OUTDIR_BTC}" \
            --tx_updated "1" --btc_updated "1" --btc_source "auto" \
            --engine_enabled "${{ steps.restore_engine.outputs.engine_ok }}" \
            --engine_ok "${{ steps.restore_engine.outputs.engine_ok }}"

      - name: Commit and push verified outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kline-bot"
          git config user.email "actions@users.noreply.github.com"

          test ! -f "${TX_MASTER}" || git add "${TX_MASTER}"
          test ! -f "${BTC_MASTER}" || git add "${BTC_MASTER}"
          git add "K線西遊記/kline-taifex/master/台指近全"*.xlsx 2>/dev/null || true
          test ! -d "K線西遊記/kline-engine-public/output" || git add "K線西遊記/kline-engine-public/output"
          test ! -d "K線西遊記/kline-engine-public/status" || git add "K線西遊記/kline-engine-public/status"

          if git diff --cached --quiet; then
            echo "No verified output changes."
            exit 0
          fi

          git commit -m "autopilot: update verified master and outputs"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
