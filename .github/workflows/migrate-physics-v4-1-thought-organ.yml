name: Migrate Physics V4.1 Thought Organ

on:
  push:
    branches:
      - codex/physics-civilization-full-runtime-v4-1
    paths:
      - .github/workflows/migrate-physics-v4-1-thought-organ.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Migrate V4.1 metadata, binding and loader
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json, hashlib, re

          version_path = Path('docs/physics/KGEN_Universe_Physics_Runtime_V4_1.md')
          current_path = Path('docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md')
          text = version_path.read_text(encoding='utf-8').replace('\r\n','\n')

          text, n_version = re.subn(
              r'^VERSION:\s*(?:CURRENT\s*/\s*)?V4\.1 CUMULATIVE LIVING PHYSICS\s*$',
              'VERSION: CURRENT / V4.1 CUMULATIVE LIVING PHYSICS',
              text,
              count=1,
              flags=re.M,
          )
          if n_version != 1:
              raise SystemExit(f'V4.1 VERSION header migration count={n_version}')

          header = text.split('------------------------------------------------------------------------',1)[0]
          if 'DOC_ID: PF-PHYSICS-CURRENT-V4-1' not in header:
              text, n_doc = re.subn(
                  r'^(TYPE:\s*Universe Physics Runtime Constitution\s*)$',
                  r'\1\nDOC_ID: PF-PHYSICS-CURRENT-V4-1',
                  text,
                  count=1,
                  flags=re.M,
              )
              if n_doc != 1:
                  raise SystemExit(f'DOC_ID insertion count={n_doc}')

          version_path.write_text(text, encoding='utf-8', newline='\n')
          current_path.write_text(text, encoding='utf-8', newline='\n')
          normalized = current_path.read_text(encoding='utf-8').replace('\r\n','\n')
          sha256 = hashlib.sha256(normalized.encode('utf-8')).hexdigest()

          canonical_path = Path('core/data/canonical.json')
          seed = json.loads(canonical_path.read_text(encoding='utf-8'))
          updated = 0
          def walk(value):
              global updated
              if isinstance(value, dict):
                  if value.get('organ_type') == 'PHYSICS_CONSTITUTION' and value.get('path') == 'docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md':
                      binding = value.get('binding_id','PHYSICS_THOUGHT_ORGAN')
                      value['binding_id'] = re.sub(r'V3_8$', 'V4_1', binding) if 'V3_8' in binding else binding
                      value['document_id'] = 'PF-PHYSICS-CURRENT-V4-1'
                      value['version'] = 'V4.1 CUMULATIVE LIVING PHYSICS'
                      value['sha256'] = sha256
                      value['status'] = 'ACTIVE'
                      value['runtime_authority'] = 'CURRENT'
                      value['compatibility'] = 'DIGITAL_ANT_APP_0001_V4_1_PHYSICS_COMPATIBLE'
                      value['supersede_policy'] = 'CURRENT_OVERRIDES_OLDER_VERSION_REPORT_AND_MEMORY'
                      value['evidence'] = [
                          'CURRENT_EQUALS_V4_1_BYTE_IDENTICAL',
                          f'CANONICAL_UTF8_LF_SHA256_{sha256.upper()}',
                          'PR_159_V4_1_CUMULATIVE_MIGRATION'
                      ]
                      updated += 1
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(seed)
          if updated < 1:
              raise SystemExit('No Physics Thought Organ binding found in canonical.json')
          canonical_path.write_text(json.dumps(seed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          worker_path = Path('core/jobs/public-read-only-worker.mjs')
          worker = worker_path.read_text(encoding='utf-8')
          worker, n_loader = re.subn(
              r"const versionMatch = text\.match\(/\^VERSION:\\\s\*CURRENT\\\s\*\\/\\\s\*\(V3\\\.8\[\^.*?;/m\);",
              "const versionMatch = text.match(/^VERSION:\\s*CURRENT\\s*\\/\\s*(V[0-9]+(?:\\.[0-9]+)?[^\\\\\\r\\n]*)/m);",
              worker,
              count=1,
          )
          if n_loader != 1:
              # Safer line-oriented fallback: replace only the known declaration line.
              lines = worker.splitlines()
              hits = [i for i,l in enumerate(lines) if 'const versionMatch = text.match(' in l and 'V3\\.8' in l]
              if len(hits) != 1:
                  raise SystemExit(f'V3.8-only loader declaration hits={len(hits)}')
              lines[hits[0]] = "  const versionMatch = text.match(/^VERSION:\\s*CURRENT\\s*\\/\\s*(V[0-9]+(?:\\.[0-9]+)?[^\\\\\\r\\n]*)/m);"
              worker = '\n'.join(lines) + ('\n' if worker.endswith('\n') else '')
          worker_path.write_text(worker, encoding='utf-8', newline='\n')

          manifest_path = Path('K線西遊記/temples/11520/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['physics_thought_organ'] = 'PF_PHYSICS_CURRENT_V4_1_ACTIVE_HASH_VERIFIED'
          manifest['physics_thought_organ_sha256'] = sha256
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          print('updated_bindings=', updated)
          print('physics_sha256=', sha256)
          PY

      - name: Validate migration locally
        shell: bash
        run: |
          set -euo pipefail
          cmp -s docs/physics/KGEN_Universe_Physics_Runtime_V4_1.md docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md
          test "$(git hash-object docs/physics/KGEN_Universe_Physics_Runtime_V4_1.md)" = "$(git hash-object docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md)"
          test "$(git hash-object docs/physics/KGEN_Universe_Physics_Runtime_V3_8.md)" = '6eaa6d14d19f4f6d06d9172f1bd1a5cd55b35fcc'
          grep -Fq 'DOC_ID: PF-PHYSICS-CURRENT-V4-1' docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md
          grep -Fq 'VERSION: CURRENT / V4.1 CUMULATIVE LIVING PHYSICS' docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md
          grep -Fq '# PART 114. V3.8 Signature' docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md
          node --check core/jobs/public-read-only-worker.mjs
          node --test tests/universal-exchange.test.mjs

      - name: Commit migration and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/migrate-physics-v4-1-thought-organ.yml
          if [ -f .github/workflows/physics-v4-1-thought-organ-compat.yml ]; then
            git rm .github/workflows/physics-v4-1-thought-organ-compat.yml
          fi
          git config user.name 'physics-v4-1-migrator'
          git config user.email 'physics-v4-1-migrator@users.noreply.github.com'
          git add docs/physics/KGEN_Universe_Physics_Runtime_V4_1.md \
                  docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md \
                  core/data/canonical.json \
                  core/jobs/public-read-only-worker.mjs \
                  'K線西遊記/temples/11520/MANIFEST.json'
          git commit -m 'Migrate 11520 Thought Organ binding to Physics V4.1'
          git push origin HEAD:codex/physics-civilization-full-runtime-v4-1
