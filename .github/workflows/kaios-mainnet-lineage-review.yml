name: KAIOS Mainnet Lineage Review

on:
  pull_request:
    paths:
      - "KGEN-KAIOS/KAIOS_MAINNET_LINEAGE_CURRENT.md"
      - "KGEN-KAIOS/archive/mainnet-lineage/**"
      - ".github/workflows/kaios-mainnet-lineage-review.yml"

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce reconciliation allowlist
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          while IFS= read -r path; do
            case "$path" in
              KGEN-KAIOS/KAIOS_MAINNET_LINEAGE_CURRENT.md|KGEN-KAIOS/archive/mainnet-lineage/*|.github/workflows/kaios-mainnet-lineage-review.yml)
                ;;
              *)
                echo "Unexpected active-path change: $path" >&2
                exit 1
                ;;
            esac
          done < /tmp/changed.txt

      - name: Verify exact archived Git blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "Blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            fi
          }

          check_blob 86f1111a51ac2ecd6b399f1928765e93cdbdf286 KGEN-KAIOS/archive/mainnet-lineage/pr135-genesis/contracts/KAIOS.sol
          check_blob 20275dfa5ab8c7a83a115248319d29a1b7bb83f0 KGEN-KAIOS/archive/mainnet-lineage/pr135-genesis/contracts/LingxiaoCelestialBank18888_Upgradeable.sol
          check_blob f49e4949b1ddff66f73c4181c429af2a442162fb KGEN-KAIOS/archive/mainnet-lineage/pr135-genesis/KAIOS_GENESIS_MAINNET_RECORD.json
          check_blob ad6e6e4fbeca07dad6c2da973012640fca0038db KGEN-KAIOS/archive/mainnet-lineage/pr135-genesis/KAIOS_GENESIS_MAINNET_INSCRIPTION.md
          check_blob 09cc3a2e8799aa4fcbfd717d33592b75136e46db KGEN-KAIOS/archive/mainnet-lineage/pr135-genesis/config/LINGXIAO_18888_MAINNET_DEPLOYMENT_MANIFEST.json
          check_blob f72e2893329a0b3b936de7d2630f37698b3a4455 KGEN-KAIOS/archive/mainnet-lineage/pr135-genesis/config/mainnet-economic-config.final-review.json
          check_blob dc32863610121d74c770dcc1e0f792e26ce148d1 KGEN-KAIOS/archive/mainnet-lineage/pr136-phase2/KAIOS_CIVILIZATION_PHASE2_CANON.md
          check_blob 50c037ee01c6746013dc5dfc92713f27ad4a4717 KGEN-KAIOS/archive/mainnet-lineage/pr136-phase2/contracts/CelestialEligibility_Upgradeable.sol
          check_blob 5451f3e54798990edf482355b534820b61d67f90 KGEN-KAIOS/archive/mainnet-lineage/pr136-phase2/contracts/KGENReserveRedemption_Upgradeable.sol
          check_blob 9857fef7056fde61bc0144f19471fef63182acc1 KGEN-KAIOS/archive/mainnet-lineage/pr136-phase2/contracts/CelestialCapitalCommitment_Upgradeable.sol
          check_blob 5c2faff5bb9f9f11d39924650113643e37be07f0 KGEN-KAIOS/archive/mainnet-lineage/pr136-phase2/reports/KAIOS_CIVILIZATION_PHASE2_MAINNET_STAGE1_2026-08-14.json
          check_blob 0a3f9933636059ed6cfd6cf382b4fc33906d7445 KGEN-KAIOS/archive/mainnet-lineage/pr136-phase2/reports/KAIOS_CIVILIZATION_PHASE2_MAINNET_STAGE2C1_2026-08-15.json

      - name: Validate archived JSON
        run: |
          node -e "for (const f of process.argv.slice(1)) JSON.parse(require('fs').readFileSync(f,'utf8'));" \
            KGEN-KAIOS/archive/mainnet-lineage/pr135-genesis/KAIOS_GENESIS_MAINNET_RECORD.json \
            KGEN-KAIOS/archive/mainnet-lineage/pr135-genesis/config/LINGXIAO_18888_MAINNET_DEPLOYMENT_MANIFEST.json \
            KGEN-KAIOS/archive/mainnet-lineage/pr135-genesis/config/mainnet-economic-config.final-review.json \
            KGEN-KAIOS/archive/mainnet-lineage/pr136-phase2/reports/KAIOS_CIVILIZATION_PHASE2_MAINNET_STAGE1_2026-08-14.json \
            KGEN-KAIOS/archive/mainnet-lineage/pr136-phase2/reports/KAIOS_CIVILIZATION_PHASE2_MAINNET_STAGE2C1_2026-08-15.json

      - name: Verify lineage status boundaries
        shell: bash
        run: |
          set -euo pipefail
          file=KGEN-KAIOS/KAIOS_MAINNET_LINEAGE_CURRENT.md
          grep -Fq 'PR #135' "$file"
          grep -Fq 'PR #136' "$file"
          grep -Fq 'PR #152' "$file"
          grep -Fq 'DESIGN-ONLY' "$file"
          grep -Fq 'MERGE = NOT_PERFORMED' "$file"
          grep -Fq 'DEPLOYMENT = NOT_PERFORMED' "$file"
          grep -Fq 'CHAIN_TRANSACTION = NOT_PERFORMED' "$file"
