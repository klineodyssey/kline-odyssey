name: Update Latest Video (RSS)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # 每小時一次（UTC）
  push:
    paths:
      - ".github/scripts/update_latest_video.py"
      - ".github/workflows/update-latest-video-rss.yml"
  pull_request:
    paths:
      - ".github/scripts/update_latest_video.py"
      - ".github/workflows/update-latest-video-rss.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install feedparser

      - name: Run deterministic RSS fail-safe coverage
        run: python .github/scripts/update_latest_video.py --self-test

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install feedparser

      - name: Run deterministic RSS fail-safe coverage
        run: python .github/scripts/update_latest_video.py --self-test

      - name: Update README latest video block
        run: python .github/scripts/update_latest_video.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "chore: auto-update latest YouTube video (RSS)" || echo "No changes to commit"
          git push
