name: KAIOS Current Lineage Review

on:
  pull_request:
    paths:
      - ".github/workflows/kaios-current-lineage-review.yml"
      - "KGEN-KAIOS/tools/verify-current-lineage.mjs"
      - "KGEN-KAIOS/reports/CURRENT_LINEAGE_RECONCILIATION.json"
      - "KGEN-KAIOS/reports/KAIOS_LINEAGE_STALE_REFERENCE_AUDIT_2026-08-09.json"
      - "docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md"
      - "docs/physics/KGEN_Universe_Physics_Runtime_V3_8.md"
      - "docs/physics/KGEN_KAIOS_SCALE_AND_PLANCK_RUNTIME_CURRENT.md"
      - "KGEN-KAIOS/KAIOS_WHITE_HOLE_ATOMIC_CONVERSION_AND_LIQUIDITY_RUNTIME_CURRENT.md"
      - "KGEN-KAIOS/UNIVERSE_EXCHANGE_RUNTIME_CURRENT.md"
      - "docs/constitution/01_KGEN_Universe_Constitution.md"
      - "docs/constitution/02_KAIOS_Civilization_Constitution.md"
      - "docs/constitution/03_Celestial_Bank_18888.md"
      - "K線西遊記/data/kgen-5d-world-map.json"
      - "KGEN-KAIOS/contracts/KAIOS.sol"
      - "KGEN/contracts/KGEN_TempleHeart_Upgradeable.sol"
      - "KGEN-KAIOS/tests/contracts/MockKGEN.sol"
      - "KGEN-KAIOS/tests/templeheart.integration.test.mjs"
      - "KGEN-KAIOS/tools/validate-templeheart-storage.mjs"
      - "KGEN-KAIOS/tools/compile-contracts.mjs"

permissions:
  contents: read

concurrency:
  group: kaios-current-lineage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  current-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Confirm exact pull request head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Enforce lineage boundary and narrowly authorized V3.4 routing
        id: boundary
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          // Human authorization 2026-10-03 is limited to this completion PR,
          // not a standing exemption for Solidity or future branches.
          const authorized = {
            number: 473, repo: 'klineodyssey/kline-odyssey',
            head: 'codex/k12345-v34-completion', base: 'main'
          };
          const allowedSolidity = new Set([
            'KGEN/contracts/KGEN_TempleHeart_Upgradeable.sol',
            'KGEN-KAIOS/tests/contracts/MockKGEN.sol'
          ]);
          function classify(changes, identity) {
            let solidity = false;
            for (const { status, path } of changes) {
              if (/(^|\/)(archive|archives)(\/|$)|_ARCHIVE/i.test(path)) {
                throw new Error(`Historical archive changes prohibited: ${path}`);
              }
              if (!/\.sol$/i.test(path)) continue;
              solidity = true;
              if (!Object.keys(authorized).every(k => identity[k] === authorized[k]) ||
                  !allowedSolidity.has(path) || status !== 'M') {
                throw new Error(`Unauthorized Solidity change: ${status} ${path}`);
              }
            }
            return solidity;
          }
          // Exercise the same decision function used below, including fail-closed
          // PR identity, historical sources, deletion and rename (as delete/add).
          const allowed = [...allowedSolidity].map(path => ({ status: 'M', path }));
          assert.equal(classify([], authorized), false);
          assert.equal(classify(allowed, authorized), true);
          for (const key of Object.keys(authorized)) {
            assert.throws(() => classify(allowed, { ...authorized, [key]: 'not-authorized' }));
          }
          for (const path of ['KGEN-KAIOS/contracts/KAIOS.sol',
            'KGEN/contracts/KGEN_Token_V7_5_2.sol',
            'KGEN/contracts/KGEN_TempleHeart_V3_2_6.sol',
            'archive/source.md', 'docs/archives/old.md', 'docs/OLD_ARCHIVE.md']) {
            assert.throws(() => classify([{ status: 'M', path }], authorized));
          }
          for (const status of ['A', 'D', 'T']) {
            assert.throws(() => classify([{ ...allowed[0], status }], authorized));
          }
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.pull_request;
          const identity = { number: pr.number, repo: pr.head.repo.full_name,
            head: pr.head.ref, base: pr.base.ref };
          assert.equal(pr.base.repo.full_name, authorized.repo);
          const fields = execFileSync('git', ['diff', '--no-renames', '--name-status', '-z',
            process.env.BASE_SHA, 'HEAD'], { encoding: 'utf8' }).split('\0');
          fields.pop();
          assert.equal(fields.length % 2, 0);
          const changes = [];
          for (let i = 0; i < fields.length; i += 2) {
            changes.push({ status: fields[i], path: fields[i + 1] });
          }
          const solidity = classify(changes, identity);
          console.log(JSON.stringify({ boundary: 'PASS', solidity, changes }, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `solidity=${solidity}\n`);
          NODE
      - name: Validate verifier syntax
        run: node --check KGEN-KAIOS/tools/verify-current-lineage.mjs
      - name: Preserve Physics CURRENT and V3.8 identity
        shell: bash
        run: |
          test "$(git hash-object docs/physics/KGEN_Universe_Physics_Runtime_CURRENT.md)" = \
            "$(git hash-object docs/physics/KGEN_Universe_Physics_Runtime_V3_8.md)"
      - name: Verify current lineage
        run: node KGEN-KAIOS/tools/verify-current-lineage.mjs
      - name: Require reproducible committed report
        run: git diff --exit-code -- KGEN-KAIOS/reports/CURRENT_LINEAGE_RECONCILIATION.json
      - name: Install pinned local contract toolchain for authorized Solidity changes
        if: steps.boundary.outputs.solidity == 'true'
        working-directory: KGEN-KAIOS
        run: npm install --ignore-scripts --no-package-lock --omit=optional --no-audit --no-fund
      - name: Mandatory compile, storage compatibility and storage negative tests
        if: steps.boundary.outputs.solidity == 'true'
        working-directory: KGEN-KAIOS
        run: |
          npm run compile
          npm run storage:validate
          node tools/validate-templeheart-storage.mjs --storage-self-test
      - name: Mandatory full local EVM V3.4 safety suite
        if: steps.boundary.outputs.solidity == 'true'
        working-directory: KGEN-KAIOS
        # No credentials, chain RPC, signer secrets or broadcast step. Includes
        # UUPS/roles, replay, beneficiary/civilization mismatch, Fortune anti-bot,
        # repayment, reserve protection, Heartbeat and Ignite global caps.
        run: node --test --test-reporter=spec tests/templeheart.integration.test.mjs
      - name: Check patch whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD
