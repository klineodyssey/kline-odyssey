# KGEN cursor-01 on-demand capacity status gate.
# Cursor Cloud is suspended by Human cost decision and never auto-retried.

name: KGEN Cursor Dispatch Wake

on:
  workflow_dispatch:

concurrency:
  group: kgen-cursor-dispatch-wake
  cancel-in-progress: false

jobs:
  record-cursor-suspension:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record fail-closed dispatch status
        run: |
          {
            echo "## Cursor dispatch status"
            echo ""
            echo "- Status: `SUSPENDED_BY_HUMAN_COST_DECISION`"
            echo "- Capacity role: `ON_DEMAND_EXTERNAL_CAPACITY_ONLY`"
            echo "- HTTP 403 retry: `DISABLED`"
            echo "- External API called: `NO`"
            echo "- Agent launched: `NO`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Cursor Cloud suspended::No subscription retry or external API call is performed."
