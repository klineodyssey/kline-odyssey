# KGEN cursor-01 dispatch wake (HUMAN-AUTO-CLOCKIN-001 / option 2)
# Launches a Cursor Cloud Agent when Codex merges a codex/* dispatch PR to main.
# Requires repo secret: CURSOR_API_KEY (Cursor Dashboard → API Keys)
# Docs: KGEN-AI-Company/automation/README.md

name: KGEN Cursor Dispatch Wake

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kgen-cursor-dispatch-wake
  cancel-in-progress: false

jobs:
  wake-cursor-01:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'codex/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Launch Cursor Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MERGED_PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::notice::CURSOR_API_KEY not set. Add it in GitHub repo Settings → Secrets → Actions."
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Merged PR: #${MERGED_PR_NUMBER} (${MERGED_PR_HEAD_REF})"
            fi
            echo "See KGEN-AI-Company/automation/README.md"
            exit 0
          fi
          BODY=$(python3 <<'PY'
          import json, pathlib
          prompt = pathlib.Path("KGEN-AI-Company/automation/cursor-dispatch-wake-prompt.txt").read_text()
          print(json.dumps({
              "name": "KGEN-Cursor-Dispatch-Wake",
              "prompt": {"text": prompt},
              "repos": [{
                  "url": "https://github.com/klineodyssey/kline-odyssey",
                  "startingRef": "main"
              }],
              "autoCreatePR": False
          }))
          PY
          )
          HTTP=$(curl -sS -w "%{http_code}" -o /tmp/cursor-agent.json \
            -X POST "https://api.cursor.com/v1/agents" \
            -H "Authorization: Bearer ${CURSOR_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          API_ERROR_CODE=$(python3 <<'PY'
          import json, re

          try:
              payload = json.load(open("/tmp/cursor-agent.json", encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              print("unparseable_response")
          else:
              error = payload.get("error") or {}
              code = error.get("code") or ""
              print(code if isinstance(code, str) and re.fullmatch(r"[A-Za-z0-9_.-]{1,64}", code) else "untrusted_error_code")
          PY
          )
          echo "Cursor API HTTP ${HTTP}"
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            echo "Cursor Cloud Agent dispatch accepted."
            exit 0
          fi
          if [ "$HTTP" = "403" ] && [ "$API_ERROR_CODE" = "plan_required" ]; then
            echo "::warning title=Cursor Cloud Agent HOLD::Cursor Cloud Agent is unavailable for the current plan; no agent was launched."
            {
              echo "## Cursor dispatch status"
              echo ""
              echo "- Status: \`HOLD_EXTERNAL_PLAN_REQUIRED\`"
              echo "- HTTP: \`403\`"
              echo "- API code: \`plan_required\`"
              echo "- Agent launched: \`NO\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error title=Cursor Cloud Agent dispatch failed::HTTP ${HTTP}; API code ${API_ERROR_CODE:-unknown}"
          exit 1
