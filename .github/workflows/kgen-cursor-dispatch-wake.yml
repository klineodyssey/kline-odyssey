# KAIOS Cursor Cloud bounded dispatcher.
# Only a Human-approved, repository-recorded task envelope may reach the API.

name: KGEN Cursor Dispatch Wake

on:
  push:
    branches: [main]
    paths:
      - "KGEN-Organization/WorkOrders/WORK_QUEUE.md"
      - "KAIOS/**/KAIOS_CURSOR_*_TASK_ENVELOPE.json"
      - "KGEN-AI-Company/reports/handoffs/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every preflight without launching a Cursor agent"
        required: true
        default: false
        type: boolean

concurrency:
  group: kgen-cursor-dispatch-wake
  cancel-in-progress: false

jobs:
  bounded-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      pull-requests: read
    env:
      TASK_ID: KAIOS-CURSOR-LIFE-ENERGY-PAYROLL-R2-001
      WORKER_ID: cursor-01
      TASK_ENVELOPE: KAIOS/economy/life-energy-payroll/KAIOS_CURSOR_LIFE_ENERGY_PAYROLL_TASK_ENVELOPE.json
      STARTING_REF: main
      SOURCE_PAYLOAD_REF: cursor/payroll-candidates-delivery-5a30
      SOURCE_PAYLOAD_HEAD: ff8fca3e610ac936e8998112255901a78296b238
      TARGET_BRANCH: cursor-handoff/KAIOS-CURSOR-LIFE-ENERGY-PAYROLL-R2-001
      DAILY_COST_CAP_USD: "1"
      MONTHLY_COST_CAP_USD: "20"
      MAX_LAUNCHES_PER_DAY: "4"
      WATCHDOG_SECONDS: "300"
      MAX_WATCHDOG_CHECKS: "12"
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact main event
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate bounded policy and formal task state
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "::error title=Cursor dispatch blocked::CURSOR_API_KEY is not configured."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          task_id = os.environ["TASK_ID"]
          worker_id = os.environ["WORKER_ID"]
          envelope = json.loads(Path(os.environ["TASK_ENVELOPE"]).read_text(encoding="utf-8"))
          registry = json.loads(Path("KGEN-KAIOS/worker_registry.json").read_text(encoding="utf-8"))
          canonical = json.loads(Path("KAIOS/life/forest-agriculture/KAIOS_CURSOR_CONTINUOUS_WORK_QUEUE.json").read_text(encoding="utf-8"))
          projection = json.loads(Path("api/kaios/ai-company/v1/cursor-queue.json").read_text(encoding="utf-8"))
          queue = Path("KGEN-Organization/WorkOrders/WORK_QUEUE.md").read_text(encoding="utf-8")

          row = next((line for line in queue.splitlines() if line.startswith(f"| {task_id} |")), None)
          if not row or "| READY_FOR_ATOMIC_CLAIM |" not in row:
              raise SystemExit("formal WorkQueue task is not READY_FOR_ATOMIC_CLAIM")
          if envelope.get("status") != "READY_FOR_ATOMIC_CLAIM":
              raise SystemExit("task envelope is not READY_FOR_ATOMIC_CLAIM")
          packet = envelope.get("r2_task_packet", {})
          if packet.get("TASK_ID") != task_id or envelope.get("worker_id") != worker_id:
              raise SystemExit("task/worker binding mismatch")
          if envelope.get("source_payload_head") != os.environ["SOURCE_PAYLOAD_HEAD"]:
              raise SystemExit("task source payload does not match approved source head")
          if envelope.get("queue_policy") != "ONE_TASK_AT_A_TIME":
              raise SystemExit("one-task-at-a-time policy missing")
          if not envelope.get("external_wake_workflow_allowed"):
              raise SystemExit("external wake is not authorized in task envelope")
          if registry.get("active_claims") or canonical.get("active_claims") or projection.get("active_claims"):
              raise SystemExit("an active repository claim already exists")
          if canonical.get("worker_state", {}).get("status") != "IDLE":
              raise SystemExit("cursor-01 is not IDLE")
          if projection.get("worker_state") != canonical.get("worker_state"):
              raise SystemExit("public queue projection drifted")
          print("formal task and zero-claim preflight PASS")
          PY

          actual_source_head="$(git ls-remote origin "refs/heads/${SOURCE_PAYLOAD_REF}" | awk '{print $1}')"
          if [ "${actual_source_head}" != "${SOURCE_PAYLOAD_HEAD}" ]; then
            echo "::error title=Cursor dispatch blocked::Candidate source ref head drifted."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "::error title=Cursor dispatch blocked::Target branch already exists."
            exit 1
          fi
          if [ "$(gh pr list --state open --head "${TARGET_BRANCH}" --json number --jq 'length')" != "0" ]; then
            echo "::error title=Cursor dispatch blocked::A same-task pull request already exists."
            exit 1
          fi

      - name: Verify provider concurrency and daily launch limit
        shell: bash
        run: |
          set -euo pipefail
          set +x
          http_code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --user "${CURSOR_API_KEY}:" \
            --output /tmp/cursor-agents.json \
            --write-out '%{http_code}' \
            'https://api.cursor.com/v1/agents?limit=100&includeArchived=true')"
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error title=Cursor provider preflight failed::HTTP ${http_code}; no launch attempted."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          data = json.loads(Path("/tmp/cursor-agents.json").read_text(encoding="utf-8"))
          items = data.get("items", [])
          active = [item["id"] for item in items if item.get("status") == "ACTIVE"]
          today = datetime.now(timezone.utc).date().isoformat()
          launched_today = sum(str(item.get("createdAt", "")).startswith(today) for item in items)
          if active:
              raise SystemExit(f"provider already has {len(active)} active agent(s); concurrency=1")
          if launched_today >= int(os.environ["MAX_LAUNCHES_PER_DAY"]):
              raise SystemExit("daily launch cap reached")
          print(f"provider preflight PASS; active=0; launches_today={launched_today}")
          PY

      - name: Prepare idempotent request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          task_id = os.environ["TASK_ID"]
          base = os.environ["GITHUB_SHA"]
          digest = hashlib.sha256(f"{task_id}|{base}".encode()).hexdigest()[:32]
          uuid = f"{digest[:8]}-{digest[8:12]}-4{digest[13:16]}-a{digest[17:20]}-{digest[20:32]}"
          agent_id = f"bc-{uuid}"
          base_prompt = Path("KGEN-AI-Company/automation/cursor-dispatch-wake-prompt.txt").read_text(encoding="utf-8")
          prompt = f"{base_prompt}\n\nEXACT_TASK_ID = {task_id}\nEXACT_STARTING_REF = {os.environ['STARTING_REF']}\nEXACT_STARTING_HEAD = {base}\nSOURCE_PAYLOAD_REF = {os.environ['SOURCE_PAYLOAD_REF']}\nSOURCE_PAYLOAD_HEAD = {os.environ['SOURCE_PAYLOAD_HEAD']}\nTARGET_BRANCH = {os.environ['TARGET_BRANCH']}\nTASK_ENVELOPE = {os.environ['TASK_ENVELOPE']}\n"
          payload = {
              "agentId": agent_id,
              "prompt": {"text": prompt},
              "model": {"id": "composer-2", "params": [{"id": "fast", "value": "true"}]},
              "repos": [{"url": "https://github.com/klineodyssey/kline-odyssey", "startingRef": os.environ["STARTING_REF"]}],
              "autoCreatePR": True,
          }
          Path("/tmp/cursor-create.json").write_text(json.dumps(payload), encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"agent_id={agent_id}\n")
          PY

      - name: Dry-run result
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          {
            echo "## Cursor bounded pilot"
            echo ""
            echo "- Status: `DRY_RUN_PREFLIGHT_PASS`"
            echo "- Task: `${TASK_ID}`"
            echo "- Worker: `${WORKER_ID}`"
            echo "- Agent launched: `NO`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Launch one bounded Cursor worker
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          set +x
          agent_id="${{ steps.request.outputs.agent_id }}"
          response_file=/tmp/cursor-create-response.json
          http_code=000
          for attempt in 1 2 3 4; do
            http_code="$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
              --user "${CURSOR_API_KEY}:" \
              --header 'Content-Type: application/json' \
              --data-binary @/tmp/cursor-create.json \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              'https://api.cursor.com/v1/agents')"
            if [ "${http_code}" -ge 200 ] && [ "${http_code}" -lt 300 ]; then
              break
            fi
            if [ "${http_code}" -ge 500 ] && [ "${http_code}" -lt 600 ] && [ "${attempt}" -lt 4 ]; then
              sleep "$((2 ** attempt))"
              continue
            fi
            break
          done

          if [ "${http_code}" = "409" ]; then
            echo "Idempotent agent already exists; attaching watchdog to the existing run."
            curl --silent --show-error --fail --connect-timeout 10 --max-time 30 \
              --user "${CURSOR_API_KEY}:" \
              "https://api.cursor.com/v1/agents/${agent_id}" > /tmp/cursor-agent.json
            run_id="$(python -c 'import json; print(json.load(open("/tmp/cursor-agent.json"))["latestRunId"])')"
          elif [ "${http_code}" -ge 200 ] && [ "${http_code}" -lt 300 ]; then
            read -r returned_agent run_id < <(python - <<'PY'
          import json
          data = json.load(open("/tmp/cursor-create-response.json", encoding="utf-8"))
          print(data["agent"]["id"], data["run"]["id"])
          PY
            )
            if [ "${returned_agent}" != "${agent_id}" ]; then
              echo "::error title=Cursor launch failed closed::Returned agent id did not match idempotency id."
              exit 1
            fi
          else
            echo "::error title=Cursor launch failed::HTTP ${http_code}; 4xx was not retried and 5xx retry limit was enforced."
            exit 1
          fi
          echo "agent_id=${agent_id}" >> "${GITHUB_OUTPUT}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Five-minute watchdog with sixty-minute ceiling
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          agent_id="${{ steps.launch.outputs.agent_id }}"
          run_id="${{ steps.launch.outputs.run_id }}"
          terminal_status=""
          for check in $(seq 1 "${MAX_WATCHDOG_CHECKS}"); do
            http_code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --user "${CURSOR_API_KEY}:" \
              --output /tmp/cursor-run.json \
              --write-out '%{http_code}' \
              "https://api.cursor.com/v1/agents/${agent_id}/runs/${run_id}")"
            if [ "${http_code}" -ge 500 ] && [ "${http_code}" -lt 600 ]; then
              for retry in 1 2 3; do
                sleep "$((2 ** retry))"
                http_code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                  --user "${CURSOR_API_KEY}:" \
                  --output /tmp/cursor-run.json \
                  --write-out '%{http_code}' \
                  "https://api.cursor.com/v1/agents/${agent_id}/runs/${run_id}")"
                if [ "${http_code}" -lt 500 ] || [ "${http_code}" -ge 600 ]; then
                  break
                fi
              done
            fi
            if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              echo "::error title=Cursor watchdog failed::HTTP ${http_code}."
              exit 1
            fi
            status="$(python -c 'import json; print(json.load(open("/tmp/cursor-run.json"))["status"])')"
            echo "watchdog_check=${check} status=${status}"
            case "${status}" in
              FINISHED|ERROR|CANCELLED|EXPIRED)
                terminal_status="${status}"
                break
                ;;
            esac
            if [ "${check}" -lt "${MAX_WATCHDOG_CHECKS}" ]; then
              sleep "${WATCHDOG_SECONDS}"
            fi
          done

          if [ -z "${terminal_status}" ]; then
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --user "${CURSOR_API_KEY}:" --request POST \
              "https://api.cursor.com/v1/agents/${agent_id}/runs/${run_id}/cancel" >/dev/null || true
            echo "::error title=Cursor watchdog timeout::Run exceeded the 60-minute bounded pilot ceiling and cancellation was requested."
            exit 1
          fi
          if [ "${terminal_status}" != "FINISHED" ]; then
            echo "::error title=Cursor worker failed::Terminal status ${terminal_status}."
            exit 1
          fi

          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 \
            --user "${CURSOR_API_KEY}:" \
            "https://api.cursor.com/v1/agents/${agent_id}/usage?runId=${run_id}" > /tmp/cursor-usage.json
          read -r total_tokens pr_url branch < <(python - <<'PY'
          import json
          run = json.load(open("/tmp/cursor-run.json", encoding="utf-8"))
          usage = json.load(open("/tmp/cursor-usage.json", encoding="utf-8"))
          branches = run.get("git", {}).get("branches", [])
          record = next((item for item in branches if item.get("repoUrl") == "github.com/klineodyssey/kline-odyssey"), {})
          print(usage.get("totalUsage", {}).get("totalTokens", 0), record.get("prUrl", "NONE"), record.get("branch", "NONE"))
          PY
          )
          if [ "${pr_url}" = "NONE" ]; then
            echo "::error title=Cursor delivery missing::Worker finished without a pull request."
            exit 1
          fi
          {
            echo "## Cursor bounded pilot"
            echo ""
            echo "- Status: `WORKER_FINISHED_HANDOFF_READY`"
            echo "- Task: `${TASK_ID}`"
            echo "- Worker: `${WORKER_ID}`"
            echo "- Agent: `${agent_id}`"
            echo "- Run: `${run_id}`"
            echo "- Branch: `${branch}`"
            echo "- PR: ${pr_url}"
            echo "- Usage: `${total_tokens} tokens` (the Cursor API does not expose USD cost)"
            echo "- Daily cap policy: `USD ${DAILY_COST_CAP_USD}`"
            echo "- Monthly cap policy: `USD ${MONTHLY_COST_CAP_USD}`"
          } >> "${GITHUB_STEP_SUMMARY}"
