# KGEN cursor-01 dispatch wake safety gate
# External agent launch is disabled in repository automation.
# A future launch path requires a separate, exact Human authorization and review.

name: KGEN Cursor Dispatch Wake

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kgen-cursor-dispatch-wake
  cancel-in-progress: false

jobs:
  hold-cursor-dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'codex/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record fail-closed dispatch status
        run: |
          {
            echo "## Cursor dispatch status"
            echo ""
            echo "- Status: `HOLD_EXPLICIT_HUMAN_DISPATCH_AUTHORITY_REQUIRED`"
            echo "- External API called: `NO`"
            echo "- Agent launched: `NO`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Cursor dispatch held::External API and agent launch are disabled pending exact Human authorization."
