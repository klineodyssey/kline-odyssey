name: PR196 BSC Brand Exact Head

on:
  push:
    branches:
      - gm/bsc-token-brand-verification-v1
    paths:
      - "KGEN-KAIOS/reports/BSC_TOKEN_BRAND_VERIFICATION_WORKING_V1.md"
      - ".github/workflows/pr196-bsc-brand-exact-head.yml"
  pull_request:
    paths:
      - "KGEN-KAIOS/reports/BSC_TOKEN_BRAND_VERIFICATION_WORKING_V1.md"
      - ".github/workflows/pr196-bsc-brand-exact-head.yml"

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          echo "EXPECTED_HEAD=$EXPECTED_HEAD"
          echo "ACTUAL_HEAD=$ACTUAL_HEAD"
      - name: Validate explorer and exact-source evidence
        run: |
          set -euo pipefail
          FILE="KGEN-KAIOS/reports/BSC_TOKEN_BRAND_VERIFICATION_WORKING_V1.md"
          test -f "$FILE"
          grep -F 'KGEN_Token_V7_5_2' "$FILE"
          grep -F 'EXACT_MATCH_VERIFIED' "$FILE"
          grep -F 'PASS_EXACT_BYTE_FOR_BYTE' "$FILE"
          grep -F 'Successfully generated matching Bytecode and ABI' "$FILE"
          grep -F 'D986A085BEF7EBADFD0A3409B036C104C6E4B7EFCB6E33FF68436203974BBD05' "$FILE"
          grep -F 'KAIOS_BRAND_ASSET_VALIDATION=PASS assets=16 shared_mark=PASS' "$FILE"
          grep -F 'KAIOS ownership claim | `VERIFIED_BSCSCAN_ACCOUNT`' "$FILE"
          grep -F 'KAIOS token info / logo | `SUBMITTED_PENDING_BSCSCAN`' "$FILE"
          grep -F 'Credential or signer access: `LOCAL_OFFLINE_OWNERSHIP_SIGN_ONLY / SECRET_NOT_EXPOSED`' "$FILE"
          grep -F 'External source-verification submission: `EXECUTED_AFTER_USER_CONFIRMATION / PUBLIC_EXACT_MATCH_VERIFIED`' "$FILE"
          grep -F 'External KAIOS ownership submission: `EXECUTED_AND_VERIFIED`' "$FILE"
          grep -F 'External KAIOS token-information submission: `SUBMITTED_PENDING_BSCSCAN`' "$FILE"
          ! grep -F 'BSC_MAINNET_PRIVATE_KEY was present and used' "$FILE"
          ! grep -F 'KAIOS source verification was submitted through the public BscScan verifier' "$FILE"
          grep -F 'Token transfer executed: `NO`' "$FILE"
          ! grep -Eq '(PRIVATE KEY-----|BEGIN PRIVATE KEY|seed phrase[[:space:]]*=|api[_-]?key[[:space:]]*=|auth[_-]?token[[:space:]]*=)' "$FILE"
      - name: Validate branch diff
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --check origin/main...HEAD
          mapfile -t paths < <(git diff --name-only origin/main...HEAD)
          test "${#paths[@]}" -eq 2
          printf '%s\n' "${paths[@]}" | grep -Fx 'KGEN-KAIOS/reports/BSC_TOKEN_BRAND_VERIFICATION_WORKING_V1.md'
          printf '%s\n' "${paths[@]}" | grep -Fx '.github/workflows/pr196-bsc-brand-exact-head.yml'
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Universal Exchange regression suite
        run: node --test tests/universal-exchange.test.mjs
