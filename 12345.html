    function carryQuery(){
      const src=new URLSearchParams(location.search);
      const dst=new URLSearchParams();
      ['autoconnect','wallet','source','from','bridge'].forEach(function(k){
        const v=src.get(k);
        if(v!==null && v!=='') dst.set(k,v);
      });
      if(!dst.has('bridge')) dst.set('bridge','1');
      const q=dst.toString();
      return q?('?'+q):'';
    }
    function go(){ location.href=TARGET+carryQuery(); }
    window.addEventListener('DOMContentLoaded',function(){
      setTimeout(go,120);
      const a=document.getElementById('go-temple');
      if(a) a.href=TARGET+carryQuery();
    });
