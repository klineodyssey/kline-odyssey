<style>

adius:14px;font-size:9px;color:var(--mut)}.mini b{display:block;color:var(--txt);font-size:11px}.center{position:fixed;z-index:5;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;text-shadow:0 5px 20px #000}.center .pair{font-size:13px}.center .price{font-size:clamp(34px,10vw,72px);font-weight:900;letter-spacing:-.05em}.center small{color:var(--cyan)}.joy{position:fixed;z-index:20;left:14px;bottom:calc(var(--nav) + 25px + env(safe-area-inset-bottom));width:145px;height:145px}.base{position:absolute;left:16px;top:16px;width:112px;height:112px;border-radius:50%;border:1px solid #64eaff55;background:radial-gradient(circle,#64eaff20,#04101dcc)}.knob{position:absolute;left:48px;top:48px;width:48px;height:48px;border-radius:50%;border:1px solid #64eaffaa;background:#16405ddd;box-shadow:0 0 24px #64eaff44}.jlab{position:absolute;bottom:-2px;width:100%;text-align:center;font-size:8px;color:var(--mut)}.right{position:fixed;z-index:20;right:12px;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));width:190px;height:190px}.round{position:absolute;border-radius:50%;border:1px solid var(--line);background:#07121ddd;font-weight:900}.round:active{transform:scale(.92);filter:brightness(1.35)}.zp{width:58px;height:58px;right:66px;top:0;color:var(--cyan)}.zm{width:58px;height:58px;right:66px;bottom:0;color:var(--cyan)}.long{width:78px;height:78px;right:0;bottom:50px;color:var(--up);border-color:#58ffad88}.short{width:68px;height:68px;left:0;bottom:44px;color:var(--dn);border-color:#ff637d88}.flat{width:46px;height:46px;left:72px;bottom:71px;color:var(--gold)}.nav{position:fixed;z-index:25;left:8px;right:8px;bottom:max(7px,env(safe-area-inset-bottom));height:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border:1px solid var(--line);border-radius:20px;background:#040a14eb;backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:var(--mut);border-radius:13px;font-size:9px}.nav span{display:block;font-size:20px}.sheet{position:fixed;z-index:30;left:8px;right:8px;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));max-height:58vh;overflow:auto;padding:13px;border:1px solid var(--line);border-radius:22px;background:#040b16f7;transform:translateY(130%);opacity:0;transition:.2s}.sheet.open{transform:translateY(0);opacity:1}.row{display:flex;justify-content:space-between;align-items:center}.x,.btn,input,select{border:1px solid var(--line);background:#081522;border-radius:12px;padding:10px;color:var(--txt)}.x{width:34px;height:34px;padding:0;border-radius:50%}.btn,input,select{width:100%;margin-top:8px}.metric{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px;border:1px solid var(--line);border-radius:12px;margin-top:7px}.metric small{color:var(--mut)}.toast{position:fixed;z-index:50;left:50%;bottom:250px;transform:translateX(-50%);padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#040a14ee;font-size:11px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(min-width:900px){.nav{left:50%;right:auto;transform:translateX(-50%);width:650px}.joy{left:5vw}.right{right:5vw}.sheet{left:50%;right:auto;width:560px;transform:translate(-50%,130%)}.sheet.open{transform:translate(-50%,0)}}
</style></head>
<body>
<div id="world"></div><div class="shade"></div>
<div class="top"><div class="head"><div class="brand">界</div><div><b>11520 花果山宇宙萬物交易所</b><small>Robot Organ · 血管內 3D 交易世界</small></div><button class="home" id="home">⌂</button></div><div class="walletbar"><div class="asset"><small>BNB</small><b id="bnb">未連線</b></div><div class="asset"><small>KGEN</small><b id="kgen">未連線</b></div><div class="asset"><small>KAIOS</small><b id="kaios">未連線</b></div></div><div class="axisbar"><button data-axis="KX">KX · KGEN</button><button data-axis="KY">KY · KAIOS</button><button class="on" data-axis="KZ">KZ · BTC</button></div></div>
<div class="mini">空間 XYZ｜血管內位置<b id="xyz">X 0.0 · Y 0.0 · Z 0.0</b><span>XY 橫切面｜Z 雙向血管長度</span></div>

<section class="sheet" id="sheet"><div class="row"><b id="title">功能</b><button class="x" id="close">×</button></div><div id="body"></div></section><div class="toast" id="toast"></div>
<script src="../12345/assets/ethers-5.7.2.umd.min.js"></script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const KGEN='0xBA3d3810e58735cb6813bC1CDc5458C0d71432Be',KAIOS='0xD4E67B3a69e41524c424150E6b6e921b01D036db',ERC20=['function balanceOf(address) view returns(uint256)','function decimals() view returns(uint8)'];
const S={btc:0,kgenMark:0.0002524,kaiosMark:null,target:'KZ',wallet:null,bal:{bnb:null,kgen:null,kaios:null},spatial:{x:0,y:0,z:0},move:{x:0,y:0},zDir:0,zSpeed:0,warp:1,margin:100,pos:null,sandboxKaios:1000};
function fmt(v,d=2){return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:d})}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),1800)}function mark(a=S.target){return a==='KX'?S.kgenMark:a==='KY'?S.kaiosMark:S.btc}function pair(a=S.target){return a==='KX'?'KGEN / WBNB':a==='KY'?'KAIOS / MARKET':'BTC / USDT'}function hud(){const m=mark();$('#xyz').textContent=`X ${fmt(S.spatial.x,1)} · Y ${fmt(S.spatial.y,1)} · Z ${fmt(S.spatial.z,1)}`;$('#pair').textContent=pair()+' · '+S.target;$('#price').textContent=m==null?'NO QUOTE':(S.target==='KX'?fmt(m,7):'$'+fmt(m,2));$('#bnb').textContent=S.bal.bnb==null?'未連線':fmt(S.bal.bnb,4);$('#kgen').textContent=S.bal.kgen==null?'未連線':fmt(S.bal.kgen,4);$('#kaios').textContent=S.bal.kaios==null?'未連線':fmt(S.bal.kaios,2)}
async function quote(){try{const r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT',{cache:'no-store'}),j=await r.json();S.btc=Number(j.price);hud();if(S.pos)markPos()}catch{if(S.target==='KZ')$('#mode').textContent='BTC 行情暫離線'}}setInterval(quote,2500);quote();
$$('.axisbar button').forEach(b=>b.onclick=()=>{S.target=b.dataset.axis;$$('.axisbar button').forEach(x=>x.classList.toggle('on',x===b));hud();toast(S.target==='KY'?'KY 尚未形成正式市場報價':`鎖定 ${S.target}`)});
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02040b,.015);const cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1500);cam.position.set(0,2,9);const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);$('#world').appendChild(R.domElement);const pts=[];for(let i=0;i<1400;i++)pts.push((Math.random()-.5)*160,(Math.random()-.5)*90,-Math.random()*650);const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(G,new THREE.PointsMaterial({size:.22,color:0x8fdcff})));for(let i=0;i<7;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(5+i*.9,.11,8,80),new THREE.MeshBasicMaterial({color:0xff3158,wireframe:true,transparent:true,opacity:.32}));t.position.z=-10-i*12;t.rotation.x=Math.PI/2;scene.add(t)}const ship=new THREE.Mesh(new THREE.OctahedronGeometry(.55),new THREE.MeshBasicMaterial({color:0xffd76b,wireframe:true}));ship.position.z=-2;scene.add(ship);const ufo=new THREE.Mesh(new THREE.SphereGeometry(.55,16,8),new THREE.MeshBasicMaterial({color:0x61e9ff,wireframe:true}));ufo.scale.set(1.8,.45,1.2);ufo.position.set(3.8,.7,-7);scene.add(ufo);
const joy=$('#joy'),knob=$('#knob');let pid=null,start={x:72,y:72};function jm(e){const r=joy.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(pid===null){pid=e.pointerId;start={x,y};joy.setPointerCapture(pid)}if(e.pointerId!==pid)return;let dx=x-start.x,dy=y-start.y,l=Math.hypot(dx,dy)||1,max=43;if(l>max){dx*=max/l;dy*=max/l}knob.style.left=start.x+dx-24+'px';knob.style.top=start.y+dy-24+'px';S.move={x:dx/max,y:-dy/max}}function je(e){if(e.pointerId!==pid)return;pid=null;S.move={x:0,y:0};knob.style.left='48px';knob.style.top='48px'}joy.onpointerdown=jm;joy.onpointermove=e=>pid!==null&&jm(e);joy.onpointerup=je;joy.onpointercancel=je;
function zStart(dir){S.zDir=dir;$('#mode').textContent=dir>0?'Z+ 前進':'Z− 後退'}function zStop(){S.zDir=0;$('#mode').textContent='左手 XY · 右手 Z+/Z− · 多空攻擊'}['pointerup','pointercancel','pointerleave'].forEach(ev=>{$('#zp').addEventListener(ev,zStop);$('#zm').addEventListener(ev,zStop)});$('#zp').onpointerdown=()=>zStart(1);$('#zm').onpointerdown=()=>zStart(-1);
function pnl(){if(!S.pos)return 0;const m=mark();if(m==null)return 0;return(m-S.pos.entry)*(S.pos.side==='LONG'?1:-1)*S.pos.warp}function markPos(){if(!S.pos)return;$('#mode').textContent=`${S.pos.side==='LONG'?'多':'空'} ${S.pos.warp}C · ${pnl()>=0?'+':''}${fmt(pnl(),2)} KAIOS`}function attack(side){const m=mark();if(m==null)return toast('此軸沒有可交易報價');if(S.pos)return toast('先平倉');S.pos={side,entry:m,warp:S.warp,axis:S.target,c:S.margin};markPos();toast(`${S.target} ${side==='LONG'?'多':'空'}方出擊`)}function flatten(){if(!S.pos)return toast('目前空倉');const p=Math.max(-S.pos.c,Math.min(S.pos.c,pnl()));S.sandboxKaios+=p;S.pos=null;toast(`結算 ${p>=0?'+':''}${fmt(p,2)} KAIOS`);$('#mode').textContent='平倉完成'}$('#long').onclick=()=>attack('LONG');$('#short').onclick=()=>attack('SHORT');$('#flat').onclick=flatten;
function panel(p){$('#sheet').classList.add('open');const b=$('#body');if(p==='world'){$('#title').textContent='🌌 11520 血管世界';b.innerHTML=`<div class="metric"><small>XYZ 空間</small><b>${$('#xyz').textContent}</b></div><div class="metric"><small>Z 控制</small><b>Z+ 前進 / Z− 後退</b></div><div class="metric"><small>ATM</small><b>靠近飛碟後互動換鈔</b></div>`}else if(p==='asset'){$('#title').textContent='🩸 資產';b.innerHTML=`<div class="metric"><small>BNB</small><b>${S.bal.bnb==null?'未連錢包':fmt(S.bal.bnb,6)}</b></div><div class="metric"><small>KGEN</small><b>${S.bal.kgen==null?'未連錢包':fmt(S.bal.kgen,6)}</b></div><div class="metric"><small>KAIOS</small><b>${S.bal.kaios==null?'未連錢包':fmt(S.bal.kaios,4)}</b></div><div class="metric"><small>沙盒 KAIOS</small><b>${fmt(S.sandboxKaios,2)}</b></div>`}else if(p==='trade'){$('#title').textContent='⚔️ 多空 / 曲速';b.innerHTML=`<select id="warp"><option>0.0000001</option><option>.001</option><option>.01</option><option>.1</option><option>1</option><option>10</option><option>100</option><option>1000</option></select><input id="margin" type="number" value="${S.margin}" min="1"><button class="btn" id="saveTrade">套用</button>`;setTimeout(()=>{$('#warp').value=S.warp;$('#saveTrade').onclick=()=>{S.warp=Number($('#warp').value);S.margin=Math.max(1,Number($('#margin').value)||1);toast(`${S.warp}C / ${S.margin} KAIOS`)}},0)}else if(p==='atm'){$('#title').textContent='🛸 行動 ATM';b.innerHTML=`<div class="metric"><small>ATM-RED-01</small><b>1 KGEN ↔ 777 KAIOS</b></div><button class="btn" id="atmDemo">沙盒換 1 KGEN → 777 KAIOS</button><small style="color:var(--mut)">正式鏈上換匯仍 fail-closed；此按鈕不發送真資產。</small>`;setTimeout(()=>$('#atmDemo').onclick=()=>{S.sandboxKaios+=777;toast('+777 沙盒 KAIOS')},0)}else{$('#title').textContent='👤 生命 / 錢包';b.innerHTML=`<button class="btn" id="connect">連接 BSC 錢包</button><div class="metric"><small>生命錢包</small><b>${S.wallet||'尚未連線'}</b></div>`;setTimeout(()=>$('#connect').onclick=connect,0)}}$$('.nav button').forEach(x=>x.onclick=()=>panel(x.dataset.p));$('#close').onclick=()=>$('#sheet').classList.remove('open');$('#home').onclick=()=>location.href='../../index.html';
async function connect(){if(!window.ethereum)return toast('請用支援 Web3 的錢包瀏覽器');try{const[a]=await ethereum.request({method:'eth_requestAccounts'});S.wallet=a;const p=new ethers.providers.Web3Provider(window.ethereum);const net=await p.getNetwork();if(Number(net.chainId)!==56)toast('目前不是 BSC 主網，餘額讀取仍嘗試進行');const [bnb,kgen,kaios]=await Promise.all([p.getBalance(a),tokenBal(p,KGEN,a),tokenBal(p,KAIOS,a)]);S.bal.bnb=Number(ethers.utils.formatEther(bnb));S.bal.kgen=kgen;S.bal.kaios=kaios;hud();panel('me');toast('錢包已連線')}catch(e){toast('連線取消或失敗')}}async function tokenBal(p,addr,a){const c=new ethers.Contract(addr,ERC20,p),[bal,dec]=await Promise.all([c.balanceOf(a),c.decimals()]);return Number(ethers.utils.formatUnits(bal,dec))}
let t=0;function anim(){requestAnimationFrame(anim);t+=.01;ship.position.x=Math.max(-5,Math.min(5,ship.position.x+S.move.x*.06));ship.position.y=Math.max(-3,Math.min(4,ship.position.y+S.move.y*.06));const accel=S.zDir*.018,max=.42;S.zSpeed+=accel;S.zSpeed*=S.zDir===0?.90:.97;S.zSpeed=Math.max(-max,Math.min(max,S.zSpeed));S.spatial.z+=S.zSpeed;S.spatial.x=ship.position.x;S.spatial.y=ship.position.y;cam.position.x+=(ship.position.x*.32-cam.position.x)*.05;cam.position.y+=(2+ship.position.y*.24-cam.position.y)*.05;ufo.position.x=3.8+Math.sin(t*.7)*1.7;ufo.position.y=.7+Math.cos(t*.5)*.6;scene.children.forEach(o=>{if(o.geometry&&o.geometry.type==='TorusGeometry'){o.position.z+=S.zSpeed*.9;if(o.position.z>8)o.position.z=-90;if(o.position.z<-95)o.position.z=7}});hud();R.render(scene,cam)}anim();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});hud();
</script></body></html>
