<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02040b"><title>11520｜花果山宇宙萬物交易所</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--g:#07101eea;--l:#64eaff66;--c:#64eaff;--u:#58ffad;--d:#ff637d;--gold:#ffd56a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040b;color:#f5fbff;font-family:system-ui,"Noto Sans TC",sans-serif}button,input,select{font:inherit;color:inherit}.glass{background:var(--g);border:1px solid var(--l);backdrop-filter:blur(10px)}#map,#world{position:fixed;inset:0}#world{display:none;background:linear-gradient(#07131b 55%,#274b2d 55%)}.top{position:fixed;z-index:600;top:max(6px,env(safe-area-inset-top));left:7px;right:7px;height:52px;border-radius:17px;display:grid;grid-template-columns:38px 1fr 38px 38px;gap:7px;align-items:center;padding:6px}.round{height:38px;border-radius:50%;border:1px solid var(--l);background:#07121d}.brand b{font-size:11px}.brand small{display:block;color:#8daabb;font-size:7px}.axes{position:fixed;z-index:550;left:7px;right:7px;top:65px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.axis{padding:5px;border-radius:13px;min-width:0}.axis select{width:100%;background:#07121d;border:1px solid var(--l);border-radius:8px;padding:4px;font-size:7px}.axis b{font-size:9px;color:var(--gold)}.axis small{font-size:7px;color:#8daabb}.tele{position:fixed;z-index:520;left:7px;top:154px;border-radius:13px;padding:8px;font-size:8px;color:#9bb4c3}.tele b{display:block;color:white}.center{position:fixed;z-index:510;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;text-shadow:0 3px 15px #000}.price{font-size:clamp(30px,8vw,54px);font-weight:900}.rail{position:fixed;z-index:610;right:7px;top:52%;width:46px;padding:4px;border-radius:17px;display:grid;gap:4px}.rail button{height:39px;border:0;border-radius:11px;background:#ffffff08;font-size:15px}.rail small{display:block;font-size:6px}.joy{position:fixed;z-index:530;left:28px;bottom:20px;width:138px;height:138px;border:2px solid #64eaff55;border-radius:50%;background:#07121dcc;touch-action:none}.knob{position:absolute;left:42px;top:42px;width:54px;height:54px;border:2px solid var(--c);border-radius:50%;background:#16405ddd}.actions{position:fixed;z-index:530;right:55px;bottom:12px;width:185px;height:175px}.a{position:absolute;border-radius:50%;border:1px solid var(--l);background:#07121ddd;font-weight:900}.long{width:72px;height:72px;right:0;bottom:0;color:var(--u)}.short{width:62px;height:62px;right:78px;bottom:0;color:var(--d)}.flat{width:44px;height:44px;right:100px;bottom:68px;color:var(--gold)}.fight{width:72px;height:72px;left:0;bottom:90px;color:#ffb86b}.sheet{position:fixed;z-index:800;left:7px;right:57px;bottom:9px;max-height:72vh;overflow:auto;padding:12px;border-radius:20px;background:#040b16fa;transform:translateY(120%);visibility:hidden;transition:.18s}.sheet.open{transform:none;visibility:visible}.head{display:flex;justify-content:space-between;align-items:center}.x,.btn{border:1px solid var(--l);background:#102033;border-radius:12px;padding:10px}.x{width:42px;height:42px;border-radius:50%}.btn{width:100%;margin-top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tiny{font-size:9px;color:#9bb4c3;line-height:1.5}.guide{position:fixed;z-index:1100;inset:0;background:radial-gradient(circle at 50% 30%,#12334d,#02040bf5 65%);display:grid;place-items:center;padding:16px}.guide.hide{display:none}.guideCard{width:min(480px,100%);text-align:center}.guideFace{width:116px;height:116px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:70px;background:radial-gradient(circle,#173f59,#07121d);border:2px solid var(--c);box-shadow:0 0 35px #64eaff66;animation:breathe 2.5s infinite}@keyframes breathe{50%{transform:scale(1.04);box-shadow:0 0 55px #64eaff88}}.bubble{margin:14px 0;padding:14px;border-radius:18px;text-align:left;font-size:14px;line-height:1.6}.choices{display:grid;gap:8px}.choices button{padding:12px;border:1px solid var(--l);border-radius:14px;background:#0b1c2b}.guideInput{width:100%;padding:12px;border-radius:12px;border:1px solid var(--l);background:#081522;margin-bottom:8px}.avatarDock{position:fixed;z-index:505;left:50%;bottom:170px;transform:translateX(-50%);text-align:center}.avatar{font-size:64px;filter:drop-shadow(0 8px 12px #000);transition:.2s}.avatarName{font-size:8px;background:#07121dcc;border-radius:8px;padding:2px 6px}.sound{position:fixed;z-index:620;right:55px;top:8px}.hp{position:fixed;z-index:520;right:58px;top:154px;padding:7px;border-radius:12px;font-size:8px}.bar{height:5px;width:110px;background:#223;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--u)}@media(max-width:390px){.joy{left:18px;bottom:16px}.actions{right:49px;transform:scale(.92);transform-origin:right bottom}}</style><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script></head><body><div id="map"></div><div id="world"></div><header class="top glass"><button class="round" id="home">⌂</button><div class="brand"><b>11520 花果山宇宙萬物交易所</b><small>GPS 地球生活 × KX/KY/KZ 球膜交易 × KAIOS 結算</small></div><button class="round" id="mode">🗺️</button><button class="round" id="profile">👤</button></header><button class="round sound" id="sound">🔊</button><section class="axes" id="axes"></section><div class="tele glass"><span>我的世界位置</span><b id="xyz">X 0 · Y 0 · Z 0</b><div id="gps">GPS 等待授權</div><div id="walk">步行 0 m</div><b id="cash">KAIOS 1000 · KGEN 10</b><span id="feed">行情同步中</span></div><div class="hp glass"><b>生命 HP <span id="hp">100</span></b><div class="bar"><i id="hpbar" style="width:100%"></i></div><span id="monster">附近怪物搜尋中</span></div><div class="center"><div id="pair">KX · BTC/USDT</div><div class="price" id="price">--</div><small id="modeText">GPS 地球生活模式</small></div><div class="avatarDock"><div class="avatar" id="avatar">🧙‍♀️</div><span class="avatarName" id="avatarName">旅人</span></div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="actions"><button class="a fight" id="fight">⚔️<br>打怪</button><button class="a flat" id="flat">平</button><button class="a short" id="short">空 KX</button><button class="a long" id="long">多 KX</button></div><nav class="rail glass"><button id="gpsBtn">🗺️<small>GPS</small></button><button id="navBtn">🧭<small>導航</small></button><button id="buildBtn">🏗️<small>建設</small></button><button id="atmBtn">🛸<small>ATM</small></button><button id="helpBtn">✨<small>AI</small></button><button id="dressBtn">👗<small>角色</small></button></nav><section class="sheet" id="sheet"><div class="head"><b id="title">功能</b><button class="x" id="close">×</button></div><div id="body"></div></section><section class="guide" id="guide"><div class="guideCard"><div class="guideFace" id="guideFace">🧚‍♀️</div><div class="bubble glass" id="bubble">嗨，我是花果山的引路人。第一次來不用填一大張表，我陪你慢慢開始。</div><div class="choices" id="choices"><button data-go="hello">👋 好，帶我進去</button><button data-go="mute">🔇 先不要語音</button></div></div></section><script>const $=s=>document.querySelector(s);const M=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT','LTCUSDT'];const S={axis:'KX',slots:{KX:M[0],KY:M[1],KZ:M[2]},q:{},kaios:1000,kgen:10,pos:{KX:null,KY:null,KZ:null},xyz:{x:0,y:0,z:0},gps:null,walk:0,hp:100,mode:'gps',voice:true,name:'旅人',birth:'',origin:'',avatar:'🧙‍♀️',outfit:'冒險裝',story:0,monsters:[]};let map,marker,watch,joyOn=false,lastPoint=null;function say(t){$('#bubble').textContent=t;if(S.voice&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.92;speechSynthesis.speak(u)}}function save(){localStorage.setItem('k11520-life',JSON.stringify(S))}function load(){try{Object.assign(S,JSON.parse(localStorage.getItem('k11520-life')||'{}'))}catch{}}function initMap(){map=L.map('map',{zoomControl:false}).setView([23.7,121],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}function locate(){if(!navigator.geolocation){alert('此裝置不支援 GPS');return}watch=navigator.geolocation.watchPosition(p=>{let n=[p.coords.latitude,p.coords.longitude];S.gps=n;$('#gps').textContent=`GPS ${n[0].toFixed(5)}, ${n[1].toFixed(5)} ±${Math.round(p.coords.accuracy)}m`;if(lastPoint){let d=map.distance(lastPoint,n);if(d<100)S.walk+=d}lastPoint=n;if(!marker)marker=L.marker(n,{icon:L.divIcon({html:`<div style="font-size:34px">${S.avatar}</div>`,className:''})}).addTo(map);else{marker.setLatLng(n);marker.setIcon(L.divIcon({html:`<div style="font-size:34px">${S.avatar}</div>`,className:''}))}map.setView(n,18);spawn();hud()},e=>{$('#gps').textContent='GPS 未授權：'+e.message},{enableHighAccuracy:true,maximumAge:3000,timeout:10000})}function spawn(){if(!S.gps||S.monsters.length)return;['👹','🦂','🐲','👾'].forEach((emo,i)=>{let a=(i+1)*1.7,d=.00035+i*.00012,lat=S.gps[0]+Math.sin(a)*d,lng=S.gps[1]+Math.cos(a)*d,m={emo,hp:60+i*20,lat,lng};m.mk=L.marker([lat,lng],{icon:L.divIcon({html:`<div style="font-size:30px">${emo}</div>`,className:''})}).addTo(map);S.monsters.push(m)})}function hit(){if(!S.monsters.length){alert('附近還沒有怪物');return}let m=S.monsters[0],dist=S.gps?map.distance(S.gps,[m.lat,m.lng]):999;if(S.mode==='gps'&&dist>60){alert(`怪物還有 ${Math.round(dist)}m，走近一點`);return}m.hp-=25;if(m.hp<=0){map.removeLayer(m.mk);S.monsters.shift();S.kaios+=3;alert('擊敗怪物！沙盒獎勵 +3 KAIOS')}else{S.hp=Math.max(0,S.hp-8)}hud()}function axes(){$('#axes').innerHTML=['KX','KY','KZ'].map(a=>`<div class="axis glass"><small>${a} 球膜軸</small><select data-a="${a}">${M.map(m=>`<option ${S.slots[a]===m?'selected':''}>${m.replace('USDT','/USDT')}</option>`).join('')}</select><b id="q${a}">--</b><small id="p${a}">空倉</small></div>`).join('');document.querySelectorAll('[data-a]').forEach(x=>x.onchange=()=>{let a=x.dataset.a;S.slots[a]=x.value.replace('/','');S.axis=a;hud()})}async function quotes(){try{let r=await fetch('https://api.binance.com/api/v3/ticker/price');let j=await r.json();j.forEach(x=>{if(M.includes(x.symbol))S.q[x.symbol]=+x.price});$('#feed').textContent='行情 LIVE'}catch{$('#feed').textContent='行情暫停'}hud()}function hud(){['KX','KY','KZ'].forEach(a=>{$('#q'+a).textContent=S.q[S.slots[a]]?fmt(S.q[S.slots[a]]):'--';let p=S.pos[a];$('#p'+a).textContent=p?`${p.side} · ${p.margin} KAIOS`:'空倉'});$('#pair').textContent=`${S.axis} · ${S.slots[S.axis].replace('USDT','/USDT')}`;$('#price').textContent=S.q[S.slots[S.axis]]?fmt(S.q[S.slots[S.axis]]):'--';$('#xyz').textContent=`X ${S.xyz.x.toFixed(1)} · Y ${S.xyz.y.toFixed(1)} · Z ${S.xyz.z.toFixed(1)}`;$('#walk').textContent=`步行 ${Math.round(S.walk)} m · 約 ${Math.round(S.walk/0.72)} 步`;$('#cash').textContent=`KAIOS ${S.kaios.toFixed(1)} · KGEN ${S.kgen.toFixed(3)}`;$('#hp').textContent=S.hp;$('#hpbar').style.width=S.hp+'%';$('#avatar').textContent=S.avatar;$('#avatarName').textContent=S.name;$('#monster').textContent=S.monsters[0]?`${S.monsters[0].emo} 怪物 HP ${S.monsters[0].hp}`:'附近怪物搜尋中';save()}function fmt(v){return '$'+v.toLocaleString(undefined,{maximumFractionDigits:v>10?2:6})}function trade(side){let a=S.axis,p=S.q[S.slots[a]];if(!p)return alert('行情尚未取得');if(S.pos[a])return alert(`${a} 已有持倉，先平倉`);let margin=Math.min(100,S.kaios);if(!margin)return alert('KAIOS 不足');S.kaios-=margin;S.pos[a]={side,entry:p,margin};hud()}function flatten(){let a=S.axis,p=S.pos[a],q=S.q[S.slots[a]];if(!p)return;let pnl=p.margin*((q-p.entry)/p.entry)*(p.side==='多'?1:-1);S.kaios+=Math.max(0,p.margin+pnl);S.pos[a]=null;alert(`${a} 平倉 ${pnl>=0?'+':''}${pnl.toFixed(2)} KAIOS`);hud()}function panel(t,h){$('#title').textContent=t;$('#body').innerHTML=h;$('#sheet').classList.add('open')}function close(){ $('#sheet').classList.remove('open')}function story(step){S.story=step;let c=$('#choices');if(step===1){say('先告訴我，我該怎麼稱呼你？');c.innerHTML='<input class="guideInput" id="nm" placeholder="你的名字或暱稱"><button id="nmok">就叫這個名字</button>';$('#nmok').onclick=()=>{S.name=$('#nm').value.trim()||'旅人';story(2)}}else if(step===2){say(`${S.name}，歡迎你。接著選一個你喜歡的樣子，之後隨時都能換。`);c.innerHTML='<div class="row"><button data-av="🧙‍♀️">女冒險者</button><button data-av="🧙‍♂️">男冒險者</button><button data-av="🥷">忍者</button><button data-av="🧑‍🚀">宇航員</button></div>';c.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{S.avatar=b.dataset.av;story(3)})}else if(step===3){say('你的生日可以讓世界記住你的出生故事。你也可以稍後再告訴我。');c.innerHTML='<input class="guideInput" id="bd" type="date"><button id="bdok">記住我的生日</button><button id="bdskip">稍後再說</button>';$('#bdok').onclick=()=>{S.birth=$('#bd').value;story(4)};$('#bdskip').onclick=()=>story(4)}else if(step===4){say('要不要讓我用 GPS 帶你進入真實世界？你走一步，遊戲裡的你也會走一步。');c.innerHTML='<button id="gpsyes">📍 好，使用我的位置</button><button id="gpsno">先從花果山開始</button>';$('#gpsyes').onclick=()=>{S.origin='GPS';locate();story(5)};$('#gpsno').onclick=()=>{S.origin='11520花果山';story(5)}}else if(step===5){say('準備好了。前面有怪物、ATM、商場和三個球膜市場。別擔心，我一直在右邊的 AI 按鈕裡。');c.innerHTML='<button id="enter">🌄 進入我的世界</button>';$('#enter').onclick=()=>{$('#guide').classList.add('hide');hud();if(S.voice)say(`歡迎來到花果山，${S.name}。先四處走走吧。`)}}}function dress(){panel('角色與裝扮',`<p class="tiny">角色不是鎖死的，任何時候都可以換。</p><div class="row"><button class="btn av">🧙‍♀️ 女冒險者</button><button class="btn av">🧙‍♂️ 男冒險者</button><button class="btn av">🥷 忍者</button><button class="btn av">🧑‍🚀 宇航員</button></div><select class="btn" id="out"><option>冒險裝</option><option>騎士裝甲</option><option>花果山便服</option><option>太空裝</option></select>`);document.querySelectorAll('.av').forEach(b=>b.onclick=()=>{S.avatar=b.textContent.trim().split(' ')[0];hud()});$('#out').onchange=e=>{S.outfit=e.target.value;save()}}function ai(){panel('AI 引路人',`<div style="text-align:center;font-size:52px">🧚‍♀️</div><p id="aiText">${S.name}，我在。你可以問我怎麼走、怎麼打怪、怎麼用 ATM 或怎麼交易。</p><input class="btn" id="ask" placeholder="跟我說話…"><button class="btn" id="askBtn">🎙️ 說給我聽 / 送出</button><button class="btn" id="intro">🔊 再介紹一次世界</button>`);$('#intro').onclick=()=>say('這裡是花果山。左下控制移動，右邊可以導航、建設、換鈔與找我。上方三軸是不同市場，KAIOS 是統一結算鈔票。');$('#askBtn').onclick=()=>{let t=$('#ask').value;let r=t.includes('ATM')||t.includes('換')?'按右側飛碟 ATM，可以使用固定換鈔站或行動飛碟報價。':t.includes('怪')?'靠近怪物六十公尺內，再按右下打怪。':t.includes('交易')?'先選 KX、KY 或 KZ 的市場，再選多或空；每一軸保證金獨立。':'我聽到了。現在這版是本機引導 AI，正式對話模型之後可接同一個角色。';$('#aiText').textContent=r;say(r)}}function setupJoy(){let j=$('#joy'),k=$('#knob');function mv(e){if(!joyOn)return;let r=j.getBoundingClientRect(),p=e.touches?e.touches[0]:e,dx=p.clientX-(r.left+r.width/2),dy=p.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,s=Math.min(42,m)/m;dx*=s;dy*=s;k.style.transform=`translate(${dx}px,${dy}px)`;S.xyz.x+=dx*.004;S.xyz.z-=dy*.004;hud()}j.addEventListener('pointerdown',e=>{joyOn=true;j.setPointerCapture(e.pointerId);mv(e)});j.addEventListener('pointermove',mv);j.addEventListener('pointerup',()=>{joyOn=false;k.style.transform=''})}load();initMap();axes();setupJoy();quotes();setInterval(quotes,5000);$('#fight').onclick=hit;$('#long').onclick=()=>trade('多');$('#short').onclick=()=>trade('空');$('#flat').onclick=flatten;$('#close').onclick=close;$('#sound').onclick=()=>{S.voice=!S.voice;$('#sound').textContent=S.voice?'🔊':'🔇';if(!S.voice)speechSynthesis.cancel();save()};$('#mode').onclick=()=>{S.mode=S.mode==='gps'?'3d':'gps';$('#map').style.display=S.mode==='gps'?'block':'none';$('#world').style.display=S.mode==='3d'?'block':'none';$('#modeText').textContent=S.mode==='gps'?'GPS 地球生活模式':'3D 宇宙模式';$('#mode').textContent=S.mode==='gps'?'🗺️':'🌌'};$('#gpsBtn').onclick=()=>{locate();panel('GPS 地球生活','<p class="tiny">授權後，現實走動會更新遊戲位置。GPS 與資產交易分離。</p>')};$('#navBtn').onclick=()=>panel('地球導航','<button class="btn" id="gm">🧭 開啟 Google Maps</button><button class="btn" id="gas">⛽ 找附近加油站</button>');$('#buildBtn').onclick=()=>panel('建設',`<p class="tiny">在目前位置建立生活設施（本機沙盒）。</p><div class="row"><button class="btn">🏠 房子</button><button class="btn">🏬 商場</button><button class="btn">🏭 工廠</button><button class="btn">🌳 花園</button></div>`);$('#atmBtn').onclick=()=>panel('ATM／行動飛碟',`<p class="tiny">固定 ATM：KGEN ↔ KAIOS。行動飛碟 ATM 可移動、自主報價、雙方同意成交。真資產仍 fail-closed。</p><div class="row"><button class="btn" id="buy">1 KGEN → 500 KAIOS</button><button class="btn" id="wish">1 KGEN → 800 KAIOS（許願示意）</button></div><button class="btn">🛸 呼叫行動飛碟 ATM</button>`);$('#helpBtn').onclick=ai;$('#dressBtn').onclick=dress;$('#profile').onclick=dress;$('#choices').onclick=e=>{if(e.target.dataset.go==='hello')story(1);if(e.target.dataset.go==='mute'){S.voice=false;story(1)}};document.addEventListener('click',e=>{if(e.target.id==='gm')location.href='https://www.google.com/maps/dir/?api=1';if(e.target.id==='gas')location.href='https://www.google.com/maps/search/?api=1&query=gas+station';if(e.target.id==='buy'&&S.kgen>=1){S.kgen--;S.kaios+=500;hud();alert('沙盒換鈔完成')};if(e.target.id==='wish'&&S.kgen>=1){S.kgen--;S.kaios+=800;hud();alert('沙盒許願匯率示意完成')}});if(localStorage.getItem('k11520-life')&&S.name!=='旅人'){$('#guide').classList.add('hide')}hud();</script></body></html>
