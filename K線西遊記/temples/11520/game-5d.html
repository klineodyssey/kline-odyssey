<body>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const HOT=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT','LTCUSDT'];
const MORE=['AVAXUSDT','SUIUSDT','DOTUSDT','SHIBUSDT','PEPEUSDT','BCHUSDT','NEARUSDT','ARBUSDT','APTUSDT','TONUSDT'];
const MARKETS=[...HOT,...MORE];
const LABEL=Object.fromEntries(MARKETS.map(s=>[s,s.replace('USDT','/USDT')]));
const S={axis:'KX',slots:{KX:'BTCUSDT',KY:'ETHUSDT',KZ:'BNBUSDT'},quotes:{},quoteTs:{},kaios:1000,margin:0,warp:1,pos:null,move:{x:0,y:0},spatial:{x:0,y:0,z:0},zVel:0,zDir:0,yaw:0,pitch:0,menu:0};
const STALE=8000;const menus=[['🌌','宇宙','world'],['💰','資產','asset'],['⚔️','交易','trade'],['🛸','ATM','atm'],['👤','生命','me']];
function fmt(v,d=2){return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:d})}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),1700)}function fresh(sym){return !!S.quotes[sym]&&Date.now()-(S.quoteTs[sym]||0)<=STALE}function active(){return S.slots[S.axis]}function price(){return S.quotes[active()]||0}
function optionHtml(sel){return `<optgroup label="熱門 10">${HOT.map(s=>`<option value="${s}" ${s===sel?'selected':''}>${LABEL[s]}</option>`).join('')}</optgroup><optgroup label="更多宇宙">${MORE.map(s=>`<option value="${s}" ${s===sel?'selected':''}>${LABEL[s]}</option>`).join('')}</optgroup>`}
function renderAxes(){const box=$('#axisDock');box.innerHTML=['KX','KY','KZ'].map(a=>{const s=S.slots[a];return `<div class="axis ${a===S.axis?'on':''}" data-axis="${a}"><div class="axisHead"><span>${a} 球膜軸</span><b>${fresh(s)?'LIVE':'WAIT'}</b></div><select data-sel="${a}">${optionHtml(s)}</select><span class="q">${S.quotes[s]?'$'+fmt(S.quotes[s],S.quotes[s]<10?5:2):'--'}</span><span class="age">${S.quoteTs[s]?Math.round((Date.now()-S.quoteTs[s])/1000)+'s':'--'}</span></div>`}).join('');$$('.axis').forEach(el=>el.onclick=e=>{if(e.target.tagName==='SELECT')return;S.axis=el.dataset.axis;renderAxes();hud()});$$('select[data-sel]').forEach(sel=>sel.onchange=e=>{const a=e.target.dataset.sel;S.slots[a]=e.target.value;S.axis=a;renderAxes();hud();toast(`${a} → ${LABEL[e.target.value]}`)})}
function hud(){const s=active(),p=price(),ok=fresh(s);$('#xyz').textContent=`X ${fmt(S.spatial.x,1)} · Y ${fmt(S.spatial.y,1)} · Z ${fmt(S.spatial.z,1)}`;$('#ctMini').textContent=`鎖定 ${S.axis} · ${LABEL[s]} · CT ${p?fmt(p,4):'--'}`;$('#cashMini').textContent=`KAIOS ${fmt(S.kaios,1)} · 保證金 ${fmt(S.margin,1)}`;$('#pairLabel').textContent=`${S.axis} · ${LABEL[s]}`;$('#price').textContent=p?'$'+fmt(p,p<10?5:2):'--';$('#long').textContent=`多 ${S.axis}`;$('#short').textContent=`空 ${S.axis}`;$('#feedHealth').textContent=ok?'行情 LIVE':'行情 WAIT';$('#feedHealth').className='health '+(ok?'ok':'bad');if(S.pos)positionMark()}
async function quote(){try{const symbols=encodeURIComponent(JSON.stringify(MARKETS));const r=await fetch(`https://api.binance.com/api/v3/ticker/price?symbols=${symbols}`,{cache:'no-store'});const arr=await r.json();const now=Date.now();for(const q of arr){S.quotes[q.symbol]=Number(q.price);S.quoteTs[q.symbol]=now}renderAxes();hud()}catch{$('#mode').textContent='行情暫離線 · 移動仍可用'}}quote();setInterval(quote,3000);
function pnl(){if(!S.pos)return 0;const now=S.quotes[S.pos.symbol]||S.pos.entry;return(now-S.pos.entry)*(S.pos.side==='LONG'?1:-1)*S.pos.warp}function positionMark(){const p=pnl();$('#mode').textContent=`${S.pos.axis} ${LABEL[S.pos.symbol]} · ${S.pos.side==='LONG'?'多':'空'} ${S.pos.warp}C · ${p>=0?'+':''}${fmt(p,2)} KAIOS`}
function attack(side){const s=active();if(!fresh(s))return toast('行情未同步，暫停下單');if(S.pos)return toast('先平倉再開新單');let m=Math.min(100,S.margin||S.kaios);if(m<=0)return toast('KAIOS 不足');if(S.margin<m){S.kaios-=m;S.margin+=m}S.pos={axis:S.axis,symbol:s,side,entry:S.quotes[s],warp:S.warp,cap:m};hud();toast(`${S.axis} ${LABEL[s]} ${side==='LONG'?'多':'空'}方出擊`)}function flatten(){if(!S.pos)return toast('目前空倉');if(!fresh(S.pos.symbol))return toast('行情過舊，暫停結算');let p=Math.max(-S.pos.cap,Math.min(S.pos.cap,pnl()));S.margin+=p;S.pos=null;$('#mode').textContent=`平倉 ${p>=0?'+':''}${fmt(p,2)} KAIOS`;hud()}$('#long').onclick=()=>attack('LONG');$('#short').onclick=()=>attack('SHORT');$('#flat').onclick=flatten;
const joy=$('#joy'),knob=$('#knob');let pid=null,mode='move',center={x:77,y:69},startA=0,startYaw=0;function local(e){const r=joy.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function jd(e){const p=local(e),dx=p.x-center.x,dy=p.y-center.y,d=Math.hypot(dx,dy);pid=e.pointerId;joy.setPointerCapture(pid);if(d<=58){mode='move';jm(e)}else{mode='rotate';startA=Math.atan2(dy,dx);startYaw=S.yaw}}function jm(e){if(e.pointerId!==pid)return;const p=local(e),dx=p.x-center.x,dy=p.y-center.y;if(mode==='move'){let l=Math.hypot(dx,dy)||1,m=42,nx=dx,ny=dy;if(l>m){nx*=m/l;ny*=m/l}knob.style.left=center.x+nx-23+'px';knob.style.top=center.y+ny-23+'px';S.move={x:nx/m,y:-ny/m}}else{const a=Math.atan2(dy,dx);S.yaw=startYaw+(a-startA);S.pitch=Math.max(-.65,Math.min(.65,-dy/160))}}function ju(e){if(e.pointerId!==pid)return;pid=null;S.move={x:0,y:0};knob.style.left='54px';knob.style.top='46px'}joy.onpointerdown=jd;joy.onpointermove=jm;joy.onpointerup=joy.onpointercancel=ju;
function zset(v){S.zDir=v}$('#zf').onpointerdown=e=>{e.preventDefault();zset(1)};$('#zb').onpointerdown=e=>{e.preventDefault();zset(-1)};['zf','zb'].forEach(id=>{$('#'+id).onpointerup=$('#'+id).onpointercancel=()=>zset(0)});
function panel(p){$('#sheet').classList.add('open');const b=$('#body');if(p==='world'){$('#title').textContent='🌌 K線球膜宇宙';b.innerHTML=`<p class="tiny">KX、KY、KZ 三軸共同形成一顆真實 K線球膜宇宙。每一軸都可獨立選 20 個免費即時市場。XYZ 是你的物體位置，與交易輸贏分開。</p><div class="grid">${['KX','KY','KZ'].map(a=>`<div class="metric"><small>${a}</small><b>${LABEL[S.slots[a]]}</b><span class="tiny">${fresh(S.slots[a])?'LIVE':'WAIT'}</span></div>`).join('')}</div>`}else if(p==='asset'){$('#title').textContent='💰 KAIOS';b.innerHTML=`<div class="grid"><div class="metric"><small>生活錢包</small><b>${fmt(S.kaios,2)}</b></div><div class="metric"><small>保證金</small><b>${fmt(S.margin,2)}</b></div></div><button class="btn" id="dep">放 100 KAIOS 保證金</button><button class="btn" id="wd">保證金回生活錢包</button>`;setTimeout(()=>{$('#dep').onclick=()=>{let n=Math.min(100,S.kaios);S.kaios-=n;S.margin+=n;hud();panel('asset')};$('#wd').onclick=()=>{S.kaios+=S.margin;S.margin=0;hud();panel('asset')}},0)}else if(p==='trade'){$('#title').textContent='⚔️ 交易設定';b.innerHTML=`<div class="metric"><small>目前攻擊目標</small><b>${S.axis} · ${LABEL[active()]}</b><span class="tiny">CT ${fmt(price(),5)}</span></div><select id="warp"><option value="0.0000001">0.0000001C</option><option value="0.001">0.001C</option><option value="0.01">0.01C</option><option value="0.1">0.1C</option><option value="1">1C</option><option value="10">10C</option><option value="100">100C</option><option value="1000">1000C</option></select><p class="tiny">關閉面板後，用右下「多 ${S.axis} / 空 ${S.axis}」下單。</p>`;setTimeout(()=>{$('#warp').value=String(S.warp);$('#warp').onchange=e=>S.warp=Number(e.target.value)},0)}else if(p==='atm'){$('#title').textContent='🛸 ATM';b.innerHTML='<p class="tiny">KGEN ↔ KAIOS 自主匯率換鈔入口保留；公共 20 市場只用免費即時行情。</p>'}else{$('#title').textContent='👤 生命';b.innerHTML='<p class="tiny">這是界曜的 11520 試玩作品。真資產清算仍保持 fail-closed。</p>'}}$('#close').onclick=()=>$('#sheet').classList.remove('open');function renderMenu(){const m=menus[S.menu];$('#navPick').innerHTML=`<span>${m[0]}</span><b>${m[1]}</b>`}function step(d){S.menu=(S.menu+d+menus.length)%menus.length;renderMenu()}$('#navUp').onclick=()=>step(-1);$('#navDown').onclick=()=>step(1);$('#navPick').onclick=()=>panel(menus[S.menu][2]);$('#homeTop').onclick=$('#homeRail').onclick=()=>location.href='../../index.html';$('#walletTop').onclick=()=>panel('me');
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02040b,.016);const cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1500);const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);$('#world').appendChild(R.domElement);const pts=[];for(let i=0;i<1600;i++)pts.push((Math.random()-.5)*180,(Math.random()-.5)*100,-Math.random()*700);const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(G,new THREE.PointsMaterial({size:.23,color:0x8fdcff})));const rings=[];for(let i=0;i<14;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(5+i*.28,.11,8,72),new THREE.MeshBasicMaterial({color:0xff3158,wireframe:true,transparent:true,opacity:.3}));t.position.z=-12-i*9;t.rotation.x=Math.PI/2;scene.add(t);rings.push(t)}const ship=new THREE.Mesh(new THREE.ConeGeometry(.46,1.6,6),new THREE.MeshBasicMaterial({color:0xffd76b,wireframe:true}));ship.rotation.x=Math.PI/2;ship.position.z=-2;scene.add(ship);function anim(){requestAnimationFrame(anim);ship.position.x=Math.max(-5,Math.min(5,ship.position.x+S.move.x*.07));ship.position.y=Math.max(-3,Math.min(4,ship.position.y+S.move.y*.07));S.spatial.x=ship.position.x;S.spatial.y=ship.position.y;S.zVel+=S.zDir*.025;S.zVel*=.94;S.zVel=Math.max(-.7,Math.min(.7,S.zVel));S.spatial.z+=S.zVel;rings.forEach(r=>{r.position.z+=S.zVel*.35;if(r.position.z>9)r.position.z-=126;if(r.position.z<-120)r.position.z+=126});cam.position.set(ship.position.x+Math.sin(S.yaw)*8,2+ship.position.y+S.pitch*5,ship.position.z+8*Math.cos(S.yaw));cam.lookAt(ship.position.x,ship.position.y,ship.position.z-6);hud();R.render(scene,cam)}anim();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});renderMenu();renderAxes();hud();
</script>
