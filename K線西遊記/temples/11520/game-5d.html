<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#020711;--glass:#071522eb;--line:#67e8ff66;--cyan:#67e8ff;--gold:#ffd36a;--up:#69f7a8;--dn:#ff657f;--muted:#9ab1c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif}button,select,input{font:inherit;color:inherit}button{touch-action:manipulation}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px)}
#map,#arena{position:fixed;inset:0}#arena{display:none;background:linear-gradient(150deg,#07111f 0 30%,#183a4d 31% 48%,#274d36 49% 68%,#0a1321 69%);overflow:hidden}#arena:before{content:"";position:absolute;left:-25%;right:-25%;bottom:-20%;height:56%;background:repeating-linear-gradient(90deg,#67e8ff1d 0 1px,transparent 1px 58px),repeating-linear-gradient(0deg,#67e8ff1d 0 1px,transparent 1px 58px);transform:perspective(700px) rotateX(63deg);transform-origin:bottom}
.top{position:fixed;z-index:700;top:max(6px,env(safe-area-inset-top));left:8px;right:8px;height:54px;border-radius:18px;padding:6px;display:grid;grid-template-columns:40px 1fr 40px 40px;gap:7px;align-items:center}.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#0b1927}.brand b{font-size:11px}.brand small{display:block;font-size:7px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.axes{position:fixed;z-index:650;left:8px;right:8px;top:68px;height:118px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.axis{padding:6px;border-radius:14px;min-width:0;overflow:hidden}.axis small{font-size:7px;color:var(--muted);display:block}.axis select{width:100%;margin:4px 0;padding:5px;border-radius:9px;border:1px solid var(--line);background:#07131f;font-size:8px}.axis b{display:block;color:var(--gold);font-size:10px}.mini{height:4px;background:#24303c;border-radius:9px;overflow:hidden;margin-top:3px}.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--dn),var(--gold),var(--up))}
.tele{position:fixed;z-index:640;left:8px;top:194px;width:min(48vw,245px);padding:8px;border-radius:15px;font-size:8px;color:var(--muted)}.tele b{display:block;color:#fff;font-size:9px}.life{position:fixed;z-index:640;right:66px;top:194px;width:min(35vw,180px);padding:8px;border-radius:15px;font-size:8px}.bar{height:5px;background:#26313d;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--up)}
.center{position:fixed;z-index:610;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;text-shadow:0 3px 14px #000;max-width:54vw}.price{font-size:clamp(30px,8vw,54px);font-weight:900}.center small{font-size:8px}.player{position:fixed;z-index:620;left:50%;top:61%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}.avatar{font-size:54px;filter:drop-shadow(0 8px 10px #000);transform-origin:center;transition:transform .08s}.name{font-size:8px;background:#07121ddd;border-radius:8px;padding:3px 7px}
.rail{position:fixed;z-index:900;right:8px;top:46%;transform:translateY(-20%);width:50px;padding:4px;border-radius:18px;display:grid;gap:5px}.rail button{height:43px;border:0;border-radius:12px;background:#ffffff09;font-size:15px}.rail small{display:block;font-size:6px}.rail button.on{outline:1px solid var(--cyan);background:#67e8ff16;color:var(--cyan)}
.joy{position:fixed;z-index:800;left:24px;bottom:24px;width:132px;height:132px;border-radius:50%;border:2px solid #67e8ff66;background:#071522d9;touch-action:none}.knob{position:absolute;width:54px;height:54px;left:37px;top:37px;border-radius:50%;border:2px solid var(--cyan);background:#17415e}
.flightRail{position:fixed;z-index:830;right:70px;bottom:176px;width:56px;padding:5px;border-radius:18px;display:grid;gap:6px}.flightRail button{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:#0b1927;font-weight:900}.flightRail .warp{font-size:9px;color:var(--gold)}
.actions{position:fixed;z-index:810;right:64px;bottom:16px;width:178px;height:145px}.a{position:absolute;border-radius:50%;border:1px solid var(--line);background:#0b1927e8;font-weight:900}.fight{width:62px;height:62px;left:0;top:0;color:#ffbd73}.flat{width:42px;height:42px;left:67px;top:42px;color:var(--gold)}.short{width:60px;height:60px;right:68px;bottom:0;color:var(--dn)}.long{width:68px;height:68px;right:0;bottom:0;color:var(--up)}
.sheet{position:fixed;z-index:1200;left:8px;right:64px;bottom:10px;max-height:62vh;overflow:auto;background:#040b15fa;border:1px solid var(--line);border-radius:20px;padding:13px;transform:translateY(120%);visibility:hidden;transition:.18s}.sheet.open{transform:none;visibility:visible}.head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-13px;background:#040b15fa;padding:3px 0 8px}.x,.btn{border:1px solid var(--line);background:#102235;border-radius:12px;padding:10px}.x{width:42px;height:42px;border-radius:50%}.btn{width:100%;margin-top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tiny{font-size:9px;color:var(--muted);line-height:1.55}
.aiDock{position:fixed;z-index:1300;right:66px;bottom:332px;width:min(265px,58vw);display:none;border-radius:18px;padding:10px}.aiDock.on{display:block}.aiFace{font-size:34px;float:left;margin-right:8px}.aiText{font-size:9px;line-height:1.45;color:#dceefa}.aiCtl{display:flex;gap:6px;margin-top:8px;clear:both}.aiCtl button{flex:1;border:1px solid var(--line);background:#102235;border-radius:9px;padding:7px;font-size:8px}
.guide{position:fixed;z-index:1500;inset:0;background:#020711f4;display:grid;place-items:center;padding:18px}.guide.hide{display:none}.guideCard{width:min(480px,100%);text-align:center}.guideFace{font-size:68px}.bubble{padding:14px;margin:12px 0;border-radius:18px;text-align:left;line-height:1.55}.choices{display:grid;gap:8px}.choices button{padding:12px;border-radius:14px;border:1px solid var(--line);background:#0b1c2b}.guideInput{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#081522;margin-bottom:8px}.modeBadge{position:fixed;z-index:630;left:50%;top:188px;transform:translateX(-50%);padding:4px 8px;border-radius:11px;font-size:7px;color:var(--cyan)}
@media(max-width:420px){.axes{height:110px}.tele{top:186px;width:49vw}.life{top:186px;right:62px;width:37vw}.center{top:47%;max-width:58vw}.player{top:60%}.joy{left:14px;bottom:18px;width:120px;height:120px}.knob{left:32px;top:32px}.flightRail{right:60px;bottom:164px}.actions{right:55px;transform:scale(.9);transform-origin:right bottom}.rail{right:6px}.aiDock{right:60px;bottom:320px}.modeBadge{top:181px}}
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="map"></div><div id="arena"></div>
<header class="top glass"><button class="round" id="home">⌂</button><div class="brand"><b>11520 花果山宇宙萬物交易所</b><small>5D 戰鬥｜Google 導航/選址｜1 指數點 = 1 KGEN</small></div><button class="round" id="mode">5D</button><button class="round" id="profile">👤</button></header>
<section class="axes" id="axes"></section><div class="modeBadge glass" id="modeBadge">5D 戰鬥環境</div>
<div class="tele glass"><span>5D 世界座標</span><b id="xyz">X 0.0 · Y 0.0 · Z 0.0</b><div id="gps">GPS：導航/出生地用途</div><div id="walk">5D 移動 0 m</div><b id="cash">KGEN 10 · KAIOS 1000 · KUFO 1</b><span id="feed">行情同步中</span></div>
<div class="life glass"><b>生命 HP <span id="hp">100</span></b><div class="bar"><i id="hpbar" style="width:100%"></i></div><span id="monster">5D 怪物待命</span></div>
<div class="center"><div id="pair">KX · BTC/USDT</div><div class="price" id="price">--</div><small>交易 PnL 用 KGEN</small></div>
<div class="player"><div class="avatar" id="avatar">🥷</div><span class="name" id="avatarName">樂天帝</span></div>
<div class="joy" id="joy"><div class="knob" id="knob"></div></div>
<div class="flightRail glass"><button id="zplus">Z+</button><button class="warp" id="warp">1C</button><button id="zminus">Z−</button></div>
<div class="actions"><button class="a fight" id="fight">⚔️<br>打怪</button><button class="a flat" id="flat">平</button><button class="a short" id="short">空</button><button class="a long" id="long">多</button></div>
<nav class="rail glass"><button id="mapBtn">🗺️<small>平面圖</small></button><button id="googleBtn">🧭<small>Google</small></button><button id="buildBtn">🏗️<small>地址</small></button><button id="atmBtn">🛸<small>ATM</small></button><button id="lifeBtn">🍜<small>生活</small></button><button id="helpBtn">✨<small>AI</small></button><button id="dressBtn">👗<small>角色</small></button></nav>
<section class="aiDock glass" id="aiDock"><div class="aiFace">🧚‍♀️</div><div class="aiText" id="aiText">我是花果山 AI 引路人。你打開任何區塊，我都可以在這裡解說。</div><div class="aiCtl"><button id="aiSpeak">🔊 再說一次</button><button id="aiClose">關閉客服</button></div></section>
<section class="sheet" id="sheet"><div class="head"><b id="title">功能</b><button class="x" id="close">×</button></div><div id="body"></div><button class="btn" id="askSection">✨ AI 解說這個區塊</button></section>
<section class="guide" id="guide"><div class="guideCard"><div class="guideFace">🧚‍♀️</div><div class="bubble glass" id="bubble">歡迎回到花果山。Google 地圖用來導航、選地址、出生地與起家處；真正移動、打怪與交易在 5D 世界。</div><div class="choices" id="choices"><button data-go="enter">🔊 進入 5D 世界並開啟語音</button><button data-go="silent">靜音進入</button></div></div></section>
<script>
const $=s=>document.querySelector(s),M=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT','LTCUSDT'];
const D={axis:'KX',slots:{KX:'BTCUSDT',KY:'ETHUSDT',KZ:'TRXUSDT'},q:{},kgen:10,kaios:3996,kufo:.97,pos:{KX:null,KY:null,KZ:null},xyz:{x:0,y:0,z:0},hp:100,mode:'5d',name:'樂天帝',avatar:'🥷',heading:0,gps:null,home:null,travel:0,voice:true,warp:1,ai:false};
let map,marker,joy=false,jv={x:0,y:0},currentHelp='';
function save(){localStorage.setItem('k11520-v6',JSON.stringify(D))}function load(){try{Object.assign(D,JSON.parse(localStorage.getItem('k11520-v6')||'{}'))}catch{}}function fmt(v){return '$'+(+v).toLocaleString(undefined,{maximumFractionDigits:v>10?2:6})}function pnl(p){const q=D.q[p.symbol]||p.entry;return(q-p.entry)*(p.side==='多'?1:-1)*p.size}
function axes(){const el=$('#axes');el.innerHTML=['KX','KY','KZ'].map(a=>`<div class="axis glass"><small>${a} 球膜軸</small><select data-a="${a}">${M.map(m=>`<option ${D.slots[a]===m?'selected':''}>${m.replace('USDT','/USDT')}</option>`).join('')}</select><b id="q${a}">--</b><small id="p${a}">空倉</small><div class="mini"><i id="h${a}" style="width:100%"></i></div></div>`).join('');document.querySelectorAll('[data-a]').forEach(s=>s.onchange=()=>{D.slots[s.dataset.a]=s.value.replace('/','');D.axis=s.dataset.a;hud()})}
function hud(){['KX','KY','KZ'].forEach(a=>{const q=D.q[D.slots[a]],p=D.pos[a];$('#q'+a).textContent=q?fmt(q):'--';$('#p'+a).textContent=p?`${p.side} ${p.margin.toFixed(2)} KGEN｜PnL ${pnl(p).toFixed(2)}`:'空倉';$('#h'+a).style.width=(p?Math.max(0,Math.min(100,100+pnl(p)/Math.max(.01,p.margin)*20)):100)+'%'});const q=D.q[D.slots[D.axis]];$('#pair').textContent=`${D.axis} · ${D.slots[D.axis].replace('USDT','/USDT')}`;$('#price').textContent=q?fmt(q):'--';$('#xyz').textContent=`X ${D.xyz.x.toFixed(1)} · Y ${D.xyz.y.toFixed(1)} · Z ${D.xyz.z.toFixed(1)}`;$('#cash').textContent=`KGEN ${D.kgen.toFixed(3)} · KAIOS ${D.kaios.toFixed(1)} · KUFO ${D.kufo.toFixed(2)}`;$('#hp').textContent=D.hp;$('#hpbar').style.width=D.hp+'%';$('#avatar').textContent=D.avatar;$('#avatar').style.transform=`rotate(${D.heading}deg)`;$('#avatarName').textContent=D.name;$('#warp').textContent=D.warp<1?'0.0000001C':D.warp+'C';save()}
async function quotes(){try{const r=await fetch('https://api.binance.com/api/v3/ticker/price'),j=await r.json();j.forEach(x=>{if(M.includes(x.symbol))D.q[x.symbol]=+x.price});$('#feed').textContent='行情 LIVE'}catch{$('#feed').textContent='行情暫停'}hud()}
function initMap(){map=L.map('map',{zoomControl:false}).setView([23.7,121],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}
function locate(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{D.gps=[p.coords.latitude,p.coords.longitude];$('#gps').textContent=`GPS ${D.gps[0].toFixed(5)}, ${D.gps[1].toFixed(5)}｜導航/地址`;if(!marker)marker=L.marker(D.gps).addTo(map);else marker.setLatLng(D.gps);map.setView(D.gps,17);save()},()=>{$('#gps').textContent='GPS 未授權｜仍可使用 5D 世界'})}
function mode(m){D.mode=m;const is5=m==='5d';$('#arena').style.display=is5?'block':'none';$('#map').style.display=is5?'none':'block';$('#modeBadge').textContent=is5?'5D 戰鬥環境｜X/Y/Z＋曲速':'平面地圖｜導航、選址、出生地';$('#mode').textContent=is5?'5D':'MAP';['#fight','#zplus','#zminus','#warp'].forEach(s=>$(s).disabled=!is5);if(!is5){setTimeout(()=>map.invalidateSize(),50);locate()}save()}
function speak(t){currentHelp=t;if(!D.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.92;speechSynthesis.speak(u)}
function aiShow(t,doSpeak=true){D.ai=true;$('#aiDock').classList.add('on');$('#helpBtn').classList.add('on');$('#aiText').textContent=t;currentHelp=t;if(doSpeak)speak(t);save()}
function aiHide(){D.ai=false;$('#aiDock').classList.remove('on');$('#helpBtn').classList.remove('on');if('speechSynthesis'in window)speechSynthesis.cancel();save()}
function openSheet(t,h,help){$('#title').textContent=t;$('#body').innerHTML=h;$('#sheet').classList.add('open');currentHelp=help||`${t} 功能已打開。需要我解說時按下方 AI 解說。`;if(D.ai)aiShow(currentHelp,true)}
function trade(side){const a=D.axis,q=D.q[D.slots[a]];if(!q)return alert('行情尚未載入');if(D.pos[a])return alert(`${a} 已有倉位，先平倉`);const margin=Math.min(1,D.kgen);if(margin<=0)return alert('KGEN 不足');D.kgen-=margin;D.pos[a]={side,entry:q,symbol:D.slots[a],margin,size:1};hud()}
function flat(){const p=D.pos[D.axis];if(!p)return alert(`${D.axis} 沒有倉位`);D.kgen+=Math.max(0,p.margin+pnl(p));alert(`${D.axis} 平倉：${pnl(p).toFixed(3)} KGEN`);D.pos[D.axis]=null;hud()}
function speedFactor(){return D.warp<1?.15:D.warp}function moveStep(){if(!joy||D.mode!=='5d')return;const f=.055*speedFactor();D.xyz.x+=jv.x*f;D.xyz.y-=jv.y*f;D.heading=Math.atan2(jv.x,-jv.y)*180/Math.PI;D.travel+=Math.hypot(jv.x,jv.y)*f;$('#walk').textContent=`5D 移動 ${D.travel.toFixed(1)} m｜${D.warp<1?'走路':D.warp+'C'}`;hud()}
function z(d){if(D.mode!=='5d')return;D.xyz.z+=d*speedFactor();hud()}function cycleWarp(){const a=[.0000001,1,10,100],i=a.indexOf(D.warp);D.warp=a[(i+1)%a.length];hud();aiShow(`曲速已切換為 ${D.warp<1?'走路 0.0000001C':D.warp+'C'}。Z 加減與平面移動會依目前速度前進。`,false)}
function battle(){if(D.mode!=='5d')return alert('請先切回 5D');const dmg=5+Math.floor(Math.random()*12);D.hp=Math.max(0,D.hp-Math.floor(Math.random()*4));D.kaios+=dmg;$('#monster').textContent=`擊中 5D 怪物｜+${dmg} KAIOS`;hud()}
function google(){const p=D.home||D.gps;if(p)window.open(`https://www.google.com/maps/dir/?api=1&destination=${p[0]},${p[1]}`,'_blank');else window.open('https://maps.google.com/','_blank')}
$('#joy').onpointerdown=e=>{joy=true;$('#joy').setPointerCapture(e.pointerId)};$('#joy').onpointermove=e=>{if(!joy)return;const r=$('#joy').getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.min(42,Math.hypot(x,y)),a=Math.atan2(y,x);jv={x:Math.cos(a)*(m/42),y:Math.sin(a)*(m/42)};$('#knob').style.transform=`translate(${jv.x*38}px,${jv.y*38}px)`};function joyEnd(){joy=false;jv={x:0,y:0};$('#knob').style.transform='none'}$('#joy').onpointerup=joyEnd;$('#joy').onpointercancel=joyEnd;
$('#zplus').onclick=()=>z(1);$('#zminus').onclick=()=>z(-1);$('#warp').onclick=cycleWarp;$('#fight').onclick=battle;$('#long').onclick=()=>trade('多');$('#short').onclick=()=>trade('空');$('#flat').onclick=flat;$('#mode').onclick=()=>mode(D.mode==='5d'?'map':'5d');$('#home').onclick=()=>mode('5d');
$('#mapBtn').onclick=()=>{mode('map');openSheet('平面地圖','<div class="tiny">真實地圖只負責 GPS、地址、出生地與導航。打怪和曲速移動請回 5D。</div>','現在是平面地圖。它是現實世界的地理層，用來定位、選址和導航，不拿來承載 5D 戰鬥。')};
$('#googleBtn').onclick=()=>{aiShow('Google 導航會把你帶到真實世界地址；遊戲中的打怪與 XYZ 移動仍留在 5D 世界。',true);google()};
$('#buildBtn').onclick=()=>{mode('map');openSheet('地址／起家處','<div class="tiny">以 GPS 選出生地、起家處、房子、商場或工廠地址。完成後回 5D 世界活動。</div><button class="btn" id="birthHere">目前 GPS 設為起家處</button>','這個區塊是地址與建設入口。你可以先用 GPS 選真實位置，再把那個位置當作遊戲世界的地理錨點。')};
$('#atmBtn').onclick=()=>openSheet('宇宙 ATM','<div class="tiny">KGEN＝交易與跨宇宙結算；KAIOS＝生活費；KUFO＝長效能源。固定 ATM 與行動飛碟 ATM 都保留。</div>','ATM 負責不同貨幣與能源的交換入口。真正資產操作仍需正式鏈上授權。');
$('#lifeBtn').onclick=()=>openSheet('生活','<div class="tiny">KAIOS 支付食物與寵物日常；KUFO 是長效仙丹能源。</div><button class="btn" id="eat">吃飯 −8 KAIOS</button><button class="btn" id="pill">服 KUFO −0.01</button>','生活區管理吃飯、寵物與長效能源。KAIOS 是日常生活鈔票，KUFO 是更長效的能源。');
$('#dressBtn').onclick=()=>openSheet('角色','<div class="row"><button class="btn" data-av="🥷">🥷</button><button class="btn" data-av="🧙‍♀️">🧙‍♀️</button><button class="btn" data-av="🐒">🐒</button><button class="btn" data-av="🤖">🤖</button></div>','角色區可以選人物外觀。之後可以再接真正的 3D 男女角色、服裝、裝備與動畫。');
$('#profile').onclick=()=>openSheet('玩家',`<div class="tiny">${D.name}<br>X ${D.xyz.x.toFixed(1)} / Y ${D.xyz.y.toFixed(1)} / Z ${D.xyz.z.toFixed(1)}<br>${D.home?'已有出生地/起家處':'尚未設定出生地'}</div>`,'這是你的玩家資料與 5D 座標。出生地是地球地址錨點，XYZ 是遊戲中的空間位置。');
$('#helpBtn').onclick=()=>D.ai?aiHide():aiShow('我是花果山 AI 引路人。現在我會跟著你打開的區塊解說；再按一次 AI，就會停止語音並關閉我的影像客服。',true);$('#aiClose').onclick=aiHide;$('#aiSpeak').onclick=()=>speak(currentHelp||'我是花果山 AI 引路人。');$('#askSection').onclick=()=>aiShow(currentHelp||'這個區塊目前沒有更多說明。',true);$('#close').onclick=()=>$('#sheet').classList.remove('open');
document.addEventListener('click',e=>{if(e.target.dataset.av){D.avatar=e.target.dataset.av;hud()}if(e.target.id==='eat'&&D.kaios>=8){D.kaios-=8;D.hp=Math.min(100,D.hp+12);hud()}if(e.target.id==='pill'&&D.kufo>=.01){D.kufo-=.01;D.hp=100;hud()}if(e.target.id==='birthHere'){if(!D.gps)return alert('先取得 GPS');D.home=[...D.gps];save();alert('起家處已設定')}});
$('#choices').onclick=e=>{const g=e.target.dataset.go;if(g==='enter'){D.voice=true;$('#guide').classList.add('hide');mode('5d');aiShow('歡迎進入 11520。左下搖桿控制 X/Y，右下飛行縱桿控制 Z 與曲速 C；右側 AI 可隨時叫我出來。',true)}if(g==='silent'){D.voice=false;$('#guide').classList.add('hide');mode('5d')}};
load();initMap();axes();mode('5d');hud();quotes();setInterval(quotes,5000);setInterval(moveStep,60);
</script>
</body></html>
