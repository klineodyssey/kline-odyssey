<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Noto Sans TC",sans-serif}button{font:inherit}

.leftInfo{position:fixed;z-index:5;top:78px;left:9px;display:grid;gap:6px;pointer-events:none}.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 10px;backdrop-filter:blur(14px)}.xyz{font-size:10px;color:var(--muted)}.xyz b{display:block;font-size:13px;color:var(--txt);margin-top:2px}.marketPrice small{display:block;color:var(--muted);font-size:9px}.marketPrice b{font-size:24px;letter-spacing:-.04em}.pulse{font-size:10px;color:var(--green)}
.lifeCard{position:fixed;z-index:5;top:78px;right:9px;width:124px;pointer-events:none}.bloodbar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}.bloodbar i{display:block;height:100%;width:82%;background:linear-gradient(90deg,#ff355f,#ff7a7a);box-shadow:0 0 14px rgba(255,70,100,.65)}.lifeCard small{font-size:9px;color:var(--muted)}.lifeCard b{display:block;font-size:12px;margin-top:2px}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);max-width:min(92vw,500px);padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(4,9,19,.92);backdrop-filter:blur(16px);font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bottomNav{position:fixed;z-index:20;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));height:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;border:1px solid var(--line);border-radius:22px;background:rgba(4,9,18,.88);backdrop-filter:blur(18px);box-shadow:0 -8px 30px rgba(0,0,0,.35)}.navbtn{border:0;background:transparent;color:var(--muted);border-radius:15px;display:grid;place-items:center;align-content:center;gap:2px;cursor:pointer;font-size:10px}.navbtn span{font-size:23px}.navbtn.active{color:var(--txt);background:linear-gradient(180deg,rgba(94,231,255,.15),rgba(185,146,255,.07));box-shadow:inset 0 0 0 1px rgba(94,231,255,.2)}
.sheet{position:fixed;z-index:19;left:8px;right:8px;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));max-height:min(68vh,620px);overflow:auto;border:1px solid var(--line);border-radius:24px;background:rgba(4,9,19,.94);backdrop-filter:blur(20px);padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.5);transform:translateY(120%);opacity:0;transition:.28s cubic-bezier(.2,.8,.2,1)}.sheet.open{transform:translateY(0);opacity:1}.sheetHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.sheetHead b{font-size:16px}.close{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{border:1px solid var(--line);border-radius:15px;padding:10px;background:rgba(255,255,255,.025)}.metric small{display:block;color:var(--muted);font-size:9px}.metric b{display:block;margin-top:3px;font-size:15px}.row{display:flex;gap:8px;align-items:center}.field{margin-top:9px}.field label{display:block;color:var(--muted);font-size:10px;margin:0 0 4px}input,select{width:100%;border:1px solid var(--line);border-radius:13px;background:#07101d;color:var(--txt);padding:11px 10px;outline:none}.btn{border:1px solid var(--line);border-radius:14px;background:#0a1628;color:var(--txt);padding:11px 12px;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(135deg,rgba(94,231,255,.25),rgba(185,146,255,.18));border-color:rgba(94,231,255,.5)}.btn.long{background:rgba(93,255,173,.12);border-color:rgba(93,255,173,.5);color:var(--green)}.btn.short{background:rgba(255,95,121,.12);border-color:rgba(255,95,121,.5);color:#ff8da0}.btn.gold{background:rgba(255,215,107,.12);border-color:rgba(255,215,107,.45);color:var(--gold)}.full{width:100%;margin-top:8px}.speeds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.speed{padding:9px 3px;border:1px solid var(--line);border-radius:12px;background:#091321;color:var(--muted);font-weight:800}.speed.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 18px rgba(94,231,255,.16)}.tiny{font-size:10px;line-height:1.5;color:var(--muted)}.warn{color:var(--gold)}.good{color:var(--green)}.bad{color:#ff8da0}
.tradeHero{text-align:center;padding:8px 0}.pair{font-size:11px;color:var(--muted)}.price{font-size:38px;font-weight:900;letter-spacing:-.05em}.warpBig{font-size:32px;font-weight:900;color:var(--cyan)}.sideBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.position{border:1px solid rgba(94,231,255,.28);border-radius:16px;padding:11px;margin-top:10px;background:rgba(94,231,255,.04)}
.atmOffer{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:8px;background:linear-gradient(90deg,rgba(255,80,100,.07),rgba(94,231,255,.04))}.ufo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#5f2b39,#151928 70%);font-size:22px}.atmOffer b{display:block;font-size:12px}.atmOffer small{color:var(--muted);font-size:9px}.walletLine{word-break:break-all;color:var(--cyan);font-size:10px}
@media(min-width:900px){.hud{left:18px;right:18px}.leftInfo{left:18px}.lifeCard{right:18px;width:160px}.bottomNav{left:50%;right:auto;transform:translateX(-50%);width:min(720px,80vw)}.sheet{left:50%;right:auto;transform:translate(-50%,120%);width:min(620px,90vw)}.sheet.open{transform:translate(-50%,0)}}

<header class="hud"><div class="logo">悟</div><div class="headtitle"><b>11520 花果山宇宙萬物交易所</b><small id="sceneLabel">血管生活區 · Player-First 5D Universe</small></div><div class="hudstats"><div class="chip"><span>BTC</span><b id="btcTop">--</b></div><div class="chip"><span>🩸 KAIOS</span><b id="kaiosTop">1,000</b></div></div></header>
<div class="leftInfo"><div class="glass xyz">生命座標 XYZ<b id="xyzText">X 11520 · Y 12345 · Z 4168</b></div><div class="glass marketPrice"><small>BTC / USDT FREE INDEX</small><b id="btcPrice">--</b><div class="pulse" id="quoteState">● 行情連線中</div></div></div>
<div class="glass lifeCard"><small>你的生命血量 / KAIOS</small><b id="lifeName">PLAYER LIFE</b><div class="bloodbar"><i id="bloodFill"></i></div><small id="bloodText">可用 1,000 KAIOS</small></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={panel:'world',btc:0,lastBtc:0,warp:1,side:'LONG',wallet:null,chainId:null,walletKaios:null,sandboxKaios:1000,margin:0,position:null,xyz:{x:11520,y:12345,z:4168},atmRate:777,sceneMode:'WORLD'};
const KAIOS='0xD4E67B3a69e41524c424150E6b6e921b01D036db';
const KGEN='0xBA3d3810e58735cb6813bC1CDc5458C0d71432Be';
const ERC20=['function balanceOf(address) view returns(uint256)','function decimals() view returns(uint8)'];
function money(v,d=2){return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:d})}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2300)}
function usableKaios(){return state.walletKaios==null?state.sandboxKaios:state.walletKaios}
function updateHud(){const k=usableKaios();$('#kaiosTop').textContent=money(k,2);$('#bloodText').textContent=`可用 ${money(k,2)} KAIOS · 保證金 ${money(state.margin,2)}`;$('#bloodFill').style.width=Math.max(4,Math.min(100,(k/(k+state.margin||1))*100))+'%';$('#xyzText').textContent=`X ${state.xyz.x} · Y ${state.xyz.y} · Z ${state.xyz.z}`}
async function quote(){try{const r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();state.lastBtc=state.btc||Number(j.price);state.btc=Number(j.price);$('#btcPrice').textContent='$'+money(state.btc,2);$('#btcTop').textContent=money(state.btc,0);$('#quoteState').textContent='● 免費即時參考行情';$('#quoteState').className='pulse';if(state.position)renderTrade();}catch{$('#quoteState').textContent='● 行情暫時離線';$('#quoteState').className='pulse warn'}}
async function connect(){if(!window.ethereum){toast('未偵測到瀏覽器錢包，請用支援 Web3 的錢包瀏覽器開啟');return}try{const [a]=await ethereum.request({method:'eth_requestAccounts'});state.wallet=a;state.chainId=parseInt(await ethereum.request({method:'eth_chainId'}),16);$('#lifeName').textContent=a.slice(0,6)+'…'+a.slice(-4);await readWallet();toast('錢包已連接');renderMe();}catch(e){toast('錢包連線取消或失敗')}}
async function readWallet(){if(!state.wallet||state.chainId!==56){state.walletKaios=null;updateHud();return}try{const p=new ethers.providers.Web3Provider(window.ethereum);const c=new ethers.Contract(KAIOS,ERC20,p);const [b,d]=await Promise.all([c.balanceOf(state.wallet),c.decimals()]);state.walletKaios=Number(ethers.utils.formatUnits(b,d));updateHud();}catch{state.walletKaios=null;updateHud()}}
function sandboxOnly(){toast('目前為安全沙盒：真資產 Clearing/ATM 尚未登記，不會送出鏈上交易')}
function deposit(){const n=Number($('#depAmt')?.value||100);if(!Number.isFinite(n)||n<=0)return toast('請輸入 KAIOS 數量');if(n>state.sandboxKaios)return toast('沙盒 KAIOS 不足');state.sandboxKaios-=n;state.margin+=n;updateHud();renderAsset();toast(`${money(n)} KAIOS 已進入保證金血管（沙盒）`)}
function withdraw(){if(state.position)return toast('請先平倉');state.sandboxKaios+=state.margin;state.margin=0;updateHud();renderAsset();toast('保證金已回流生命血液（沙盒）')}
function openPosition(){const coll=Number($('#collateral')?.value||100);if(!state.btc)return toast('等待 BTC 指數');if(coll<=0||coll>state.margin)return toast('保證金不足');state.position={entry:state.btc,collateral:coll,warp:state.warp,side:state.side,opened:Date.now()};state.sceneMode='WARP';setMode('WARP');renderTrade();toast(`${state.side==='LONG'?'多':'空'} ${state.warp}C 已進入曲速航道`)}
function pnl(){if(!state.position)return 0;const p=state.position;const raw=(state.btc-p.entry)*(p.side==='LONG'?1:-1)*p.warp;return Math.max(-p.collateral,Math.min(p.collateral,raw))}
function closePosition(){if(!state.position)return toast('目前沒有持倉');const p=pnl();state.margin=Math.max(0,state.margin+p);state.position=null;state.sceneMode='WORLD';setMode('WORLD');updateHud();renderTrade();toast(`平倉完成 ${p>=0?'+':''}${money(p,4)} KAIOS（沙盒）`)}
function acceptAtm(){const kgen=Number($('#atmKgen')?.value||1),rate=Number($('#atmRate')?.value||777);if(kgen<=0||rate<=0)return toast('請輸入有效報價');const got=kgen*rate;state.sandboxKaios+=got;state.atmRate=rate;updateHud();renderAtm();toast(`行動 ATM 成交：${kgen} KGEN ↔ ${money(got)} KAIOS（沙盒）`)}
const speeds=[0.0000001,0.001,0.01,0.1,1,10,100,1000];
function sheet(title,html){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;$('#sheet').classList.add('open')}
function renderWorld(){sheet('🌌 我的生命世界',`<div class="grid2"><div class="metric"><small>生命座標</small><b>X ${state.xyz.x}</b><span class="tiny">Y ${state.xyz.y} · Z ${state.xyz.z}</span></div><div class="metric"><small>目前環境</small><b>11520 血管生活區</b><span class="tiny">玩家在自己的 XYZ 血管附近生活、工作與交易</span></div></div><div class="position"><b>🩸 血液不是公共池</b><p class="tiny">每個生命的 KAIOS / 資產都綁定自己的 Wallet、Life、XYZ 與狀態。只有行動 ATM 飛碟等「可移動紅血球」會跨區移動、報價與交換。</p></div><button class="btn primary full" id="lookAtm">追蹤附近 ATM 飛碟</button>`);$('#lookAtm').onclick=()=>{setMode('ATM');toast('鏡頭追蹤行動 ATM 紅血球')}}
function renderAsset(){sheet('🩸 我的血液資產',`<div class="grid2"><div class="metric"><small>KAIOS 生命血液</small><b>${money(state.sandboxKaios,4)}</b><span class="tiny">沙盒可用</span></div><div class="metric"><small>11520 保證金血</small><b>${money(state.margin,4)}</b><span class="tiny">持倉中的血會暫時鎖定</span></div></div><div class="field"><label>存入 KAIOS 保證金</label><input id="depAmt" type="number" value="100" min="0" step="any"></div><div class="row"><button class="btn primary full" id="depBtn">流入 11520 保證金血管</button><button class="btn full" id="wdBtn">全部回流</button></div><p class="tiny warn">現在是安全沙盒。真資產版本會在 Clearing/ATM 正式部署地址登記後，沿用同一介面解鎖。</p>`);$('#depBtn').onclick=deposit;$('#wdBtn').onclick=withdraw}
function renderTrade(){const p=state.position,pv=pnl();sheet('🚀 5D 多空曲速',`<div class="tradeHero"><div class="pair">BTC / USDT · FREE REFERENCE INDEX</div><div class="price">${state.btc?'$'+money(state.btc,2):'--'}</div><div class="warpBig">${state.warp}C</div><div class="tiny">1 指數點 = 1 KAIOS × C</div></div><div class="speeds">${speeds.map(v=>`<button class="speed ${state.warp===v?'on':''}" data-speed="${v}">${v}C</button>`).join('')}</div><div class="field"><label>本單保證金 KAIOS</label><input id="collateral" type="number" value="${p?.collateral||Math.min(100,state.margin||100)}" min="0.0001" step="any"></div><div class="sideBtns"><button class="btn long" id="longBtn">▲ 多｜向上飛</button><button class="btn short" id="shortBtn">▼ 空｜向下飛</button></div>${p?`<div class="position"><div class="grid2"><div class="metric"><small>進場</small><b>${money(p.entry,2)}</b></div><div class="metric"><small>即時 PnL</small><b class="${pv>=0?'good':'bad'}">${pv>=0?'+':''}${money(pv,4)} KAIOS</b></div></div><button class="btn gold full" id="closePos">脫離曲速｜平倉結算</button></div>`:`<button class="btn primary full" id="orderBtn">點火下單｜${state.side==='LONG'?'多':'空'} ${state.warp}C</button>`}`);$$('.speed').forEach(b=>b.onclick=()=>{state.warp=Number(b.dataset.speed);renderTrade();setMode('WARP_PREVIEW')});$('#longBtn').onclick=()=>{state.side='LONG';toast('已選多方航道')};$('#shortBtn').onclick=()=>{state.side='SHORT';toast('已選空方航道')};if($('#orderBtn'))$('#orderBtn').onclick=openPosition;if($('#closePos'))$('#closePos').onclick=closePosition}
function renderAtm(){sheet('🛸 行動 ATM 飛碟',`<div class="atmOffer"><div class="ufo">🛸</div><div><b>紅血球 ATM · LIFE-MARKET-MAKER</b><small>移動中 · 距離 0.42 AU · 自由報價</small></div><div class="good">ONLINE</div></div><div class="grid2"><div class="field"><label>你支付 KGEN</label><input id="atmKgen" type="number" value="1" step="any"></div><div class="field"><label>對方報價 KAIOS / KGEN</label><input id="atmRate" type="number" value="${state.atmRate}" step="any"></div></div><button class="btn primary full" id="atmAccept">雙方同意｜原子換匯</button><p class="tiny">ATM 飛碟不是固定匯率機。每個生命/做市者自己報價，另一方同意才成交。未來可在 XYZ 間移動並形成不同區域市場。</p>`);$('#atmAccept').onclick=acceptAtm}
function renderMe(){sheet('👤 我的生命',`<div class="metric"><small>Wallet</small><b>${state.wallet?'已連接':'尚未連接'}</b><div class="walletLine">${state.wallet||'—'}</div></div><div class="grid2" style="margin-top:8px"><div class="metric"><small>Chain</small><b>${state.chainId||'—'}</b></div><div class="metric"><small>鏈上 KAIOS</small><b>${state.walletKaios==null?'—':money(state.walletKaios,4)}</b></div></div><button class="btn primary full" id="connectBtn">${state.wallet?'刷新錢包':'連接錢包'}</button><button class="btn full" id="realBtn">真資產狀態</button><p class="tiny warn">真資產 Trading/Clearing 目前仍 fail-closed；這頁不會把資產傳到猜測地址。</p>`);$('#connectBtn').onclick=connect;$('#realBtn').onclick=sandboxOnly}
function openPanel(p){state.panel=p;$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.panel===p));if(p==='world')renderWorld();if(p==='asset')renderAsset();if(p==='trade')renderTrade();if(p==='atm')renderAtm();if(p==='me')renderMe()}
$$('.navbtn').forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));$('#closeSheet').onclick=()=>$('#sheet').classList.remove('open');
// --- Three.js world: blood vessel + player + mobile ATM + market portal ---
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02040b,.018);const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1000);camera.position.set(0,2.4,9);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;$('#world').appendChild(renderer.domElement);

const stars=[];const sg=new THREE.BufferGeometry(),sa=[];for(let i=0;i<1800;i++)sa.push((Math.random()-.5)*100,(Math.random()-.5)*80,-Math.random()*220);sg.setAttribute('position',new THREE.Float32BufferAttribute(sa,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({size:.15,color:0xbfeaff,transparent:true,opacity:.72})));
