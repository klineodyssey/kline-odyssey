<!doctype html>
<html lang="zh-Hant">
<head>

<title>11520｜花果山宇宙萬物交易所</title>
<style>
:root{--bg:#02040b;--glass:rgba(4,10,22,.82);--line:rgba(120,225,255,.28);--text:#f5fbff;--muted:#8daabb;--cyan:#64eaff;--gold:#ffd56a;--up:#58ffad;--dn:#ff637d}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}button,select,input{font:inherit;color:inherit}button{cursor:pointer}#world{position:fixed;inset:0}.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 44%,transparent 0 35%,rgba(0,0,0,.45) 78%,#000 120%)}.top{position:fixed;z-index:20;top:max(7px,env(safe-area-inset-top));left:8px;right:8px;height:58px;padding:7px;display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(16px)}.round{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#07121ddd;display:grid;place-items:center}.brand b{display:block;font-size:13px}.brand small{display:block;color:var(--muted);font-size:9px}.axisDock{position:fixed;z-index:19;left:8px;right:8px;top:calc(max(7px,env(safe-area-inset-top)) + 65px);display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.axis{border:1px solid var(--line);border-radius:15px;background:var(--glass);padding:7px;min-width:0}.axis.on{border-color:#64eaff88;box-shadow:0 0 0 1px #64eaff33 inset}.axisHead{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--muted)}.axisHead b{font-size:11px;color:var(--cyan)}.axis select{width:100%;margin-top:5px;padding:6px 7px;border:1px solid var(--line);border-radius:10px;background:#07121d;font-size:9px}.axis .quote{display:block;margin-top:5px;font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tele{position:fixed;z-index:8;left:8px;top:calc(max(7px,env(safe-area-inset-top)) + 164px);max-width:210px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(4,10,22,.7);backdrop-filter:blur(10px);font-size:8px;color:var(--muted)}.tele b{display:block;color:var(--text);font-size:10px}.center{position:fixed;z-index:5;left:50%;top:45%;transform:translate(-50%,-50%);width:78vw;text-align:center;pointer-events:none;text-shadow:0 4px 20px #000}.center .pair{font-size:12px}.center .price{font-size:clamp(34px,10vw,68px);font-weight:900;letter-spacing:-.05em}.center small{font-size:10px;color:var(--cyan)}.joy{position:fixed;z-index:16;left:8px;bottom:18px;width:142px;height:158px}.joyBase{position:absolute;width:112px;height:112px;left:15px;top:10px;border-radius:50%;border:1px solid #64eaff66;background:radial-gradient(circle,#64eaff24,#04101ddd)}.knob{position:absolute;width:48px;height:48px;left:47px;top:42px;border-radius:50%;border:1px solid #64eaffaa;background:#16405ddd;box-shadow:0 0 24px #64eaff44}.joyLabel{position:absolute;bottom:0;width:100%;text-align:center;font-size:8px;color:var(--muted)}.attack{position:fixed;z-index:16;right:68px;bottom:20px;width:192px;height:176px}.atk{position:absolute;border-radius:50%;border:1px solid var(--line);background:#07121ddd;font-weight:900;display:grid;place-items:center}.atk:active{transform:scale(.92);filter:brightness(1.4)}.long{width:74px;height:74px;right:0;bottom:8px;color:var(--up);border-color:#58ffad88;font-size:23px}.short{width:62px;height:62px;right:80px;bottom:0;color:var(--dn);border-color:#ff637d88;font-size:20px}.flat{width:46px;height:46px;right:98px;bottom:69px;color:var(--gold)}.zf{width:50px;height:50px;right:28px;bottom:117px;color:var(--cyan);font-size:10px}.zb{width:46px;height:46px;right:88px;bottom:115px;color:#a7c8ff;font-size:10px}.rail{position:fixed;z-index:25;right:8px;top:52%;transform:translateY(-20%);width:54px;padding:5px;border:1px solid var(--line);border-radius:19px;background:var(--glass);backdrop-filter:blur(16px);display:grid;gap:5px}.rail button{height:42px;border:0;border-radius:14px;background:#ffffff08;color:var(--muted);font-size:17px}.rail .pick{height:58px;color:var(--cyan);font-size:9px;font-weight:900;border:1px solid #64eaff55;background:#64eaff12}.rail .pick span{display:block;font-size:20px}.rail .home{color:var(--gold)}.sheet{position:fixed;z-index:30;left:8px;right:70px;bottom:12px;max-height:62vh;overflow:auto;padding:13px;border:1px solid var(--line);border-radius:22px;background:#040b16f5;backdrop-filter:blur(18px);transform:translateY(120%);opacity:0;transition:.2s}.sheet.open{transform:translateY(0);opacity:1}.sheetHead{display:flex;justify-content:space-between;align-items:center}.x{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:#0a1422}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:9px;border:1px solid var(--line);border-radius:13px;background:#ffffff08}.metric small{display:block;color:var(--muted);font-size:8px}.metric b{display:block;margin-top:2px;font-size:11px}.btn,input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:#081522;margin-top:7px}.btn{font-weight:800}.primary{border-color:#64eaff88}.gold{border-color:#ffd56a88;color:var(--gold)}.tiny{font-size:9px;color:var(--muted);line-height:1.55}.toast{position:fixed;z-index:50;left:50%;bottom:210px;transform:translateX(-50%);padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#040a14ee;font-size:10px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}@media(max-width:390px){.axis{padding:6px}.axis select{font-size:8px;padding:5px}.attack{right:60px;transform:scale(.9);transform-origin:right bottom}.rail{width:50px}.sheet{right:64px}.tele{max-width:180px}}@media(min-width:850px){.top,.axisDock{left:50%;right:auto;transform:translateX(-50%);width:760px}.tele{left:5vw}.joy{left:5vw}.attack{right:9vw}.sheet{left:50%;right:auto;width:560px;transform:translate(-50%,120%)}.sheet.open{transform:translate(-50%,0)}}
</style></head>
<body>
<div id="world"></div><div class="shade"></div>
<header class="top"><button class="round" id="homeTop">⌂</button><div class="brand"><b>11520 花果山宇宙萬物交易所</b><small>三軸多維平行宇宙 · KAIOS 跨宇宙結算鈔票</small></div><button class="round" id="walletTop">👤</button></header>
<section class="axisDock" id="axisDock"></section>
<div class="tele">物體空間 XYZ<b id="xyz">X 0.0 · Y 0.0 · Z 0.0</b><span id="ctMini">宇宙邊界 CT：等待報價</span><b id="cashMini">KAIOS 1000 · 保證金 0</b></div>
<div class="center"><div class="pair" id="pairLabel">KZ · BTC/USDT</div><div class="price" id="price">--</div><small id="mode">XYZ 自由移動 · 下單才鎖定宇宙邊界 CT 位移</small></div>
<div class="joy" id="joy"><div class="joyBase"></div><div class="knob" id="knob"></div><div class="joyLabel">360° 浮動搖桿 · XY</div></div>
<div class="attack"><button class="atk zf" id="zf">Z+<br>前進</button><button class="atk zb" id="zb">Z−<br>後退</button><button class="atk flat" id="flat">平</button><button class="atk short" id="short">空</button><button class="atk long" id="long">多</button></div>
<nav class="rail"><button id="navUp">▲</button><button class="pick" id="navPick"><span>🌌</span><b>世界</b></button><button id="navDown">▼</button><button class="home" id="homeRail">⌂</button></nav>
<section class="sheet" id="sheet"><div class="sheetHead"><b id="title">世界</b><button class="x" id="close">×</button></div><div id="body"></div></section><div class="toast" id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const MARKETS=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT','LTCUSDT'];
const LABEL={BTCUSDT:'BTC/USDT',ETHUSDT:'ETH/USDT',BNBUSDT:'BNB/USDT',SOLUSDT:'SOL/USDT',XRPUSDT:'XRP/USDT',DOGEUSDT:'DOGE/USDT',ADAUSDT:'ADA/USDT',TRXUSDT:'TRX/USDT',LINKUSDT:'LINK/USDT',LTCUSDT:'LTC/USDT'};
const S={axis:'KZ',slots:{KX:'BTCUSDT',KY:'ETHUSDT',KZ:'BNBUSDT'},quotes:{},kaios:1000,margin:0,warp:1,pos:null,move:{x:0,y:0},spatial:{x:0,y:0,z:0},zVel:0,zDir:0,menu:0};
const menus=[['🌌','世界','world'],['💰','資產','asset'],['⚔️','交易','trade'],['🛸','ATM','atm'],['👤','生命','me']];
function fmt(v,d=2){return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:d})}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),1800)}function activeSymbol(){return S.slots[S.axis]}function activePrice(){return S.quotes[activeSymbol()]||0}function optionHtml(selected){return MARKETS.map(s=>`<option value="${s}" ${s===selected?'selected':''}>${LABEL[s]}</option>`).join('')}
function renderAxes(){const box=$('#axisDock');box.innerHTML=['KX','KY','KZ'].map(a=>`<div class="axis ${a===S.axis?'on':''}" data-axis="${a}"><div class="axisHead"><span>${a} 宇宙</span><b>${LABEL[S.slots[a]]}</b></div><select data-select="${a}">${optionHtml(S.slots[a])}</select><span class="quote" id="q${a}">${fmt(S.quotes[S.slots[a]]||0,4)}</span></div>`).join('');$$('.axis').forEach(el=>el.onclick=e=>{if(e.target.tagName==='SELECT')return;S.axis=el.dataset.axis;renderAxes();hud()});$$('select[data-select]').forEach(sel=>sel.onchange=e=>{const a=e.target.dataset.select;S.slots[a]=e.target.value;S.axis=a;renderAxes();hud();toast(`${a} → ${LABEL[e.target.value]}`)})}
function hud(){const p=activePrice();$('#xyz').textContent=`X ${fmt(S.spatial.x,1)} · Y ${fmt(S.spatial.y,1)} · Z ${fmt(S.spatial.z,1)}`;$('#ctMini').textContent=`宇宙邊界 ${S.axis} · ${LABEL[activeSymbol()]} · CT ${p?fmt(p,4):'--'}`;$('#cashMini').textContent=`KAIOS ${fmt(S.kaios,1)} · 保證金 ${fmt(S.margin,1)}`;$('#pairLabel').textContent=`${S.axis} · ${LABEL[activeSymbol()]}`;$('#price').textContent=p?'$'+fmt(p,p<10?5:2):'--';if(S.pos)positionMark()}
async function quote(){try{const symbols=encodeURIComponent(JSON.stringify(MARKETS));const r=await fetch(`https://api.binance.com/api/v3/ticker/price?symbols=${symbols}`,{cache:'no-store'});const arr=await r.json();for(const q of arr)S.quotes[q.symbol]=Number(q.price);renderAxes();hud()}catch{$('#mode').textContent='免費行情暫離線 · XYZ 空間仍可移動'}}quote();setInterval(quote,3000);
function pnl(){if(!S.pos)return 0;const now=S.quotes[S.pos.symbol]||S.pos.entry;return(now-S.pos.entry)*(S.pos.side==='LONG'?1:-1)*S.pos.warp}function positionMark(){const p=pnl();$('#mode').textContent=`${S.pos.axis} ${LABEL[S.pos.symbol]} · ${S.pos.side==='LONG'?'多':'空'} ${S.pos.warp}C · ${p>=0?'+':''}${fmt(p,2)} KAIOS`}
function attack(side){const p=activePrice();if(!p)return toast('等待此宇宙 CT 報價');if(S.pos)return toast('先平倉再開新單');const m=Math.min(100,S.margin||S.kaios);if(m<=0)return toast('KAIOS 不足');if(S.margin<m){S.kaios-=m;S.margin+=m}S.pos={axis:S.axis,symbol:activeSymbol(),side,entry:p,warp:S.warp,cap:m};hud();toast(`${S.axis} ${LABEL[activeSymbol()]} ${side==='LONG'?'多':'空'}方出擊`)}function flatten(){if(!S.pos)return toast('目前空倉');let p=Math.max(-S.pos.cap,Math.min(S.pos.cap,pnl()));S.margin+=p;S.pos=null;$('#mode').textContent=`平倉完成 ${p>=0?'+':''}${fmt(p,2)} KAIOS`;hud()}
$('#long').onclick=()=>attack('LONG');$('#short').onclick=()=>attack('SHORT');$('#flat').onclick=flatten;
const joy=$('#joy'),knob=$('#knob');let pid=null,start={x:71,y:66};function jm(e){const r=joy.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(pid===null){pid=e.pointerId;start={x,y};joy.setPointerCapture(pid)}if(e.pointerId!==pid)return;let dx=x-start.x,dy=y-start.y,l=Math.hypot(dx,dy)||1,m=42;if(l>m){dx*=m/l;dy*=m/l}knob.style.left=start.x+dx-24+'px';knob.style.top=start.y+dy-24+'px';S.move={x:dx/m,y:-dy/m}}function je(e){if(e.pointerId!==pid)return;pid=null;S.move={x:0,y:0};knob.style.left='47px';knob.style.top='42px'}joy.onpointerdown=jm;joy.onpointermove=e=>pid!==null&&jm(e);joy.onpointerup=je;joy.onpointercancel=je;function bindZ(id,dir){const b=$(id);b.onpointerdown=e=>{e.preventDefault();S.zDir=dir};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{if(S.zDir===dir)S.zDir=0}}bindZ('#zf',1);bindZ('#zb',-1);
function panel(p){$('#sheet').classList.add('open');const b=$('#body');if(p==='world'){$('#title').textContent='🌌 三軸多維平行宇宙';b.innerHTML=`<p class="tiny">XYZ 是物體自由空間座標。KX、KY、KZ 是三個宇宙邊界槽，每一軸都能獨立掛同一組 10 個免費市場。平常移動不計輸贏；只有下單才鎖定該軸的 CT 現價位移。</p><div class="grid">${['KX','KY','KZ'].map(a=>`<div class="metric"><small>${a}</small><b>${LABEL[S.slots[a]]}</b><span class="tiny">CT ${fmt(S.quotes[S.slots[a]]||0,4)}</span></div>`).join('')}</div>`}else if(p==='asset'){$('#title').textContent='💰 KAIOS 跨宇宙鈔票';b.innerHTML=`<div class="grid"><div class="metric"><small>可用 KAIOS</small><b>${fmt(S.kaios,2)}</b></div><div class="metric"><small>保證金</small><b>${fmt(S.margin,2)}</b></div></div><button class="btn primary" id="dep">放 100 KAIOS 到保證金</button><button class="btn" id="wd">保證金回生活錢包</button><p class="tiny">KAIOS 只負責跨宇宙結算。KGEN 暫不列入這 10 個公共市場；KGEN 只留作未來 ATM / 換 KAIOS 匯率來源。</p>`;setTimeout(()=>{$('#dep').onclick=()=>{let n=Math.min(100,S.kaios);S.kaios-=n;S.margin+=n;hud();panel('asset')};$('#wd').onclick=()=>{S.kaios+=S.margin;S.margin=0;hud();panel('asset')}},0)}else if(p==='trade'){$('#title').textContent='⚔️ 宇宙邊界交易';b.innerHTML=`<div class="metric"><small>目前鎖定</small><b>${S.axis} · ${LABEL[activeSymbol()]}</b><span class="tiny">CT ${fmt(activePrice(),5)}</span></div><select id="warp"><option value="0.0000001">0.0000001C</option><option value="0.001">0.001C</option><option value="0.01">0.01C</option><option value="0.1">0.1C</option><option value="1">1C</option><option value="10">10C</option><option value="100">100C</option><option value="1000">1000C</option></select><p class="tiny">選曲速後關閉面板，用右下多／空。PnL 只看下單時鎖定市場的 CT 位移，與玩家 XYZ 移動無關。</p>`;setTimeout(()=>{$('#warp').value=String(S.warp);$('#warp').onchange=e=>{S.warp=Number(e.target.value);toast(`${S.warp}C`) }},0)}else if(p==='atm'){$('#title').textContent='🛸 KGEN → KAIOS ATM';b.innerHTML=`<p class="tiny">這一版先不把 KGEN/KAIOS 放進免費公共行情。ATM 只保留概念：KGEN 依生命／做市者自主匯率換成 KAIOS，再拿 KAIOS 去三軸宇宙交易。</p><div class="metric"><small>狀態</small><b>匯率市場待接</b></div>`}else{$('#title').textContent='👤 生命';b.innerHTML=`<p class="tiny">目前為 11520 遊戲沙盒。正式鏈上 KAIOS 出入金仍保持 fail-closed；這頁先驗證三軸多宇宙選市場、XYZ 空間與 CT 位移交易玩法。</p>`}}
$('#close').onclick=()=>$('#sheet').classList.remove('open');const menuDefs=[['🌌','世界','world'],['💰','資產','asset'],['⚔️','交易','trade'],['🛸','ATM','atm'],['👤','生命','me']];function renderMenu(){const m=menuDefs[S.menu];$('#navPick').innerHTML=`<span>${m[0]}</span><b>${m[1]}</b>`}function step(d){S.menu=(S.menu+d+menuDefs.length)%menuDefs.length;renderMenu()}$('#navUp').onclick=()=>step(-1);$('#navDown').onclick=()=>step(1);$('#navPick').onclick=()=>panel(menuDefs[S.menu][2]);$('#homeTop').onclick=$('#homeRail').onclick=()=>location.href='../../index.html';$('#walletTop').onclick=()=>panel('me');
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02040b,.016);const cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1500);cam.position.set(0,2,9);const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);$('#world').appendChild(R.domElement);const pts=[];for(let i=0;i<1500;i++)pts.push((Math.random()-.5)*180,(Math.random()-.5)*100,-Math.random()*650);const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(G,new THREE.PointsMaterial({size:.23,color:0x8fdcff})));const rings=[];for(let i=0;i<12;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(5+i*.32,.11,8,72),new THREE.MeshBasicMaterial({color:0xff3158,wireframe:true,transparent:true,opacity:.32}));t.position.z=-12-i*10;t.rotation.x=Math.PI/2;scene.add(t);rings.push(t)}const ship=new THREE.Mesh(new THREE.ConeGeometry(.46,1.6,6),new THREE.MeshBasicMaterial({color:0xffd76b,wireframe:true}));ship.rotation.x=Math.PI/2;ship.position.z=-2;scene.add(ship);let tick=0;function anim(){requestAnimationFrame(anim);tick+=.01;ship.position.x=Math.max(-5,Math.min(5,ship.position.x+S.move.x*.065));ship.position.y=Math.max(-3,Math.min(4,ship.position.y+S.move.y*.065));S.spatial.x=ship.position.x;S.spatial.y=ship.position.y;S.zVel+=S.zDir*.025;S.zVel*=.94;S.zVel=Math.max(-.65,Math.min(.65,S.zVel));S.spatial.z+=S.zVel;rings.forEach(r=>{r.position.z+=S.zVel*.35;if(r.position.z>9)r.position.z-=120;if(r.position.z<-118)r.position.z+=120});cam.position.x+=(ship.position.x*.32-cam.position.x)*.05;cam.position.y+=(2+ship.position.y*.22-cam.position.y)*.05;if(Math.floor(tick*10)%8===0)hud();R.render(scene,cam)}anim();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});renderMenu();renderAxes();hud();
</script></body></html>
