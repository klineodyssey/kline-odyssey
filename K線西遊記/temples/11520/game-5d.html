<script type="module">
import * as THREE from 'three';
import { warpC, verticalY, controlBandLabel } from './controls/nonlinear-controls.mjs';
import { WORLD_OBJECTS, createWorldState, distance2D, playerAttack, resolvePlayerMove, tickWorld } from './runtime/world-runtime.mjs';
import { modelKeyForMonster, modelKeyForWorldObject, resolveModelAsset } from './runtime/model-pipeline.mjs';

const $=s=>document.querySelector(s);
const MARKETS={KX:'BTCUSDT',KY:'ETHUSDT',KZ:'BNBUSDT'};
const D={q:{},kgen:10,kaios:1000,hp:100,xyz:{x:0,y:0,z:0},travel:0,warp:0,camYaw:0,heading:0,pos:{KX:null,KY:null,KZ:null},logs:[]};
const world=createWorldState();
let joy=false,jv={x:0,z:0},yv=0,drag=false,last=null,lastBlocked=false;

function load(){try{const p=JSON.parse(localStorage.getItem('k11520-runtime-game-v2')||'{}');Object.assign(D,p);D.xyz={x:+(p.xyz?.x||0),y:+(p.xyz?.y||0),z:+(p.xyz?.z||0)}}catch{}}
function save(){localStorage.setItem('k11520-runtime-game-v2',JSON.stringify(D))}
function log(t){D.logs.unshift(`${new Date().toLocaleTimeString()} ${t}`);D.logs=D.logs.slice(0,18);$('#eventLog').innerHTML=D.logs.map(x=>`<div>${x}</div>`).join('');save()}
function fmt(v){return v?('$'+Number(v).toLocaleString(undefined,{maximumFractionDigits:2})):'--'}
function pnl(p){const q=D.q[p.symbol]??p.entry;return(q-p.entry)*(p.side==='LONG'?1:-1)*p.lots}
function axes(){const el=$('#axes');el.innerHTML=Object.entries(MARKETS).map(([a,s])=>`<div class="axis panel"><small>${a} · ${s.replace('USDT','/USDT')}</small><b id="q${a}">--</b><small id="p${a}">空倉</small></div>`).join('')}
function monsterHud(){const alive=world.monsters.filter(m=>m.state!=='DEAD');$('#monsterStatus').textContent=alive.some(m=>m.state==='AGGRO')?'怪物 AI：追擊/攻擊中':'怪物 AI：巡守';$('#monsterList').innerHTML=world.monsters.map(m=>`<div class="monsterRow ${m.state==='DEAD'?'dead':''}"><span>${m.name} · ${m.lifeId}</span><b>${m.state==='DEAD'?'DEAD':`${m.hp}/${m.maxHp}`}</b></div>`).join('')}
function hud(){for(const [a,s] of Object.entries(MARKETS)){const p=D.pos[a];$('#q'+a).textContent=fmt(D.q[s]);$('#p'+a).textContent=p?`${p.side==='LONG'?'多':'空'}${p.lots}口 PnL ${pnl(p).toFixed(2)} KGEN`:'空倉'}$('#xyz').textContent=`X ${D.xyz.x.toFixed(1)} · Y ${D.xyz.y.toFixed(1)} · Z ${D.xyz.z.toFixed(1)}`;$('#walk').textContent=`XZ ${D.travel.toFixed(1)}m · Y ${D.xyz.y.toFixed(1)} · C ${D.warp}`;$('#hp').textContent=D.hp;$('#topHp').textContent=D.hp;$('#hpbar').style.width=`${D.hp}%`;$('#topKgen').textContent=D.kgen.toFixed(3);$('#topKaios').textContent=D.kaios.toFixed(1);$('#collision').textContent=`碰撞：${lastBlocked?'BLOCKED':'CLEAR'}`;$('#warpRead').textContent=controlBandLabel(D.warp,{unit:'C'});monsterHud();save()}
async function quotes(){try{const r=await fetch('https://api.binance.com/api/v3/ticker/price');const j=await r.json();for(const x of j)if(Object.values(MARKETS).includes(x.symbol))D.q[x.symbol]=+x.price;$('#tradeStatus').textContent='Binance 公開現貨參考價 LIVE｜KGEN offchain game settlement';hud()}catch{$('#tradeStatus').textContent='行情中斷｜禁止建立新 K 場部位'}}

function openPosition(side){const axis='KX',symbol=MARKETS[axis],price=D.q[symbol];if(!price)return log('KX 行情未就緒，拒絕建立部位');if(D.pos[axis])return log('KX 已有持倉，先平倉');if(D.kgen<1)return log('KGEN 不足，建立 1 口需要 1 KGEN 保證金');D.kgen-=1;D.pos[axis]={side,lots:1,entry:price,symbol,margin:1};log(`KX ${side==='LONG'?'多':'空'} 1口建立｜KGEN 保證金 1`);hud()}
function flat(){const p=D.pos.KX;if(!p)return log('KX 目前空倉');const g=pnl(p);D.kgen+=Math.max(0,p.margin+g);D.pos.KX=null;log(`KX 平倉｜PnL ${g.toFixed(2)} KGEN`);hud()}

function attack(damage=24,label='普通攻擊'){const r=playerAttack(world,D.xyz,damage);if(!r.hit){$('#monsterStatus').textContent='最近怪物超出 2.2m 攻擊範圍';log(`${label} MISS｜OUT_OF_RANGE`);hud();return}if(r.defeated){D.kaios+=r.rewardKaios;log(`${label} 擊殺 ${r.target.name}｜+${r.rewardKaios} KAIOS`)}else log(`${label} 命中 ${r.target.name}｜HP ${r.target.hp}/${r.target.maxHp}｜KAIOS +0`);hud()}
function skill(){if(D.kaios<2)return log('技能需要 2 KAIOS');D.kaios-=2;attack(48,'技能攻擊')}
function dodge(){log('閃避動作｜不產生 KAIOS')}
function speed(){return D.warp===0?0:.015+D.warp/1000*.2}
function move(){const s=speed();let nx=D.xyz.x,ny=D.xyz.y,nz=D.xyz.z;if(joy&&s>0){const c=Math.cos(D.camYaw),n=Math.sin(D.camYaw),wx=jv.x*c+jv.z*n,wz=-jv.x*n+jv.z*c;nx+=wx*s;nz+=wz*s;D.heading=Math.atan2(wx,wz)}if(Math.abs(yv)>.01&&s>0)ny+=yv*s*.5;const before={...D.xyz};const next=resolvePlayerMove(before,{x:nx,y:ny,z:nz});lastBlocked=!!next.blocked;if(!lastBlocked){D.xyz.x=next.x;D.xyz.y=next.y;D.xyz.z=next.z;D.travel+=distance2D(before,next)}hud()}
function tick(){const r=tickWorld(world,D.xyz,Date.now());for(const e of r.events){if(e.type==='PLAYER_HIT'){D.hp=Math.max(0,D.hp-e.damage);const m=world.monsters.find(x=>x.id===e.monsterId);log(`${m?.name||e.monsterId} 攻擊玩家｜-${e.damage} HP`)}else if(e.type==='RESPAWN'){const m=world.monsters.find(x=>x.id===e.monsterId);log(`${m?.name||e.monsterId} 8秒重生｜${e.lifeId}`)}}hud()}

function setJoy(e){const r=$('#joy').getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=42,l=Math.hypot(x,y)||1,k=Math.min(1,m/l),dx=x*k,dy=y*k;jv={x:dx/m,z:-dy/m};$('#knob').style.transform=`translate(${dx}px,${dy}px)`}
$('#joy').onpointerdown=e=>{joy=true;$('#joy').setPointerCapture(e.pointerId);setJoy(e)};$('#joy').onpointermove=e=>joy&&setJoy(e);$('#joy').onpointerup=$('#joy').onpointercancel=()=>{joy=false;jv={x:0,z:0};$('#knob').style.transform='none'};
function bipolarBand(el,e){const r=el.getBoundingClientRect(),t=r.top+24,b=r.bottom-24,c=(t+b)/2,h=(b-t)/2,dy=Math.max(-h,Math.min(h,e.clientY-c));return{v:-dy/h,dy}}
function positiveBand(el,e){const r=el.getBoundingClientRect(),t=r.top+24,b=r.bottom-24;return{v:Math.max(0,Math.min(1,(b-e.clientY)/(b-t))),top:24+Math.max(0,Math.min(1,(e.clientY-t)/(b-t)))*(b-t)}}
let ya=false,wa=false;function sy(e){const g=bipolarBand($('#yControl'),e);yv=verticalY(g.v,{fineMax:1,max:10});$('#yThumb').style.top=`calc(50% + ${g.dy}px)`;$('#yRead').textContent=Math.abs(yv)<.01?'Y 0':`${yv>0?'Y+':'Y−'} ${Math.abs(yv).toFixed(1)}`}
$('#yControl').onpointerdown=e=>{ya=true;$('#yControl').setPointerCapture(e.pointerId);sy(e)};$('#yControl').onpointermove=e=>ya&&sy(e);$('#yControl').onpointerup=$('#yControl').onpointercancel=()=>{ya=false;yv=0;$('#yThumb').style.top='50%';$('#yRead').textContent='Y 0'};
function sw(e){const g=positiveBand($('#warpControl'),e);D.warp=warpC(g.v);$('#warpThumb').style.top=`${g.top}px`;hud()}
$('#warpControl').onpointerdown=e=>{wa=true;$('#warpControl').setPointerCapture(e.pointerId);sw(e)};$('#warpControl').onpointermove=e=>wa&&sw(e);$('#warpControl').onpointerup=$('#warpControl').onpointercancel=()=>wa=false;
$('#lookPad').onpointerdown=e=>{drag=true;last={x:e.clientX,y:e.clientY};$('#lookPad').setPointerCapture(e.pointerId)};$('#lookPad').onpointermove=e=>{if(!drag)return;D.camYaw-=(e.clientX-last.x)*.004;last={x:e.clientX,y:e.clientY}};$('#lookPad').onpointerup=$('#lookPad').onpointercancel=()=>drag=false;
$('#attack').onclick=()=>attack();$('#skill').onclick=skill;$('#dodge').onclick=dodge;$('#buy').onclick=()=>openPosition('LONG');$('#sell').onclick=()=>openPosition('SHORT');$('#flat').onclick=flat;

const renderer=new THREE.WebGLRenderer({canvas:$('#three'),antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.setClearColor(0x86b4cf,1);const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x86a8b7,28,95);const camera=new THREE.PerspectiveCamera(50,1,.1,180);scene.add(new THREE.HemisphereLight(0xffffff,0x243c28,2.1));const sun=new THREE.DirectionalLight(0xfff5d6,2.4);sun.position.set(18,28,8);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(140,140),new THREE.MeshStandardMaterial({color:0x3d6841,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function tree(x,z,s=1){const g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.12*s,.18*s,1.5*s,8),new THREE.MeshStandardMaterial({color:0x5b3d27})),cr=new THREE.Mesh(new THREE.ConeGeometry(.8*s,2.1*s,10),new THREE.MeshStandardMaterial({color:0x2e6d3e}));tr.position.y=.75*s;cr.position.y=2.2*s;g.add(tr,cr);g.position.set(x,0,z);scene.add(g)}for(let i=0;i<42;i++){const x=(i*19%90)-45,z=(i*31%96)-48;if(Math.abs(x)<5)continue;tree(x,z,.7+(i%5)*.08)}
function primitiveFor(key){if(key==='ATM'){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,.6,20),new THREE.MeshStandardMaterial({color:0x6bd4df,metalness:.5}));body.position.y=1.1;g.add(body);return g}if(key==='BUILDING'){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(3,2.6,3),new THREE.MeshStandardMaterial({color:0x8b653e})),r=new THREE.Mesh(new THREE.ConeGeometry(2.4,1.7,4),new THREE.MeshStandardMaterial({color:0x6a2525}));b.position.y=1.3;r.position.y=3.15;r.rotation.y=Math.PI/4;g.add(b,r);return g}if(key==='FIRE_WISP'){return new THREE.Mesh(new THREE.IcosahedronGeometry(.55),new THREE.MeshStandardMaterial({color:0xff7d32,emissive:0x6b1600}))}return new THREE.Mesh(new THREE.DodecahedronGeometry(.65),new THREE.MeshStandardMaterial({color:0x5a2026,emissive:0x180204}))}
for(const o of WORLD_OBJECTS){const asset=await resolveModelAsset(modelKeyForWorldObject(o));const mesh=primitiveFor(asset.key);mesh.position.set(o.x,0,o.z);scene.add(mesh)}
const monsterMeshes=new Map();for(const m of world.monsters){const asset=await resolveModelAsset(modelKeyForMonster(m));const mesh=primitiveFor(asset.key);mesh.position.set(m.x,.75,m.z);mesh.castShadow=true;scene.add(mesh);monsterMeshes.set(m.id,mesh)}
const hero=new THREE.Group(),torso=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.72,8,16),new THREE.MeshStandardMaterial({color:0x303943,metalness:.6})),head=new THREE.Mesh(new THREE.SphereGeometry(.23,18,12),new THREE.MeshStandardMaterial({color:0xd2a179}));torso.position.y=1.1;head.position.y=1.75;hero.add(torso,head);hero.scale.setScalar(.7);scene.add(hero);
$('#assetState').textContent='3D 資源管線：MANIFEST → GLTF（待資產）→ PRIMITIVE FALLBACK';
function resize(){renderer.setSize(innerWidth,innerHeight,true);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function render(){requestAnimationFrame(render);hero.position.set(D.xyz.x,D.xyz.y,D.xyz.z);hero.rotation.y=D.heading;for(const m of world.monsters){const mesh=monsterMeshes.get(m.id);if(!mesh)continue;mesh.visible=m.state!=='DEAD';mesh.position.set(m.x,.75,m.z);mesh.rotation.y+=m.state==='AGGRO'?.035:.008}const dist=8;camera.position.set(D.xyz.x+Math.sin(D.camYaw)*dist,D.xyz.y+4.2,D.xyz.z+Math.cos(D.camYaw)*dist);camera.lookAt(D.xyz.x,D.xyz.y+1.1,D.xyz.z);renderer.render(scene,camera)}
load();axes();hud();quotes();render();setInterval(quotes,5000);setInterval(move,50);setInterval(tick,100);
log('正式 XYZ runtime 已接入：碰撞、怪物 AI、死亡、8秒重生、擊殺 KAIOS');
</script></body></html>
