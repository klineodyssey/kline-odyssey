const MARKETS=[...HOT,...MORE],LABEL=Object.fromEntries(MARKETS.map(s=>[s,s.replace('USDT','/USDT')]));
const S={axis:'KX',slots:{KX:'BTCUSDT',KY:'ETHUSDT',KZ:'BNBUSDT'},quotes:{},ts:{},kaios:1000,kgen:10,warp:1,positions:{KX:null,KY:null,KZ:null},mode:'gps',spatial:{x:0,y:0,z:0},joy:{x:0,y:0,m:0},yDir:0,gps:null,lastGps:null,walkM:0,steps:0,playerHp:100,monsters:[],selectedMonster:null,places:[],profile:null,ufo:null};
const STALE=8000;let map,playerMarker,gpsWatch=null,lastMonsterAttack=0;
function fmt(v,d=2){return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:d})}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1600)}
function fresh(s){return!!S.quotes[s]&&Date.now()-(S.ts[s]||0)<=STALE}function active(){return S.slots[S.axis]}function used(){return Object.values(S.positions).reduce((a,p)=>a+(p?p.margin:0),0)}function pnl(p){if(!p)return 0;const n=S.quotes[p.symbol]||p.entry;return(n-p.entry)*(p.side==='LONG'?1:-1)*p.warp}function hp(p){return p?Math.max(0,Math.min(100,100+pnl(p)/p.margin*100)):100}
function hav(a,b){const R=6371000,d2r=Math.PI/180,dlat=(b.lat-a.lat)*d2r,dlng=(b.lng-a.lng)*d2r,x=Math.sin(dlat/2)**2+Math.cos(a.lat*d2r)*Math.cos(b.lat*d2r)*Math.sin(dlng/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

function setGps(pos,center=true){const g={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy||0};if(S.lastGps){const d=hav(S.lastGps,g);if(d>=1&&d<200){S.walkM+=d;S.steps=Math.round(S.walkM/.75)}}S.lastGps=g;S.gps=g;if(!playerMarker)playerMarker=L.marker([g.lat,g.lng],{icon:playerIcon(),zIndexOffset:1000}).addTo(map);else playerMarker.setLatLng([g.lat,g.lng]);if(center)map.setView([g.lat,g.lng],18);if(!S.monsters.length)spawnWorld(g);updateUfo();hud();saveState()}

function requestGps(){if(!navigator.geolocation)return gpsError({message:'瀏覽器不支援'});navigator.geolocation.getCurrentPosition(p=>{setGps(p,true);$('#gpsStatus').textContent='GPS 已取得';if(gpsWatch===null)gpsWatch=navigator.geolocation.watchPosition(p=>setGps(p,false),gpsError,{enableHighAccuracy:true,maximumAge:3000,timeout:12000})},gpsError,{enableHighAccuracy:true,timeout:12000})}

function nearestMonster(){if(!S.gps)return null;return S.monsters.filter(m=>m.hp>0).sort((a,b)=>hav(S.gps,a)-hav(S.gps,b))[0]||null}
function battleHud(){const m=S.selectedMonster&&S.selectedMonster.hp>0?S.selectedMonster:nearestMonster();if(m&&!S.selectedMonster)S.selectedMonster=m;$('#playerHpText').textContent=Math.round(S.playerHp);$('#playerHpBar').style.width=Math.max(0,S.playerHp)+'%';if(!m){$('#monsterText').textContent='附近暫無怪物';$('#monsterHpBar').style.width='0%';$('#battleBtn').classList.remove('ready');return}const d=S.gps?hav(S.gps,m):9999;$('#monsterText').textContent=`${m.kind} ${m.name} · ${Math.round(d)}m · HP ${Math.round(m.hp)}`;$('#monsterHpBar').style.width=Math.max(0,m.hp/m.maxHp*100)+'%';$('#battleBtn').classList.toggle('ready',d<=45)}
function playerAttack(){let m=S.selectedMonster&&S.selectedMonster.hp>0?S.selectedMonster:nearestMonster();if(!m)return toast('附近沒有怪物');if(!S.gps)return toast('先開啟 GPS');const d=hav(S.gps,m);if(d>45)return toast(`距離 ${Math.round(d)}m，走近 45m 內才能攻擊`);const dmg=12+Math.floor(Math.random()*15);m.hp=Math.max(0,m.hp-dmg);m.marker.setIcon(monsterIcon(m));toast(`攻擊 ${m.name} -${dmg} HP`);if(m.hp<=0){toast(`${m.name} 擊敗！獲得 5 沙盒 KAIOS`);S.kaios+=5;setTimeout(()=>{map.removeLayer(m.marker);S.monsters=S.monsters.filter(x=>x!==m);S.selectedMonster=null;hud()},700)}hud()}
$('#battleBtn').onclick=playerAttack;
function monsterAiTick(){if(!S.gps)return;const now=Date.now();S.monsters.forEach(m=>{if(m.hp<=0)return;let d=hav(S.gps,m);if(d<90&&d>18){const k=Math.min(1,1.2/d);m.lat+=(S.gps.lat-m.lat)*k*.03;m.lng+=(S.gps.lng-m.lng)*k*.03;m.marker.setLatLng([m.lat,m.lng]);d=hav(S.gps,m)}if(d<=24&&now-lastMonsterAttack>3500){S.playerHp=Math.max(0,S.playerHp-m.atk);lastMonsterAttack=now;toast(`${m.name} 攻擊你 -${m.atk} HP`);if(S.playerHp<=0){S.playerHp=100;toast('生命倒下，已在起家地復活')}}});battleHud()}
setInterval(monsterAiTick,1000);
function updateUfo(){if(!S.ufo||!S.gps)return;const t=Date.now()/12000;const p=offset(S.gps.lat,S.gps.lng,70+Math.cos(t)*30,-30+Math.sin(t)*35);S.ufo.lat=p.lat;S.ufo.lng=p.lng;S.ufo.marker?.setLatLng([p.lat,p.lng])}
function addPlaceMarker(p){if(!map)return;const icons={house:'🏠',mall:'🏬',factory:'🏭'},names={house:'房子',mall:'商場',factory:'工廠'};L.marker([p.lat,p.lng],{icon:placeIcon(icons[p.type]||'🏠')}).addTo(map).bindTooltip(p.name||names[p.type]||'建築')}
function build(type){if(!S.gps)return toast('需要 GPS 才能在目前位置建設');const names={house:'我的房子',mall:'我的商場',factory:'我的工廠'},p={id:Date.now(),type,name:names[type],lat:S.gps.lat,lng:S.gps.lng};S.places.push(p);localStorage.setItem('kgen11520_places',JSON.stringify(S.places));addPlaceMarker(p);closePanel();toast(`${p.name} 已建立在目前位置（本機沙盒）`)}
function mapsNav(lat,lng){window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`,'_blank','noopener')}
function openPanel(title,html){$('#panelTitle').textContent=title;$('#panelBody').innerHTML=html;$('#sheet').classList.add('open');$('#sheet').setAttribute('aria-hidden','false')}
function closePanel(){$('#sheet').classList.remove('open');$('#sheet').setAttribute('aria-hidden','true')}
$('#panelClose').onpointerdown=e=>{e.preventDefault();closePanel()};$('#panelClose').onclick=closePanel;
function openNav(){const g=S.gps;openPanel('🧭 GPS／Google 導航',`<div class="grid"><div class="metric"><small>目前 GPS</small><b>${g?`${g.lat.toFixed(5)}, ${g.lng.toFixed(5)}`:'未取得'}</b></div><div class="metric"><small>步行</small><b>${fmt(S.walkM,0)}m / 約 ${S.steps} 步</b></div></div><button class="btn" id="reGps">重新定位</button><button class="btn" id="nearGas">Google 找附近加油站</button><button class="btn" id="nearAtm">Google 找附近 ATM</button>${g?'<button class="btn" id="copyPos">顯示目前位置</button>':''}<p class="tiny">遊戲地圖使用免 key 底圖；真正道路導航交給 Google Maps。GPS 與 KX/KY/KZ 交易結算分離。</p>`);$('#reGps').onclick=requestGps;$('#nearGas').onclick=()=>window.open('https://www.google.com/maps/search/?api=1&query=gas+station','_blank','noopener');$('#nearAtm').onclick=()=>window.open('https://www.google.com/maps/search/?api=1&query=ATM','_blank','noopener');if(g)$('#copyPos').onclick=()=>toast(`${g.lat.toFixed(6)}, ${g.lng.toFixed(6)}`)}
function openBuild(){openPanel('🏗️ 地球建設',`<p class="tiny">建築放在玩家目前 GPS 位置，先保存於本機沙盒；不會自動改土地權利或鏈上狀態。</p><div class="row"><button class="btn" id="bHouse">🏠 建房子</button><button class="btn" id="bMall">🏬 建商場</button></div><button class="btn" id="bFactory">🏭 建工廠</button><div class="metric"><small>已建物件</small><b>${S.places.length}</b></div>`);$('#bHouse').onclick=()=>build('house');$('#bMall').onclick=()=>build('mall');$('#bFactory').onclick=()=>build('factory')}
function exchangeKgenToKaios(rate){const n=Number($('#exAmount')?.value||0);if(!(n>0)||n>S.kgen)return toast('KGEN 數量不足');S.kgen-=n;S.kaios+=n*rate;saveState();hud();toast(`沙盒換鈔：${n} KGEN → ${fmt(n*rate,2)} KAIOS`)}
function exchangeKaiosToKgen(rate){const n=Number($('#exAmount')?.value||0);if(!(n>0)||n>S.kaios)return toast('KAIOS 數量不足');S.kaios-=n;S.kgen+=n/rate;saveState();hud();toast(`沙盒換鈔：${n} KAIOS → ${fmt(n/rate,5)} KGEN`)}
function openAtm(kind='fixed'){const rate=kind==='ufo'?(S.ufo?.rate||520):500;openPanel(kind==='ufo'?'🛸 行動飛碟 ATM':'🏦 固定 KAIOS ATM',`<div class="grid"><div class="metric"><small>KGEN</small><b>${fmt(S.kgen,4)}</b></div><div class="metric"><small>KAIOS</small><b>${fmt(S.kaios,2)}</b></div></div><div class="metric"><small>${kind==='ufo'?'飛碟自主報價':'固定站沙盒報價'}</small><b>1 KGEN = ${rate} KAIOS</b></div><input id="exAmount" inputmode="decimal" placeholder="輸入換鈔數量"><div class="row"><button class="btn" id="toKaios">KGEN → KAIOS</button><button class="btn" id="toKgen">KAIOS → KGEN</button></div><p class="tiny">目前是本機沙盒換鈔，方便試玩。真 KGEN/KAIOS 轉帳維持 fail-closed；行動飛碟 ATM 未來可由雙方同意自主匯率成交。</p>`);$('#toKaios').onclick=()=>exchangeKgenToKaios(rate);$('#toKgen').onclick=()=>exchangeKaiosToKgen(rate)}
function openHelp(){openPanel('❓ 客服／玩法',`<p class="tiny">GPS 模式：現實走動＝地圖角色移動，附近 AI 怪物會巡遊、靠近與攻擊；45m 內可打怪。<br><br>3D 模式：左下搖桿控制角色 XZ 平面，Y+/Y− 控制高度。<br><br>KX/KY/KZ 可各自選市場，各自持一張倉位、保證金與血量。固定 ATM 與行動飛碟 ATM 都保留。</p>`)}
$('#navBtn').onclick=openNav;$('#buildBtn').onclick=openBuild;$('#atmBtn').onclick=()=>openAtm('fixed');$('#helpBtn').onclick=openHelp;$('#gpsBtn').onclick=()=>setMode('gps');$('#modeTop').onclick=()=>setMode(S.mode==='gps'?'3d':'gps');$('#profileTop').onclick=()=>openPanel('👤 玩家生命',`<div class="grid"><div class="metric"><small>玩家</small><b>${S.profile?.name||'未命名'}</b></div><div class="metric"><small>生日</small><b>${S.profile?.birth||'未設定'}</b></div><div class="metric"><small>起家地</small><b>${S.profile?.originLabel||'未設定'}</b></div><div class="metric"><small>生命 HP</small><b>${Math.round(S.playerHp)}</b></div></div><button class="btn" id="resetProfile">重設登入資料</button>`);document.addEventListener('click',e=>{if(e.target?.id==='resetProfile'){localStorage.removeItem('kgen11520_profile');location.reload()}},{once:true});
$('#homeTop').onclick=$('#homeRail').onclick=()=>location.href='../../index.html';
function setMode(mode){S.mode=mode;const gps=mode==='gps';$('#gpsMap').style.display=gps?'block':'none';$('#world3d').style.display=gps?'none':'block';$('#joyZone').style.display=gps?'none':'block';$('#gpsBtn').classList.toggle('on',gps);$('#modeTop').textContent=gps?'🗺️':'🌌';if(gps){setTimeout(()=>map.invalidateSize(),80);if(S.gps)map.setView([S.gps.lat,S.gps.lng],18)}hud()}
function saveState(){localStorage.setItem('kgen11520_state',JSON.stringify({kaios:S.kaios,kgen:S.kgen,walkM:S.walkM,steps:S.steps,playerHp:S.playerHp}))}
function loadState(){try{const x=JSON.parse(localStorage.getItem('kgen11520_state')||'{}');if(Number.isFinite(x.kaios))S.kaios=x.kaios;if(Number.isFinite(x.kgen))S.kgen=x.kgen;if(Number.isFinite(x.walkM))S.walkM=x.walkM;if(Number.isFinite(x.steps))S.steps=x.steps;if(Number.isFinite(x.playerHp))S.playerHp=x.playerHp}catch{}}
function onboard(){const saved=JSON.parse(localStorage.getItem('kgen11520_profile')||'null');if(saved){S.profile=saved;$('#onboard').classList.remove('show');requestGps();return}$('#askGps').onclick=requestGps;$('#enterWorld').onclick=()=>{const name=$('#playerName').value.trim()||'旅人',birth=$('#birthDate').value,origin=$('#origin').value,custom=$('#customOrigin').value.trim();if(!birth)return toast('請先填出生日期');const originLabel=origin==='gps'?'目前 GPS':origin==='11520'?'11520 花果山出生點':(custom||'自訂起家地');S.profile={name,birth,origin,originLabel};localStorage.setItem('kgen11520_profile',JSON.stringify(S.profile));$('#onboard').classList.remove('show');if(origin==='gps')requestGps();else if(!S.gps)map.setView([23.7,121],8);toast(`歡迎 ${name} 進入世界`)}}
// 3D world retained as a separate mode
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07131b);scene.fog=new THREE.FogExp2(0x07131b,.018);const cam=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,500),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);$('#world3d').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd7f4ff,0x17381e,2.3));const sun=new THREE.DirectionalLight(0xffe5b0,2);sun.position.set(-8,18,10);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,300,20,30),new THREE.MeshStandardMaterial({color:0x255b31,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.z=-100;scene.add(ground);const road=new THREE.Mesh(new THREE.PlaneGeometry(8,260),new THREE.MeshStandardMaterial({color:0x66543c}));road.rotation.x=-Math.PI/2;road.position.y=.01;road.position.z=-100;scene.add(road);for(let i=0;i<50;i++){const x=(i%2?1:-1)*(6+Math.random()*25),z=-5-Math.random()*230;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,1.5,6),new THREE.MeshStandardMaterial({color:0x6d452e})),crown=new THREE.Mesh(new THREE.ConeGeometry(.8,2.2,7),new THREE.MeshStandardMaterial({color:0x2e7b3d}));trunk.position.set(x,.75,z);crown.position.set(x,2.1,z);scene.add(trunk,crown)}const avatar=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.75,4,8),new THREE.MeshStandardMaterial({color:0x64eaff}));body.position.y=.75;const head=new THREE.Mesh(new THREE.SphereGeometry(.24,12,10),new THREE.MeshStandardMaterial({color:0xf0c99d}));head.position.y=1.55;avatar.add(body,head);scene.add(avatar);let facing=0,last=performance.now();
const zone=$('#joyZone'),base=$('#joyBase'),knob=$('#joyKnob');let pid=null,jc={x:82,y:260};const JR=64;function placeJoy(){const r=zone.getBoundingClientRect();jc={x:82,y:Math.max(72,r.height-105)};base.style.left=jc.x-64+'px';base.style.top=jc.y-64+'px';knob.style.left=jc.x-27+'px';knob.style.top=jc.y-27+'px'}function moveJoy(e){const r=zone.getBoundingClientRect();let dx=e.clientX-r.left-jc.x,dy=e.clientY-r.top-jc.y,d=Math.hypot(dx,dy)||1;if(d>JR){dx=dx/d*JR;dy=dy/d*JR;d=JR}knob.style.left=jc.x+dx-27+'px';knob.style.top=jc.y+dy-27+'px';S.joy={x:dx/JR,y:-dy/JR,m:d/JR}}zone.onpointerdown=e=>{pid=e.pointerId;zone.setPointerCapture(pid);moveJoy(e)};zone.onpointermove=e=>{if(e.pointerId===pid)moveJoy(e)};function joyEnd(e){if(e.pointerId!==pid)return;pid=null;S.joy={x:0,y:0,m:0};knob.style.left=jc.x-27+'px';knob.style.top=jc.y-27+'px'}zone.onpointerup=zone.onpointercancel=joyEnd;[['upY',1],['dnY',-1]].forEach(([id,v])=>{const b=$('#'+id);b.onpointerdown=e=>{e.preventDefault();S.yDir=v};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>S.yDir=0});
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.033,(now-last)/1000||.016);last=now;if(S.mode==='3d'){if(S.joy.m>.04){const target=Math.atan2(S.joy.x,-S.joy.y),d=((target-facing+Math.PI)%(Math.PI*2))-Math.PI;facing+=d*Math.min(1,dt*14);avatar.rotation.y=facing;const sp=(S.joy.m>.7?5:2.8)*S.joy.m;S.spatial.x+=S.joy.x*sp*dt;S.spatial.z+=S.joy.y*sp*dt}S.spatial.y=Math.max(0,Math.min(8,S.spatial.y+S.yDir*2*dt));avatar.position.set(S.spatial.x,S.spatial.y,-S.spatial.z);cam.position.lerp(avatar.position.clone().add(new THREE.Vector3(0,5,9)),.08);cam.lookAt(avatar.position.clone().add(new THREE.Vector3(0,.8,-1.2)));renderer.render(scene,cam);hud()}}requestAnimationFrame(animate);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);placeJoy();map?.invalidateSize()});
loadState();initMap();placeJoy();renderAxes();hud();onboard();setMode('gps');setInterval(saveState,10000);
