<!doctype html>
<html lang="zh-Hant">
<head>

<style>
:root{--glass:rgba(6,12,24,.68);--line:rgba(130,220,255,.22);--txt:#f4fbff;--muted:#87a8ba;--cyan:#61e9ff;--gold:#ffd76b;--up:#59ffac;--dn:#ff627c;--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040b;color:var(--txt);font-family:Inter,system-ui,-apple-system,"Noto Sans TC",sans-serif}button{font:inherit;color:inherit}
#world{position:fixed;inset:0;z-index:0}.shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 0 35%,rgba(0,0,0,.45) 78%,rgba(0,0,0,.8) 100%)}
.hud{position:fixed;z-index:10;top:max(7px,env(safe-area-inset-top));left:8px;right:8px;height:54px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:17px;background:var(--glass);backdrop-filter:blur(16px)}
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,215,107,.45);color:var(--gold);font-weight:900}.head b{display:block;font-size:12px}.head small{display:block;font-size:9px;color:var(--muted)}.chips{display:flex;gap:4px}.chip{border:1px solid var(--line);border-radius:10px;padding:4px 6px;background:rgba(0,0,0,.25);font-size:8px}.chip b{display:block;color:var(--cyan);font-size:10px}
.coords{position:fixed;z-index:5;top:70px;left:8px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--glass);backdrop-filter:blur(12px);font-size:9px;color:var(--muted)}.coords b{display:block;color:var(--txt);font-size:12px;margin-top:2px}.coords .kz{color:var(--gold)}
.life{position:fixed;z-index:5;top:70px;right:8px;width:132px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--glass);font-size:9px;color:var(--muted)}.life b{display:block;color:var(--txt);font-size:11px}.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:5px 0}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff355f,#ffb46a)}
.centerHint{position:fixed;z-index:4;left:50%;top:43%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;text-shadow:0 4px 18px #000}.centerHint .pair{font-size:10px;color:var(--muted);letter-spacing:.14em}.centerHint .price{font-size:clamp(30px,9vw,70px);font-weight:900;letter-spacing:-.06em}.centerHint .mode{font-size:11px;color:var(--cyan)}
.joyZone{position:fixed;z-index:16;left:12px;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));width:142px;height:142px}.joyBase{position:absolute;width:108px;height:108px;left:17px;top:17px;border-radius:50%;border:1px solid rgba(130,220,255,.3);background:radial-gradient(circle,rgba(30,75,95,.23),rgba(4,10,20,.5));box-shadow:inset 0 0 30px rgba(90,220,255,.08)}.joyKnob{position:absolute;width:48px;height:48px;left:47px;top:47px;border-radius:50%;border:1px solid rgba(97,233,255,.65);background:radial-gradient(circle,rgba(97,233,255,.35),rgba(20,45,70,.75));box-shadow:0 0 22px rgba(97,233,255,.2)}.joyLabel{position:absolute;bottom:0;width:100%;text-align:center;font-size:9px;color:var(--muted)}
.attackZone{position:fixed;z-index:16;right:12px;bottom:calc(var(--nav) + 17px + env(safe-area-inset-bottom));width:176px;height:158px}.atk{position:absolute;border-radius:50%;border:1px solid var(--line);background:rgba(7,15,27,.82);display:grid;place-items:center;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer}.atk:active{transform:scale(.92);filter:brightness(1.35)}.atk.long{width:74px;height:74px;right:0;bottom:23px;border-color:rgba(89,255,172,.58);color:var(--up);background:radial-gradient(circle,rgba(89,255,172,.23),rgba(7,15,27,.86))}.atk.short{width:62px;height:62px;right:76px;bottom:0;border-color:rgba(255,98,124,.58);color:var(--dn);background:radial-gradient(circle,rgba(255,98,124,.23),rgba(7,15,27,.86))}.atk.closePos{width:48px;height:48px;right:91px;bottom:72px;color:var(--gold)}.atk.atm{width:42px;height:42px;right:35px;bottom:111px;font-size:18px}.atk small{font-size:9px;display:block}.attackLabel{position:absolute;right:0;top:0;color:var(--muted);font-size:9px}
.bottomNav{position:fixed;z-index:20;left:8px;right:8px;bottom:max(7px,env(safe-area-inset-bottom));height:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:5px;border:1px solid var(--line);border-radius:20px;background:rgba(4,9,18,.88);backdrop-filter:blur(18px)}.navbtn{border:0;background:transparent;color:var(--muted);border-radius:14px;font-size:9px;display:grid;place-items:center;align-content:center;gap:1px}.navbtn span{font-size:20px}.navbtn.on{color:var(--txt);background:rgba(97,233,255,.08)}
.sheet{position:fixed;z-index:19;left:8px;right:8px;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));max-height:58vh;overflow:auto;padding:13px;border:1px solid var(--line);border-radius:22px;background:rgba(4,9,19,.95);backdrop-filter:blur(18px);transform:translateY(130%);opacity:0;transition:.25s}.sheet.open{transform:translateY(0);opacity:1}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheetHead b{font-size:15px}.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#0a1422}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:9px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.metric small{display:block;color:var(--muted);font-size:9px}.metric b{display:block;margin-top:3px}.btn,input,select{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:#081321;color:var(--txt)}.btn{font-weight:800;margin-top:8px}.btn.primary{border-color:rgba(97,233,255,.55);background:rgba(97,233,255,.1)}.btn.gold{border-color:rgba(255,215,107,.5);color:var(--gold)}.tiny{font-size:9px;line-height:1.5;color:var(--muted)}.toast{position:fixed;z-index:40;left:50%;bottom:calc(var(--nav) + 175px);transform:translateX(-50%) translateY(10px);padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(4,9,18,.94);font-size:11px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:900px){.bottomNav{left:50%;right:auto;transform:translateX(-50%);width:650px}.joyZone{left:5vw}.attackZone{right:5vw}.sheet{left:50%;right:auto;width:560px;transform:translate(-50%,130%)}.sheet.open{transform:translate(-50%,0)}}
</style>
</head><body>
<div id="world"></div><div class="shade"></div>
<header class="hud"><div class="logo">悟</div><div class="head"><b>11520 花果山宇宙萬物交易所</b><small>5D Battle Market · 玩家血管生活區</small></div><div class="chips"><div class="chip">BTC<b id="btcTop">--</b></div><div class="chip">🩸KAIOS<b id="kaiosTop">1000</b></div></div></header>
<div class="coords">生命球膜座標<b id="xy">X 11520 · Y 12345</b><b class="kz" id="kz">KZ / Z = BTC 現價</b></div>
<div class="life">PLAYER LIFE<b id="lifeName">未連錢包</b><div class="bar"><i id="blood"></i></div><span id="bloodText">可用 1000 KAIOS</span></div>
<div class="centerHint"><div class="pair">BTC / USDT · KZ MARKET MEMBRANE</div><div class="price" id="price">--</div><div class="mode" id="mode">左搖桿移動 · 右側多空攻擊</div></div>
<div class="joyZone" id="joyZone"><div class="joyBase"></div><div class="joyKnob" id="joyKnob"></div><div class="joyLabel">360° 浮動移動</div></div>
<div class="attackZone"><div class="attackLabel">交易攻擊區</div><button class="atk atm" id="atmQuick">🛸</button><button class="atk closePos" id="closeQuick">平</button><button class="atk short" id="shortQuick">空<small>SHORT</small></button><button class="atk long" id="longQuick">多<small>LONG</small></button></div>
<nav class="bottomNav"><button class="navbtn on" data-p="world"><span>🌌</span>世界</button><button class="navbtn" data-p="asset"><span>🩸</span>資產</button><button class="navbtn" data-p="trade"><span>🚀</span>交易</button><button class="navbtn" data-p="atm"><span>🛸</span>ATM</button><button class="navbtn" data-p="me"><span>👤</span>我</button></nav>
<section class="sheet" id="sheet"><div class="sheetHead"><b id="sheetTitle">世界</b><button class="x" id="closeSheet">×</button></div><div id="sheetBody"></div></section><div class="toast" id="toast"></div>
<script src="../12345/assets/ethers-5.7.2.umd.min.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const state={btc:0,kaios:1000,margin:0,warp:1,pos:null,wallet:null,move:{x:0,y:0},heading:0};const KAIOS='0xD4E67B3a69e41524c424150E6b6e921b01D036db';const ERC20=['function balanceOf(address) view returns(uint256)','function decimals() view returns(uint8)'];
function fmt(v,d=2){return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:d})}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}function hud(){$('#kaiosTop').textContent=fmt(state.kaios,1);$('#bloodText').textContent=`可用 ${fmt(state.kaios,2)} · 保證金 ${fmt(state.margin,2)} KAIOS`;$('#kz').textContent=`KZ / Z = ${state.btc?fmt(state.btc,2):'--'} · BTC 球膜現價`;$('#blood').style.width=Math.max(5,Math.min(100,state.kaios/(state.kaios+state.margin||1)*100))+'%'}
async function quote(){try{const r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT',{cache:'no-store'});const j=await r.json();state.btc=Number(j.price);$('#price').textContent='$'+fmt(state.btc,2);$('#btcTop').textContent=fmt(state.btc,0);hud();if(state.pos)mark();}catch{$('#mode').textContent='行情暫離線 · 控制仍可試玩'}}setInterval(quote,2500);quote();
// 3D world
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02040b,.016);const cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1800);cam.position.set(0,2,9);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);$('#world').appendChild(renderer.domElement);
const stars=[];for(let i=0;i<1800;i++)stars.push((Math.random()-.5)*180,(Math.random()-.5)*100,-Math.random()*700);const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(stars,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({size:.24,color:0x8fdcff,transparent:true,opacity:.85})));
const vesselMat=new THREE.MeshBasicMaterial({color:0xff3158,wireframe:true,transparent:true,opacity:.38});for(let i=0;i<4;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(5+i*1.8,.18,8,96),vesselMat);t.position.z=-12-i*16;t.rotation.x=Math.PI/2;scene.add(t)}const ship=new THREE.Mesh(new THREE.ConeGeometry(.48,1.7,6),new THREE.MeshBasicMaterial({color:0xffd76b,wireframe:true}));ship.rotation.x=Math.PI/2;ship.position.z=-2;scene.add(ship);const ufo=new THREE.Mesh(new THREE.SphereGeometry(.55,16,8),new THREE.MeshBasicMaterial({color:0x61e9ff,wireframe:true}));ufo.scale.set(1.8,.45,1.2);ufo.position.set(4,1,-6);scene.add(ufo);
// floating joystick - origin follows first touch inside left lower zone
const zone=$('#joyZone'),knob=$('#joyKnob');let joyId=null,origin={x:71,y:71};function joyMove(e){const r=zone.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;if(joyId===null){joyId=e.pointerId;origin={x,y};zone.setPointerCapture(e.pointerId)}if(e.pointerId!==joyId)return;let dx=x-origin.x,dy=y-origin.y;const max=42,len=Math.hypot(dx,dy)||1;if(len>max){dx*=max/len;dy*=max/len}knob.style.left=(origin.x+dx-24)+'px';knob.style.top=(origin.y+dy-24)+'px';state.move.x=dx/max;state.move.y=-dy/max;state.heading=Math.atan2(state.move.x,state.move.y)}function joyEnd(e){if(e.pointerId!==joyId)return;joyId=null;state.move.x=state.move.y=0;origin={x:71,y:71};knob.style.left='47px';knob.style.top='47px'}zone.addEventListener('pointerdown',joyMove);zone.addEventListener('pointermove',e=>joyId!==null&&joyMove(e));zone.addEventListener('pointerup',joyEnd);zone.addEventListener('pointercancel',joyEnd);
function pnl(){if(!state.pos||!state.btc)return 0;const dir=state.pos.side==='LONG'?1:-1;return (state.btc-state.pos.entry)*dir*state.pos.warp}function mark(){const p=pnl();$('#mode').textContent=`${state.pos.side==='LONG'?'多方':'空方'} ${state.pos.warp}C · PnL ${p>=0?'+':''}${fmt(p,2)} KAIOS`}
function attack(side){if(!state.btc)return toast('等待 BTC 指數');if(state.pos)return toast('已有持倉，先平倉');const collateral=Math.min(100,state.margin||state.kaios);if(collateral<=0)return toast('先把 KAIOS 放入保證金');if(state.margin<collateral){state.kaios-=collateral;state.margin+=collateral}state.pos={side,warp:state.warp,entry:state.btc,collateral};toast(`${side==='LONG'?'多':'空'}方攻擊 · ${state.warp}C`);mark()}function closePos(){if(!state.pos)return toast('目前空倉');let p=pnl();p=Math.max(-state.pos.collateral,Math.min(state.pos.collateral,p));state.margin+=p;toast(`平倉 ${p>=0?'+':''}${fmt(p,2)} KAIOS`);state.pos=null;$('#mode').textContent='左搖桿移動 · 右側多空攻擊';hud()}
$('#longQuick').onclick=()=>attack('LONG');$('#shortQuick').onclick=()=>attack('SHORT');$('#closeQuick').onclick=closePos;$('#atmQuick').onclick=()=>openPanel('atm');
function openPanel(p){$$('.navbtn').forEach(b=>b.classList.toggle('on',b.dataset.p===p));$('#sheet').classList.add('open');const body=$('#sheetBody'),title=$('#sheetTitle');if(p==='world'){title.textContent='🌌 世界 / KZ 球膜';body.innerHTML=`<p class="tiny">X、Y 是生命在血管附近的空間位置；<b>KZ / Z 是 K 球球膜市場座標</b>，目前 BTC/USDT 現價直接成為可見 Z。左下浮動圓盤可 360° 移動與轉向。</p><div class="grid2"><div class="metric"><small>X</small><b>11520</b></div><div class="metric"><small>Y</small><b>12345</b></div><div class="metric"><small>KZ / Z</small><b>${fmt(state.btc,2)}</b></div><div class="metric"><small>附近生命</small><b>ATM 飛碟</b></div></div>`}else if(p==='asset'){title.textContent='🩸 我的血液資產';body.innerHTML=`<div class="grid2"><div class="metric"><small>生命可用</small><b>${fmt(state.kaios,2)} KAIOS</b></div><div class="metric"><small>11520 保證金</small><b>${fmt(state.margin,2)} KAIOS</b></div></div><button class="btn primary" id="dep">流入 100 KAIOS 保證金</button><button class="btn" id="wd">保證金全部回流</button><p class="tiny">每個玩家的血液綁定自己的 Life / Wallet / 空間狀態；畫面中的公共血管不是「所有人的錢混在一起」。</p>`;setTimeout(()=>{$('#dep').onclick=()=>{const n=Math.min(100,state.kaios);state.kaios-=n;state.margin+=n;hud();openPanel('asset')};$('#wd').onclick=()=>{state.kaios+=state.margin;state.margin=0;hud();openPanel('asset')}},0)}else if(p==='trade'){title.textContent='🚀 曲速 / 攻擊設定';body.innerHTML=`<div class="metric"><small>BTC / USDT · KZ</small><b>$${fmt(state.btc,2)}</b></div><label class="tiny">曲速倍率</label><select id="warpSel"><option>0.0000001</option><option>0.001</option><option>0.01</option><option>0.1</option><option selected>1</option><option>10</option><option>100</option><option>1000</option></select><p class="tiny">選好速度後，不必再找表格按鈕：直接用右下「多 / 空」攻擊鍵下單，右下「平」退出戰鬥。</p>`;setTimeout(()=>{$('#warpSel').value=String(state.warp);$('#warpSel').onchange=e=>{state.warp=Number(e.target.value);toast(`曲速 ${state.warp}C`) }},0)}else if(p==='atm'){title.textContent='🛸 行動 ATM 飛碟';body.innerHTML=`<div class="metric"><small>附近飛碟自主報價</small><b>1 KGEN ↔ 777 KAIOS</b></div><button class="btn gold" id="acceptAtm">接受報價（沙盒）</button><p class="tiny">飛碟是可跨區移動的紅血球／ATM。匯率由生命自己報，雙方同意才成交；不是固定宇宙匯率。</p>`;setTimeout(()=>{$('#acceptAtm').onclick=()=>{state.kaios+=777;hud();toast('沙盒：收到 777 KAIOS')}},0)}else{title.textContent='👤 我的生命 / 錢包';body.innerHTML=`<button class="btn primary" id="connect">連接 Web3 錢包</button><div class="tiny" id="walletLine">${state.wallet||'尚未連線'}</div><p class="tiny">官網可讀 BSC KAIOS 餘額；真入金/清算仍只在正式部署地址登記後解鎖。</p>`;setTimeout(()=>{$('#connect').onclick=connect},0)}}
$$('.navbtn').forEach(b=>b.onclick=()=>openPanel(b.dataset.p));$('#closeSheet').onclick=()=>$('#sheet').classList.remove('open');async function connect(){if(!window.ethereum)return toast('請用支援 Web3 的錢包瀏覽器');try{const [a]=await ethereum.request({method:'eth_requestAccounts'});state.wallet=a;$('#lifeName').textContent=a.slice(0,6)+'…'+a.slice(-4);const p=new ethers.providers.Web3Provider(window.ethereum);const c=new ethers.Contract(KAIOS,ERC20,p);const [bal,dec]=await Promise.all([c.balanceOf(a),c.decimals()]);state.kaios=Number(ethers.utils.formatUnits(bal,dec));hud();toast('生命錢包已連線');openPanel('me')}catch(e){toast('連線失敗')}}
let t=0;function animate(){requestAnimationFrame(animate);t+=.01;const speed=.035+Math.hypot(state.move.x,state.move.y)*.12+(state.pos?Math.min(1,state.pos.warp/100)*.1:0);ship.position.x+=state.move.x*.06;ship.position.y+=state.move.y*.06;ship.position.x=Math.max(-5,Math.min(5,ship.position.x));ship.position.y=Math.max(-3,Math.min(4,ship.position.y));ship.rotation.z=-state.heading;cam.position.x+=(ship.position.x*.35-cam.position.x)*.05;cam.position.y+=(2+ship.position.y*.25-cam.position.y)*.05;scene.children.forEach(o=>{if(o.isPoints){o.position.z+=speed;if(o.position.z>5)o.position.z=-20}});ufo.position.x=4+Math.sin(t*.7)*1.6;ufo.position.y=1+Math.cos(t*.5)*.6;renderer.render(scene,cam)}animate();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});hud();
</script></body></html>
