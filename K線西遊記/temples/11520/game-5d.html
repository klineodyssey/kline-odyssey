R.domElement.addEventListener('pointerup',e=>{if(e.clientY>innerHeight-240)return;const r=R.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,cam);const hit=ray.intersectObjects(entities,false)[0];if(hit)showEntity(hit.object)});$('#entityClose').onclick=()=>$('#entityCard').classList.remove('show');$('#entityAction').onclick=()=>{if(!S.selected)return;const e=S.selected.userData.entity;if(e.type==='MOBILE_ATM'){if(distanceToPlayer(S.selected)>7)return toast('ATM 太遠，用搖桿＋推進靠近');$('#entityCard').classList.remove('show');panel('atm')}else toast(`${e.name}：${e.role}`)};
// panels
function panel(p){$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));$('#sheet').classList.add('open');const b=$('#body');if(p==='world'){$('#title').textContent='🌌 血管空間 / 市場球膜';b.innerHTML=`<div class="grid"><div class="metric"><small>空間 X</small><b>${fmt(S.spatial.x,1)}</b></div><div class="metric"><small>空間 Y</small><b>${fmt(S.spatial.y,1)}</b></div><div class="metric"><small>血管深度 Z</small><b>${fmt(S.spatial.z,1)}</b></div><div class="metric"><small>所在器官</small><b>11520</b></div></div><p class="tiny"><b>XYZ 是真正的 3D 空間：</b>X/Y 在血管橫切面移動，Z 是沿血管長度前進。<br><b>KX/KY/KZ 是另一套市場座標：</b>KX=KGEN、KY=KAIOS、KZ=BTC。兩套不再混用。點場景中的飛碟、紅血球、器官門會顯示其生命／物種資料。</p>`}else if(p==='asset'){$('#title').textContent='🩸 生存／保證金';b.innerHTML=`<div class="grid"><div class="metric"><small>KAIOS 生活鈔票</small><b>${fmt(S.kaios,2)}</b></div><div class="metric"><small>KGEN 沙盒</small><b>${fmt(S.kgen,4)}</b></div><div class="metric"><small>11520 保證金</small><b>${fmt(S.margin,2)}</b></div><div class="metric"><small>生命力</small><b>${fmt(S.vitality,0)}%</b></div></div><button class="btn" id="dep">放 100 KAIOS 到保證金</button><button class="btn" id="wd">保證金全部回流</button><button class="btn gold" id="eat">吃飯 · 5 KAIOS</button><p class="tiny">沒有 KAIOS 時不能支付生活與部分旅行／服務。現在仍是遊戲沙盒資產，不會送出真幣。</p>`;setTimeout(()=>{$('#dep').onclick=()=>{let n=Math.min(100,S.kaios);S.kaios-=n;S.margin+=n;hud();panel('asset')};$('#wd').onclick=()=>{S.kaios+=S.margin;S.margin=0;hud();panel('asset')};$('#eat').onclick=()=>{if(S.kaios<5)return toast('KAIOS 不足，沒錢吃飯');S.kaios-=5;S.vitality=Math.min(100,S.vitality+20);hud();toast('吃飯完成 · -5 KAIOS');panel('asset')}},0)}else if(p==='trade'){$('#title').textContent='⚔️ 市場軸／曲速';b.innerHTML=`<div class="grid"><div class="metric"><small>KX · KGEN/WBNB</small><b>${fmt(S.kgenMark,7)}</b></div><div class="metric"><small>KY · KAIOS</small><b>待市場</b></div><div class="metric"><small>KZ · BTC/USDT</small><b>${fmt(S.btc,2)}</b></div><div class="metric"><small>目前鎖定</small><b>${S.target}</b></div></div><select id="axis"><option value="KX">KX · KGEN</option><option value="KY">KY · KAIOS</option><option value="KZ">KZ · BTC</option></select><select id="warp"><option>0.0000001</option><option>.001</option><option>.01</option><option>.1</option><option>1</option><option>10</option><option>100</option><option>1000</option></select><p class="tiny">三個市場軸同時構成 K 球膜，但一張單只攻擊一軸。選好軸與曲速後，用右下「多／空」攻擊。</p>`;setTimeout(()=>{$('#axis').value=S.target;$('#warp').value=S.warp;$('#axis').onchange=e=>{$$('.targetbar button').find(x=>x.dataset.axis===e.target.value)?.click()};$('#warp').onchange=e=>{S.warp=Number(e.target.value);toast(`${S.warp}C`) }},0)}else if(p==='atm'){$('#title').textContent='🛸 ATM-RED-01';const near=distanceToPlayer(ufo)<=7;b.innerHTML=`<div class="metric"><small>物種</small><b>行動紅血球／生命做市者</b></div><div class="metric"><small>自主報價</small><b>1 KGEN ↔ 777 KAIOS</b></div><p class="tiny">目前距離 ${fmt(distanceToPlayer(ufo),1)}m · ${near?'已進入交易距離':'太遠，先在世界中靠近飛碟'}</p><input id="kgenIn" type="number" min="0" step="0.01" value="1"><button class="btn gold" id="buyK" ${near?'':'disabled'}>用 KGEN 換 KAIOS</button><input id="kaiosIn" type="number" min="0" step="1" value="777"><button class="btn" id="sellK" ${near?'':'disabled'}>用 KAIOS 換 KGEN</button><p class="tiny">沙盒成交；飛碟匯率由生命自己報，雙方同意才成交。</p>`;setTimeout(()=>{if(!near)return;$('#buyK').onclick=()=>{let n=Number($('#kgenIn').value);if(n<=0||S.kgen<n)return toast('KGEN 不足');S.kgen-=n;S.kaios+=n*777;hud();toast(`成交 +${fmt(n*777,2)} KAIOS`);panel('atm')};$('#sellK').onclick=()=>{let n=Number($('#kaiosIn').value);if(n<=0||S.kaios<n)return toast('KAIOS 不足');S.kaios-=n;S.kgen+=n/777;hud();toast(`成交 +${fmt(n/777,4)} KGEN`);panel('atm')}},0)}else{$('#title').textContent='👤 生命／錢包';b.innerHTML=`<button class="btn primary" id="connect">連接 BSC 錢包</button><p class="tiny">${S.wallet||'尚未連線'}<br>目前只讀鏈上 KAIOS 餘額；所有換匯、保證金與多空仍保持沙盒，正式部署地址驗證後才解鎖真資產寫入。</p>`;setTimeout(()=>$('#connect').onclick=connect,0)}}
$$('.nav button').forEach(x=>x.onclick=()=>panel(x.dataset.p));$('#close').onclick=()=>$('#sheet').classList.remove('open');async function connect(){if(!window.ethereum)return toast('請用支援 Web3 的錢包瀏覽器');try{const[a]=await ethereum.request({method:'eth_requestAccounts'});S.wallet=a;$('#lifeName').textContent=a.slice(0,6)+'…'+a.slice(-4);const p=new ethers.providers.Web3Provider(window.ethereum),c=new ethers.Contract(KAIOS,ERC20,p),[bal,dec]=await Promise.all([c.balanceOf(a),c.decimals()]);S.kaios=Number(ethers.utils.formatUnits(bal,dec));hud();toast('生命錢包已連線')}catch{toast('連線失敗')}}
let t=0,last=performance.now();function anim(now=performance.now()){requestAnimationFrame(anim);const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;const xySpeed=3.2;S.spatial.x=Math.max(-4.2,Math.min(4.2,S.spatial.x+S.move.x*xySpeed*dt));S.spatial.y=Math.max(-3.2,Math.min(3.2,S.spatial.y+S.move.y*xySpeed*dt));if(S.thrust){const zSpeed=3+Math.min(80,Math.max(0,Math.log10(Math.max(S.warp,0.0000001))+7)*8);S.spatial.z+=zSpeed*dt;for(const o of entities)o.position.z+=zSpeed*dt*.55;for(const ring of vessel)ring.position.z+=zSpeed*dt*.55}ship.position.x+=(S.spatial.x-ship.position.x)*.12;ship.position.y+=(S.spatial.y-ship.position.y)*.12;cam.position.x+=(ship.position.x*.28-cam.position.x)*.06;cam.position.y+=(2+ship.position.y*.22-cam.position.y)*.06;ufo.position.x=3.2+Math.sin(t*.7)*1.5;ufo.position.y=.6+Math.cos(t*.55)*.7;for(const o of entities){if(o.userData.entity?.type==='RED_BLOOD_CELL'){o.position.z+=dt*1.2;if(o.position.z>5)o.position.z=-70-Math.random()*80}}for(const ring of vessel)if(ring.position.z>7)ring.position.z-=196;hud();R.render(scene,cam)}anim();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});hud();
</script></body></html>
