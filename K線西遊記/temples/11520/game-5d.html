const STALE_MS=8000;

function fmt(v,d=2){return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:d})}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),1800)}
function sym(a=S.axis){return S.slots[a]}function price(a=S.axis){return S.quotes[sym(a)]||0}function age(s){return S.quoteTs[s]?Date.now()-S.quoteTs[s]:Infinity}function fresh(s){return !!S.quotes[s]&&age(s)<=STALE_MS}
function renderAxes(){const box=$('#axisDock');box.innerHTML=['KX','KY','KZ'].map(a=>{const s=sym(a),ok=fresh(s),p=S.quotes[s];return `<button class="axis ${a===S.axis?'on':''}" data-axis="${a}"><div class="axisHead"><span>${a} 球膜邊界</span><b>${ok?'LIVE':'STALE'}</b></div><strong>${LABEL[s]}</strong><span class="q">${p?'$'+fmt(p,p<10?5:2):'--'}</span><span class="a">${S.quoteTs[s]?Math.round(age(s)/1000)+' 秒前':'等待'}</span></button>`}).join('');$$('.axis').forEach(b=>b.onclick=()=>{S.axis=b.dataset.axis;renderAxes();hud();toast(`已鎖定 ${S.axis}，多空會攻擊 ${LABEL[sym()]}`)})}
function pnl(){if(!S.pos)return 0;const now=S.quotes[S.pos.symbol]||S.pos.entry;return(now-S.pos.entry)*(S.pos.side==='LONG'?1:-1)*S.pos.warp}

async function quote(){try{const q=encodeURIComponent(JSON.stringify(MARKETS));const r=await fetch(`https://api.binance.com/api/v3/ticker/price?symbols=${q}`,{cache:'no-store'});const arr=await r.json(),now=Date.now();for(const x of arr){S.quotes[x.symbol]=Number(x.price);S.quoteTs[x.symbol]=now}renderAxes();hud()}catch{$('#mode').textContent='免費行情暫離線，禁止新單；XYZ 仍可自由移動'}}quote();setInterval(quote,3000);
function attack(side){const s=sym(),p=price();if(S.pos)return toast('先平倉再開新單');if(!fresh(s))return toast('此市場 CT 過舊，禁止下單');let cap=Math.min(S.margin||S.kaios,100);if(cap<=0)return toast('KAIOS 不足');if(S.margin<cap){S.kaios-=cap;S.margin+=cap}S.pos={axis:S.axis,symbol:s,side,entry:p,warp:S.warp,cap};toast(`${S.axis} ${LABEL[s]} ${side==='LONG'?'多':'空'}方下單`);hud()}
function flatten(){if(!S.pos)return toast('目前沒有持倉');if(!fresh(S.pos.symbol))return toast('行情過舊，暫停結算');let p=Math.max(-S.pos.cap,Math.min(S.pos.cap,pnl()));S.margin+=p;S.pos=null;toast(`平倉 ${p>=0?'+':''}${fmt(p,2)} KAIOS`);hud()}
$('#long').onclick=()=>attack('LONG');$('#short').onclick=()=>attack('SHORT');$('#flat').onclick=flatten;
function marketButtons(list){return `<div class="markets">${list.map(s=>`<button class="marketBtn ${s===sym()?'on':''}" data-market="${s}"><b>${LABEL[s]}</b><small>${fresh(s)?'LIVE · $'+fmt(S.quotes[s],S.quotes[s]<10?5:2):'等待行情'}</small></button>`).join('')}</div>`}

換鈔區。這版先保留入口，不把 KGEN/KAIOS 混進公共行情市場。</p><div class="metric"><small>狀態</small><b>匯率市場待接</b></div>'}else{$('#title').textContent='👤 生命';b.innerHTML='<p class="tiny">目前是 11520 遊戲沙盒。正式鏈上 KAIOS 出入金仍 fail-closed；先驗證三軸球膜、多空、XYZ 和人性化操作。</p>'}}
