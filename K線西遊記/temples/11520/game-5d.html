<script type="module">
import * as THREE from 'three';
import {fireLots,warpC,leverageL,verticalY,controlBandLabel} from './controls/nonlinear-controls.mjs';
import {WORLD_OBJECTS,WORLD_RULES,createWorldState,distance2D,playerAttack,resolvePlayerMove,tickWorld} from './runtime/world-runtime.mjs';
import {DESTINATIONS,defaultInventory,useInventoryItem,exchangeLocal,previewOrder,executeOrder,closePosition,positionPnl,tradeStats,movementStep} from './runtime/game-ui-runtime.mjs';
const $=s=>document.querySelector(s);const M=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT','LTCUSDT'];
const ORGANS=[['world','🌍','主城世界(5D)'],['trade','⚔','交易面板(K場)'],['positions','📌','持倉部位'],['orders','🧾','委託掛單'],['history','🕘','歷史成交'],['assets','💰','資產總覽'],['records','📊','交易紀錄'],['market','📈','市場資訊'],['bag','🎒','背包(道具)'],['character','🧍','角色狀態'],['worldmap','🗺','世界地圖'],['atm','🛸','ATM/換鈔'],['settings','⚙','系統設定'],['help','✨','AI/幫助']];
const D={axis:'KX',slots:{KX:'BTCUSDT',KY:'ETHUSDT',KZ:'TRXUSDT'},q:{},kgen:10,kaios:1000,kufo:.97,pos:{KX:null,KY:null,KZ:null},orders:[],history:[],logs:[],inventory:defaultInventory(),xyz:{x:0,y:0,z:0},hp:100,mode:'5d',travel:0,warp:0,fire:0,leverage:1,tradeOpen:false,camYaw:0,heading:0,settings:{music:50,voice:true,quality:'high',camera:50}};
const world=createWorldState();let joy=false,jv={turn:0,forward:0},yv=0,drag=false,last=null,pending=null,lastBlocked=false,lastBlocker=null;
function load(){try{const p=JSON.parse(localStorage.getItem('k11520-mother-v2')||'{}');Object.assign(D,p);D.inventory=Array.isArray(p.inventory)?p.inventory:defaultInventory();D.xyz={x:+(p.xyz?.x||0),y:+(p.xyz?.y||0),z:+(p.xyz?.z||0)}}catch{}}
function save(){localStorage.setItem('k11520-mother-v2',JSON.stringify(D))}function fmt(v){return '$'+(+v).toLocaleString(undefined,{maximumFractionDigits:2})}function log(t){D.logs.unshift(`${new Date().toLocaleTimeString()} ${t}`);D.logs=D.logs.slice(0,30);renderLog();save()}function renderLog(){$('#eventLog').innerHTML=D.logs.map(x=>`<div>${x}</div>`).join('')||'<div class="muted">系統待命</div>'}
function initMenus(){$('#leftRail').innerHTML=ORGANS.map(([id,ic,n])=>`<button data-organ="${id}">${ic} ${n}</button>`).join('');$('#quickRail').innerHTML=ORGANS.map(([id,ic,n])=>`<button title="${n}" data-organ="${id}">${ic}</button>`).join('');document.querySelectorAll('[data-organ]').forEach(b=>b.addEventListener('click',()=>openOrgan(b.dataset.organ)))}
function axes(){const e=$('#axes');e.innerHTML=['KX','KY','KZ'].map(a=>`<div class="axis panel"><div class="row"><small>${a} 球膜軸</small><em>LIVE</em></div><select data-a="${a}">${M.map(m=>`<option ${D.slots[a]===m?'selected':''}>${m.replace('USDT','/USDT')}</option>`).join('')}</select><b id="q${a}">--</b><small id="p${a}">空倉</small></div>`).join('');document.querySelectorAll('[data-a]').forEach(s=>s.addEventListener('change',()=>{D.slots[s.dataset.a]=s.value.replace('/','');D.axis=s.dataset.a;hud()}))}
function hud(){for(const a of['KX','KY','KZ']){const q=D.q[D.slots[a]],p=D.pos[a];$('#q'+a).textContent=q?fmt(q):'--';$('#p'+a).innerHTML=p?`${p.side}${p.lots}口 · L${p.leverage} · <span class="${positionPnl(p,q)>=0?'good':'bad'}">${positionPnl(p,q).toFixed(2)} KGEN</span>`:'空倉'}$('#xyz').textContent=`X ${D.xyz.x.toFixed(1)} · Y ${D.xyz.y.toFixed(1)} · Z ${D.xyz.z.toFixed(1)}`;$('#walk').textContent=`XZ ${D.travel.toFixed(1)}m · Y ${D.xyz.y.toFixed(1)} · C ${D.warp}`;$('#hp').textContent=D.hp;$('#hpbar').style.width=D.hp+'%';$('#topKgen').textContent=D.kgen.toFixed(3);$('#topKaios').textContent=D.kaios.toFixed(1);$('#collision').textContent=lastBlocked?`碰撞：BLOCKED · ${lastBlocker?.name||'WORLD'}`:'碰撞：CLEAR';$('#warpRead').textContent=controlBandLabel(D.warp,{unit:'C'});$('#fireRead').textContent=controlBandLabel(D.fire,{bipolar:true,unit:'口'});$('#levRead').textContent=controlBandLabel(D.leverage,{unit:'x'});renderMonsterHud();save()}
function renderMonsterHud(){const ag=world.monsters.find(m=>m.state==='AGGRO');$('#monster').textContent=ag?`${ag.name} 追擊中`:'怪物 AI 巡守';$('#monsterList').innerHTML=world.monsters.map(m=>`<div>${m.name} · ${m.state==='DEAD'?'DEAD':`${m.hp}/${m.maxHp}`}</div>`).join('')}
async function quotes(){try{const r=await fetch('https://api.binance.com/api/v3/ticker/price'),j=await r.json();for(const x of j)if(M.includes(x.symbol))D.q[x.symbol]=+x.price;$('#feed').textContent='行情 LIVE · Binance 公開報價'}catch{$('#feed').textContent='行情中斷 · 新單停用'}hud()}
function openOrgan(id){if(id==='world'){closeOrgan();setMode('5d');return}$('#organTitle').textContent=ORGANS.find(x=>x[0]===id)?.[2]||id;$('#organBody').innerHTML=organHtml(id);$('#organSheet').classList.add('open');$('#toolDock').classList.remove('open');bindDynamic(id)}function closeOrgan(){$('#organSheet').classList.remove('open')}
function rowsPositions(){return ['KX','KY','KZ'].map(a=>{const p=D.pos[a];return p?`<tr><td>${a}</td><td>${p.symbol}</td><td>${p.side}</td><td>${p.lots}</td><td>${fmt(p.entry)}</td><td>${positionPnl(p,D.q[p.symbol]).toFixed(2)}</td><td><button class="btn" data-close-axis="${a}">平倉</button></td></tr>`:`<tr><td>${a}</td><td colspan="6" class="muted">空倉</td></tr>`}).join('')}
function organHtml(id){const stats=tradeStats(D.history);switch(id){case'trade':return `<div class="grid2"><div class="card"><h3>${D.axis} ${D.slots[D.axis]}</h3><p>火力 ${D.fire}口｜L ${D.leverage}x</p><button class="btn" id="tradeToggleInside">${D.tradeOpen?'收合':'展開'}交易控制</button></div><div class="card"><h3>交易規則</h3><p>Preview → Confirm → Submit；KGEN 結算。</p></div></div>`;case'positions':return `<div class="card"><table class="table"><tr><th>軸</th><th>市場</th><th>方向</th><th>口</th><th>均價</th><th>PnL</th><th></th></tr>${rowsPositions()}</table></div>`;case'orders':return `<div class="card"><h3>委託掛單</h3>${D.orders.length?D.orders.map(o=>`<div>${o.id}｜${o.status}<button class="btn" data-cancel-order="${o.id}">取消</button></div>`).join(''):'目前沒有未成交掛單。'}</div>`;case'history':return `<div class="card"><h3>歷史成交</h3>${D.history.length?D.history.map(h=>`<div>${h.time}｜${h.axis}｜${h.event}｜${Number(h.pnl||0).toFixed(2)} KGEN</div>`).join(''):'尚無成交歷史'}</div>`;case'assets':{const locked=Object.values(D.pos).filter(Boolean).reduce((s,p)=>s+p.margin,0);return `<div class="grid2"><div class="card"><h3>KGEN</h3>可用 ${D.kgen.toFixed(3)}<br>鎖定 ${locked.toFixed(3)}</div><div class="card"><h3>生活資產</h3>KAIOS ${D.kaios.toFixed(1)}<br>KUFO ${D.kufo}</div></div>`}case'records':return `<div class="grid2"><div class="card"><h3>交易統計</h3>平倉 ${stats.closed}<br>勝率 ${(stats.winRate*100).toFixed(1)}%<br>已實現 ${stats.realizedPnl.toFixed(2)} KGEN</div><div class="card"><h3>最佳 / 最差</h3>${stats.best.toFixed(2)} / ${stats.worst.toFixed(2)} KGEN</div></div>`;case'market':return `<div class="grid2">${['KX','KY','KZ'].map(a=>`<button class="card" data-market-axis="${a}"><h3>${a}</h3>${D.slots[a]}<br>${D.q[D.slots[a]]?fmt(D.q[D.slots[a]]):'--'}</button>`).join('')}</div>`;case'bag':return `<div class="inventory">${D.inventory.map(i=>`<div class="item"><b>${i.icon}</b>${i.name}<div>×${i.qty}</div><button class="btn" data-item="${i.id}">${i.type==='CONSUMABLE'?'使用':'查看'}</button></div>`).join('')}</div>`;case'character':return `<div class="grid2"><div class="card"><h3>角色生命</h3>樂天帝<br>HP ${D.hp}/100<br>XYZ ${D.xyz.x.toFixed(1)},${D.xyz.y.toFixed(1)},${D.xyz.z.toFixed(1)}</div><div class="card"><h3>操作</h3><button class="btn" id="healDemo">使用生命藥水</button></div></div>`;case'worldmap':return `<div class="worldMap">${Object.entries(DESTINATIONS).map(([k,d])=>`<button class="poi" data-dest="${k}"><b>${d.name}</b><br>X ${d.x} · Z ${d.z}</button>`).join('')}</div>`;case'atm':return `<div class="grid2"><div class="card"><h3>ATM / 換鈔</h3>KGEN ${D.kgen.toFixed(3)}<br>KAIOS ${D.kaios.toFixed(1)}<br><button class="btn" id="simExchange">LOCAL：1 KGEN → 10 KAIOS</button></div><div class="card"><h3>邊界</h3>只改本機 OFFCHAIN GAME STATE。</div></div>`;case'settings':return `<div class="card"><h3>系統設定</h3><label>音樂 <input id="musicRange" type="range" min="0" max="100" value="${D.settings.music}"></label><br><label>鏡頭 <input id="cameraRange" type="range" min="10" max="100" value="${D.settings.camera}"></label><br><button class="btn" id="resetUi">重設本機 UI 狀態</button></div>`;case'help':return `<div class="card"><h3>AI / 幫助</h3><p>左搖桿前後走路、左右旋轉；0C 可正常步行。右側拖曳轉鏡頭。Y 控制高度，C 只加速。</p><p>打怪距離 ${WORLD_RULES.meleeRange}m；只有死亡才領 KAIOS。KX/KY/KZ 只用 KGEN。</p></div>`;default:return'<div class="muted">器官內容不可用</div>'}}
function bindDynamic(id){$('#tradeToggleInside')?.addEventListener('click',toggleTrade);document.querySelectorAll('[data-close-axis]').forEach(b=>b.addEventListener('click',()=>{closeAxis(b.dataset.closeAxis);openOrgan('positions')}));document.querySelectorAll('[data-cancel-order]').forEach(b=>b.addEventListener('click',()=>{D.orders=D.orders.filter(o=>o.id!==b.dataset.cancelOrder);log(`取消委託 ${b.dataset.cancelOrder}`);openOrgan('orders')}));document.querySelectorAll('[data-market-axis]').forEach(b=>b.addEventListener('click',()=>{D.axis=b.dataset.marketAxis;closeOrgan();hud()}));document.querySelectorAll('[data-item]').forEach(b=>b.addEventListener('click',()=>useItem(b.dataset.item)));document.querySelectorAll('[data-dest]').forEach(b=>b.addEventListener('click',()=>gotoDestination(b.dataset.dest)));$('#simExchange')?.addEventListener('click',()=>{const r=exchangeLocal(D,1,10);log(r.ok?'LOCAL 換鈔完成':'KGEN不足');hud();openOrgan('atm')});$('#musicRange')?.addEventListener('input',e=>{D.settings.music=+e.target.value;save()});$('#cameraRange')?.addEventListener('input',e=>{D.settings.camera=+e.target.value;save()});$('#resetUi')?.addEventListener('click',()=>{localStorage.removeItem('k11520-mother-v2');location.reload()});$('#healDemo')?.addEventListener('click',()=>useItem('POTION-001'))}
function useItem(id){const r=useInventoryItem(D.inventory,id,D.hp);if(r.ok){D.hp=r.hp;log(`使用 ${r.item.name}｜HP ${D.hp}`)}else log(`道具操作：${r.reason}`);hud();openOrgan('bag')}
function gotoDestination(k){const d=DESTINATIONS[k];if(!d)return;const r=resolvePlayerMove(D.xyz,{x:d.x,y:D.xyz.y,z:d.z});if(r.blocked){log(`目的地被 ${r.blocker?.name||'物件'} 阻擋`);return}D.xyz={x:r.x,y:r.y,z:r.z};D.heading=0;log(`導航到 ${d.name}`);closeOrgan();hud()}
function setMode(m){D.mode=m;const f=m==='5d';$('#three').style.display=f?'block':'none';$('#lookPad').style.display=f?'block':'none';$('#map').style.display=f?'none':'grid';$('#map').innerHTML=f?'':'<div style="margin:auto;text-align:center"><h2>地址 / 導航層</h2><p>真實地圖不是戰鬥幾何。</p></div>';$('#modeBtn').textContent=f?'5D':'MAP';save()}
function toggleTrade(){D.tradeOpen=!D.tradeOpen;$('#tradeControls').classList.toggle('open',D.tradeOpen);$('#tradeSword').classList.toggle('arm',D.tradeOpen);log(D.tradeOpen?'交易控制展開':'交易控制收合');save()}
function preview(){const r=previewOrder({axis:D.axis,symbol:D.slots[D.axis],fire:D.fire,leverage:D.leverage,price:D.q[D.slots[D.axis]],kgen:D.kgen,hasPosition:!!D.pos[D.axis]});if(!r.ok){log(`不能建立訂單：${r.reason}`);return}pending=r.order;$('#confirmBody').innerHTML=`<div class="grid2"><div class="card"><h3>${pending.axis} ${pending.symbol}</h3>${pending.side} ${pending.lots}口 · L${pending.L}</div><div class="card"><h3>保證金</h3>${pending.im.toFixed(4)} KGEN<br>維持 ${pending.mm.toFixed(4)}</div></div>`;$('#confirm').classList.add('open')}
function cancel(){pending=null;$('#confirm').classList.remove('open')}function execute(){if(!pending)return;const r=executeOrder(D,pending);if(!r.ok){log(`下單失敗：${r.reason}`);return}log(`${pending.axis} ${pending.side}${pending.lots}口已成交`);D.fire=0;cancel();hud()}
function closeAxis(axis){const p=D.pos[axis];const r=closePosition(D,axis,p?D.q[p.symbol]:0);log(r.ok?`${axis} 平倉 PnL ${r.pnl.toFixed(2)} KGEN`:'目前空倉');hud()}
function attack(damage,label){const r=playerAttack(world,D.xyz,damage,Date.now());if(!r.hit){log(`${label} MISS · ${Number.isFinite(r.distance)?r.distance.toFixed(1):'--'}m`);return}if(r.defeated){D.kaios+=r.rewardKaios;log(`${label} 擊殺 ${r.target.name} +${r.rewardKaios} KAIOS`)}else log(`${label} 命中 ${r.target.name} · KAIOS +0`);hud()}
function battle(){attack(24,'普通攻擊')}function skill(){if(D.kaios<2){log('KAIOS不足');return}D.kaios-=2;attack(48,'技能攻擊')}function dodge(){D.heading+=Math.PI*.35;log('閃避 / 轉向完成');hud()}
function move(){if(D.mode!=='5d')return;const step=movementStep({forward:jv.forward,turn:jv.turn,heading:D.heading,warp:D.warp});D.heading=step.heading;let nx=D.xyz.x+step.dx,ny=D.xyz.y,nz=D.xyz.z+step.dz;if(Math.abs(yv)>.01)ny+=yv*.025;const before={...D.xyz},next=resolvePlayerMove(before,{x:nx,y:ny,z:nz});lastBlocked=next.blocked;lastBlocker=next.blocker;if(!next.blocked){D.xyz={x:next.x,y:next.y,z:next.z};D.travel+=distance2D(before,next)}hud()}
function tickGameplay(){const r=tickWorld(world,D.xyz,Date.now());for(const e of r.events){const m=world.monsters.find(x=>x.id===e.monsterId);if(e.type==='PLAYER_HIT'){D.hp=Math.max(0,D.hp-e.damage);log(`${m?.name||e.monsterId} 反擊 -${e.damage} HP`)}if(e.type==='RESPAWN')log(`${m?.name||e.monsterId} 8秒重生`)}hud()}
function joySet(e){const r=$('#joy').getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=42,l=Math.hypot(x,y)||1,k=Math.min(1,m/l),dx=x*k,dy=y*k;jv={turn:dx/m,forward:-dy/m};$('#knob').style.transform=`translate(${dx}px,${dy}px)`}
$('#joy').addEventListener('pointerdown',e=>{joy=true;$('#joy').setPointerCapture(e.pointerId);joySet(e)});$('#joy').addEventListener('pointermove',e=>joy&&joySet(e));for(const ev of ['pointerup','pointercancel'])$('#joy').addEventListener(ev,()=>{joy=false;jv={turn:0,forward:0};$('#knob').style.transform='none'});
function sliderBipolar(el,e){const r=el.getBoundingClientRect(),v=Math.max(-1,Math.min(1,-((e.clientY-(r.top+r.height/2))/(r.height/2))));return v}function sliderUni(el,e){const r=el.getBoundingClientRect();return Math.max(0,Math.min(1,(r.bottom-e.clientY)/r.height))}
for(const [id,fn] of [['yControl',v=>yv=verticalY(v,{fineMax:1,max:10})],['warpControl',v=>D.warp=warpC(v)],['fireControl',v=>D.fire=fireLots(v)],['levControl',v=>D.leverage=leverageL(v)]]){const el=$('#'+id);let active=false;el.addEventListener('pointerdown',e=>{active=true;el.setPointerCapture(e.pointerId);const v=(id==='yControl'||id==='fireControl')?sliderBipolar(el,e):sliderUni(el,e);fn(v);hud()});el.addEventListener('pointermove',e=>{if(!active)return;const v=(id==='yControl'||id==='fireControl')?sliderBipolar(el,e):sliderUni(el,e);fn(v);hud()});for(const ev of ['pointerup','pointercancel'])el.addEventListener(ev,()=>{active=false;if(id==='yControl')yv=0})}
$('#lookPad').addEventListener('pointerdown',e=>{drag=true;last=e.clientX;$('#lookPad').setPointerCapture(e.pointerId)});$('#lookPad').addEventListener('pointermove',e=>{if(!drag)return;D.camYaw-=(e.clientX-last)*(.003+D.settings.camera/10000);last=e.clientX});for(const ev of ['pointerup','pointercancel'])$('#lookPad').addEventListener(ev,()=>drag=false);
$('#toolToggle').addEventListener('click',()=>$('#toolDock').classList.toggle('open'));$('#organClose').addEventListener('click',closeOrgan);$('#tradeSword').addEventListener('click',toggleTrade);$('#orderFire').addEventListener('click',preview);$('#confirmOrder').addEventListener('click',execute);$('#cancelOrder').addEventListener('click',cancel);$('#cancelX').addEventListener('click',cancel);$('#flat').addEventListener('click',()=>closeAxis(D.axis));$('#attack').addEventListener('click',battle);$('#skill').addEventListener('click',skill);$('#dodge').addEventListener('click',dodge);$('#modeBtn').addEventListener('click',()=>setMode(D.mode==='5d'?'map':'5d'));$('#profileBtn').addEventListener('click',()=>openOrgan('character'));$('#enterBtn').addEventListener('click',()=>{$('#guide').classList.add('hide');log('進入 11520')});
const renderer=new THREE.WebGLRenderer({canvas:$('#three'),antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setClearColor(0x86b4cf,1);const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x86a8b7,28,95);const camera=new THREE.PerspectiveCamera(50,1,.1,180);scene.add(new THREE.HemisphereLight(0xffffff,0x243c28,2.1));const sun=new THREE.DirectionalLight(0xfff5d6,2.4);sun.position.set(18,28,8);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(140,140),new THREE.MeshStandardMaterial({color:0x3d6841}));ground.rotation.x=-Math.PI/2;scene.add(ground);
function tree(x,z,s=1){const g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.12*s,.18*s,1.5*s,8),new THREE.MeshStandardMaterial({color:0x5b3d27})),cr=new THREE.Mesh(new THREE.ConeGeometry(.8*s,2.1*s,10),new THREE.MeshStandardMaterial({color:0x2e6d3e}));tr.position.y=.75*s;cr.position.y=2.2*s;g.add(tr,cr);g.position.set(x,0,z);scene.add(g)}for(let i=0;i<60;i++){const x=(i*19%100)-50,z=(i*31%100)-50;if(Math.abs(x)<5&&Math.abs(z)<8)continue;tree(x,z,.7+(i%5)*.08)}
for(const o of WORLD_OBJECTS){const b=new THREE.Mesh(new THREE.BoxGeometry(o.radius*1.4,2.6,o.radius*1.4),new THREE.MeshStandardMaterial({color:o.type==='ATM'?0x5dbdcb:0x8b653e}));b.position.set(o.x,1.3,o.z);scene.add(b)}
const hero=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.72,8,16),new THREE.MeshStandardMaterial({color:0x2e343a,metalness:.5})),head=new THREE.Mesh(new THREE.SphereGeometry(.23,20,14),new THREE.MeshStandardMaterial({color:0xd2a179}));body.position.y=1.14;head.position.y=1.82;hero.add(body,head);hero.scale.setScalar(.7);scene.add(hero);const monsterMeshes=new Map();for(const m of world.monsters){const mesh=new THREE.Mesh(m.species==='FIRE_WISP'?new THREE.IcosahedronGeometry(.55):new THREE.DodecahedronGeometry(.62),new THREE.MeshStandardMaterial({color:m.species==='FIRE_WISP'?0xff7d32:0x7e1f25}));scene.add(mesh);monsterMeshes.set(m.id,mesh)}
function resize(){renderer.setSize(innerWidth,innerHeight,true);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function render(){requestAnimationFrame(render);hero.position.set(D.xyz.x,D.xyz.y,D.xyz.z);hero.rotation.y=D.heading;for(const m of world.monsters){const mesh=monsterMeshes.get(m.id);mesh.visible=m.state!=='DEAD';mesh.position.set(m.x,.7,m.z)}const dist=7.8;camera.position.set(D.xyz.x+Math.sin(D.camYaw)*dist,D.xyz.y+4.1,D.xyz.z+Math.cos(D.camYaw)*dist);camera.lookAt(D.xyz.x,D.xyz.y+1.1,D.xyz.z);renderer.render(scene,camera)}
load();initMenus();axes();renderLog();setMode(D.mode||'5d');hud();quotes();render();setInterval(quotes,5000);setInterval(move,50);setInterval(tickGameplay,100);log('11520 完整器官驅動版載入');
