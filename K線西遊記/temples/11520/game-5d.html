ition:fixed;z-index:510;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;text-shadow:0 3px 15px #000}.price{font-size:clamp(30px,8vw,54px);font-weight:900}.rail{position:fixed;z-index:610;right:7px;top:50%;width:48px;padding:4px;border-radius:17px;display:grid;gap:4px}.rail button{height:40px;border:0;border-radius:11px;background:#ffffff08;font-size:15px}.rail small{display:block;font-size:6px}.joy{position:fixed;z-index:530;left:28px;bottom:20px;width:138px;height:138px;border:2px solid #64eaff55;border-radius:50%;background:#07121dcc;touch-action:none}.knob{position:absolute;left:42px;top:42px;width:54px;height:54px;border:2px solid var(--c);border-radius:50%;background:#16405ddd}.actions{position:fixed;z-index:530;right:55px;bottom:12px;width:185px;height:175px}.a{position:absolute;border-radius:50%;border:1px solid var(--l);background:#07121ddd;font-weight:900}.long{width:72px;height:72px;right:0;bottom:0;color:var(--u)}.short{width:62px;height:62px;right:78px;bottom:0;color:var(--d)}.flat{width:44px;height:44px;right:100px;bottom:68px;color:var(--gold)}.fight{width:72px;height:72px;left:0;bottom:90px;color:#ffb86b}.sheet{position:fixed;z-index:800;left:7px;right:57px;bottom:9px;max-height:72vh;overflow:auto;padding:12px;border-radius:20px;background:#040b16fa;transform:translateY(120%);visibility:hidden;transition:.18s}.sheet.open{transform:none;visibility:visible}.head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-12px;background:#040b16fa;padding:4px 0 8px}.x,.btn{border:1px solid var(--l);background:#102033;border-radius:12px;padding:10px}.x{width:42px;height:42px;border-radius:50%}.btn{width:100%;margin-top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tiny{font-size:9px;color:#9bb4c3;line-height:1.5}.guide{position:fixed;z-index:1100;inset:0;background:radial-gradient(circle at 50% 30%,#12334d,#02040bf5 65%);display:grid;place-items:center;padding:16px}.guide.hide{display:none}.guideCard{width:min(480px,100%);text-align:center}.guideFace{width:116px;height:116px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:70px;background:radial-gradient(circle,#173f59,#07121d);border:2px solid var(--c);box-shadow:0 0 35px #64eaff66;animation:breathe 2.5s infinite}@keyframes breathe{50%{transform:scale(1.04);box-shadow:0 0 55px #64eaff88}}.bubble{margin:14px 0;padding:14px;border-radius:18px;text-align:left;font-size:14px;line-height:1.6}.choices{display:grid;gap:8px}.choices button{padding:12px;border:1px solid var(--l);border-radius:14px;background:#0b1c2b}.guideInput{width:100%;padding:12px;border-radius:12px;border:1px solid var(--l);background:#081522;margin-bottom:8px}.avatarDock{position:fixed;z-index:505;left:50%;bottom:170px;transform:translateX(-50%);text-align:center}.avatar{font-size:64px;filter:drop-shadow(0 8px 12px #000);transition:.2s}.avatarName{font-size:8px;background:#07121dcc;border-radius:8px;padding:2px 6px}.mapAvatar{font-size:35px;line-height:38px;filter:drop-shadow(0 4px 6px #000);transform-origin:50% 55%}.sound{position:fixed;z-index:620;right:55px;top:8px}.life{position:fixed;z-index:520;right:58px;top:154px;padding:7px;border-radius:12px;font-size:8px}.bar{height:5px;width:110px;background:#223;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--u)}@media(max-width:390px){.joy{left:18px;bottom:16px}.actions{right:49px;transform:scale(.92);transform-origin:right bottom}.tele{max-width:180px}}</style><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script></head><body><div id="map"></div><div id="world"></div><header class="top glass"><button class="round" id="home">⌂</button><div class="brand"><b>11520 花果山宇宙萬物交易所</b><small>1 指數點 = 1 KGEN 結算｜KAIOS 生活｜KUFO 長效能源</small></div><button class="round" id="mode">🗺️</button><button class="round" id="profile">👤</button></header><button class="round sound" id="sound">🔊</button><section class="axes" id="axes"></section><div class="tele glass"><span>我的世界位置</span><b id="xyz">X 0 · Y 0 · Z 0</b><div id="gps">GPS 等待授權</div><div id="walk">步行 0 m</div><b id="cash">KGEN 10 · KAIOS 1000 · KUFO 1</b><span id="feed">行情同步中</span></div><div class="life glass"><b>生命 HP <span id="hp">100</span></b><div class="bar"><i id="hpbar" style="width:100%"></i></div><span id="monster">附近怪物搜尋中</span></div><div class="center"><div id="pair">KX · BTC/USDT</div><div class="price" id="price">--</div><small id="modeText">GPS 遊戲地圖｜交易 PnL 用 KGEN</small></div><div class="avatarDock"><div class="avatar" id="avatar">🧙‍♀️</div><span class="avatarName" id="avatarName">旅人</span></div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="actions"><button class="a fight" id="fight">⚔️<br>打怪</button><button class="a flat" id="flat">平</button><button class="a short" id="short">空 KX</button><button class="a long" id="long">多 KX</button></div><nav class="rail glass"><button id="gpsBtn">🗺️<small>地圖</small></button><button id="navBtn">🧭<small>Google</small></button><button id="buildBtn">🏗️<small>建設</small></button><button id="atmBtn">🛸<small>ATM</small></button><button id="lifeBtn">🍜<small>生活</small></button><button id="helpBtn">✨<small>AI</small></button><button id="dressBtn">👗<small>角色</small></button></nav><section class="sheet" id="sheet"><div class="head"><b id="title">功能</b><button class="x" id="close">×</button></div><div id="body"></div></section><section class="guide" id="guide"><div class="guideCard"><div class="guideFace" id="guideFace">🧚‍♀️</div><div class="bubble glass" id="bubble">嗨，我是花果山引路人。這次不用填表，我陪你一步一步開始。</div><div class="choices" id="choices"><button data-go="hello">👋 好，帶我進去</button><button data-go="mute">🔇 先不要語音</button></div></div></section><script>const $=s=>document.querySelector(s);const M=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT','LTCUSDT'];const S={axis:'KX',slots:{KX:M[0],KY:M[1],KZ:M[2]},q:{},kgen:10,kaios:1000,kufo:1,pos:{KX:null,KY:null,KZ:null},xyz:{x:0,y:0,z:0},gps:null,gamePos:null,walk:0,hp:100,mode:'gps',voice:true,name:'旅人',birth:'',origin:'',avatar:'🧙‍♀️',outfit:'冒險裝',storyDone:false,monsters:[],heading:0};let map,marker,watch,lastGps=null,joyOn=false,joyV={x:0,y:0};function save(){const c={...S,monsters:[]};localStorage.setItem('k11520-life',JSON.stringify(c))}function load(){try{Object.assign(S,JSON.parse(localStorage.getItem('k11520-life')||'{}'))}catch{}}function speak(t){if(S.voice&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.92;speechSynthesis.speak(u)}}function say(t){$('#bubble').textContent=t;speak(t)}function initMap(){map=L.map('map',{zoomControl:false}).setView([23.7,121],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}function icon(){return L.divIcon({html:`<div class="mapAvatar" style="transform:rotate(${S.heading}deg)">${S.avatar}</div>`,className:'',iconSize:[40,40],iconAnchor:[20,20]})}function setMarker(p,center=false){if(!marker)marker=L.marker(p,{icon:icon()}).addTo(map);else{marker.setLatLng(p);marker.setIcon(icon())}if(center)map.setView(p,18)}function locate(){if(!navigator.geolocation){alert('此裝置不支援 GPS');return}watch=navigator.geolocation.watchPosition(p=>{const n=[p.coords.latitude,p.coords.longitude];S.gps=n;if(!S.gamePos)S.gamePos=[...n];$('#gps').textContent=`GPS ${n[0].toFixed(5)}, ${n[1].toFixed(5)} ±${Math.round(p.coords.accuracy)}m`;if(lastGps){const d=map.distance(lastGps,n);if(d<100)S.walk+=d}lastGps=n;if(!joyOn){S.gamePos=[...n];setMarker(S.gamePos,true)}spawn();hud()},e=>{$('#gps').textContent='GPS 未授權：'+e.message},{enableHighAccuracy:true,maximumAge:3000,timeout:10000})}function spawn(){if(!S.gamePos||S.monsters.length)return;['👹','🦂','🐲','👾'].forEach((emo,i)=>{const a=(i+1)*1.65,d=.00035+i*.00012,lat=S.gamePos[0]+Math.sin(a)*d,lng=S.gamePos[1]+Math.cos(a)*d,m={emo,hp:60+i*20,lat,lng};m.mk=L.marker([lat,lng],{icon:L.divIcon({html:`<div style="font-size:30px">${emo}</div>`,className:''})}).addTo(map);S.monsters.push(m)})}function hit(){if(!S.monsters.length){alert('附近還沒有怪物');return}const m=S.monsters[0],me=S.gamePos||S.gps,dist=me?map.distance(me,[m.lat,m.lng]):999;if(dist>60){alert(`怪物還有 ${Math.round(dist)}m，走近一點`);return}m.hp-=25;if(m.hp<=0){map.removeLayer(m.mk);S.monsters.shift();S.kaios+=3;alert('擊敗怪物！獲得 3 KAIOS 生活獎勵')}else S.hp=Math.max(0,S.hp-8);hud()}function axes(){$('#axes').innerHTML=['KX','KY','KZ'].map(a=>{const p=S.pos[a];return`<div class="axis glass"><small>${a} 球膜軸</small><select data-a="${a}">${M.map(m=>`<option ${S.slots[a]===m?'selected':''}>${m.replace('USDT','/USDT')}</option>`).join('')}</select><b id="q${a}">--</b><small id="p${a}">${p?`${p.side} · ${p.margin} KGEN`:'空倉'}</small><div class="hpMini"><i id="h${a}" style="width:${p?Math.max(0,Math.min(100,100+pnl(p)/Math.max(.0001,p.margin)*100)):100}%"></i></div></div>`}).join('');document.querySelectorAll('[data-a]').forEach(x=>x.onchange=()=>{const a=x.dataset.a;S.slots[a]=x.value.replace('/','');S.axis=a;hud()})}async function quotes(){try{const r=await fetch('https://api.binance.com/api/v3/ticker/price');const j=await r.json();j.forEach(x=>{if(M.includes(x.symbol))S.q[x.symbol]=+x.price});$('#feed').textContent='行情 LIVE'}catch{$('#feed').textContent='行情暫停'}hud()}function pnl(p){const now=S.q[p.symbol]||p.entry;return(now-p.entry)*(p.side==='多'?1:-1)*p.warp}function trade(side){const a=S.axis,s=S.slots[a],px=S.q[s];if(!px)return alert('行情尚未就緒');if(S.pos[a])return alert(`${a} 已有一張倉位，先平倉`);const margin=Math.min(1,S.kgen);if(margin<=0)return alert('KGEN 不足');S.pos[a]={symbol:s,side,entry:px,margin,warp:1};hud()}function closePos(){const p=S.pos[S.axis];if(!p)return;const r=pnl(p);S.kgen+=r;S.pos[S.axis]=null;alert(`結算 ${r>=0?'+':''}${r.toFixed(4)} KGEN\n規則：1 指數點 = 1 KGEN`);hud()}function hud(){axes();['KX','KY','KZ'].forEach(a=>{const q=$('#q'+a);if(q)q.textContent=S.q[S.slots[a]]?fmt(S.q[S.slots[a]]):'--'});$('#pair').textContent=`${S.axis} · ${S.slots[S.axis].replace('USDT','/USDT')}`;$('#price').textContent=S.q[S.slots[S.axis]]?fmt(S.q[S.slots[S.axis]]):'--';$('#xyz').textContent=`X ${S.xyz.x.toFixed(1)} · Y ${S.xyz.y.toFixed(1)} · Z ${S.xyz.z.toFixed(1)}`;$('#walk').textContent=`步行 ${Math.round(S.walk)} m · 約 ${Math.round(S.walk/.72)} 步`;$('#cash').textContent=`KGEN ${S.kgen.toFixed(4)} · KAIOS ${S.kaios.toFixed(1)} · KUFO ${S.kufo.toFixed(2)}`;$('#hp').textContent=S.hp;$('#hpbar').style.width=S.hp+'%';$('#avatar').textContent=S.avatar;$('#avatarName').textContent=S.name;$('#monster').textContent=S.monsters[0]?`${S.monsters[0].emo} 怪物 HP ${S.monsters[0].hp}`:'附近怪物搜尋中';$('#long').textContent='多 '+S.axis;$('#short').textContent='空 '+S.axis;save()}function fmt(v){return '$'+v.toLocaleString(undefined,{maximumFractionDigits:v>10?2:6})}function openPanel(t,h){$('#title').textContent=t;$('#body').innerHTML=h;$('#sheet').classList.add('open')}function closePanel(){ $('#sheet').classList.remove('open') }$('#close').onclick=closePanel;$('#profile').onclick=()=>openPanel('玩家生命',`<div class="tiny">${S.name}<br>生日 ${S.birth||'未設定'}<br>起家地 ${S.origin||'未設定'}<br>裝扮 ${S.outfit}</div><button class="btn" id="replay">🎬 重新體驗出生故事</button>`);$('#body').addEventListener('click',e=>{if(e.target.id==='replay'){closePanel();startStory(true)}if(e.target.dataset.av){S.avatar=e.target.dataset.av;S.outfit=e.target.dataset.outfit||'冒險裝';setMarker(S.gamePos||S.gps||[23.7,121]);hud()}});$('#dressBtn').onclick=()=>openPanel('角色與裝扮',`<div class="row"><button class="btn" data-av="🧙‍♀️" data-outfit="女冒險者">🧙‍♀️ 女冒險者</button><button class="btn" data-av="🧙‍♂️" data-outfit="男冒險者">🧙‍♂️ 男冒險者</button><button class="btn" data-av="🥷" data-outfit="忍者裝">🥷 忍者</button><button class="btn" data-av="🧑‍🚀" data-outfit="宇航裝">🧑‍🚀 宇航員</button></div><div class="tiny">之後可接回免費 GLTF 角色與服裝骨骼，目前先保持手機穩定。</div>`);$('#gpsBtn').onclick=()=>{S.mode='gps';$('#map').style.display='block';$('#world').style.display='none';$('#modeText').textContent='GPS 遊戲地圖｜搖桿可自由探索';if(S.gamePos)setMarker(S.gamePos,true)};$('#mode').onclick=()=>{if(S.mode==='gps'){S.mode='world';$('#map').style.display='none';$('#world').style.display='block';$('#modeText').textContent='3D 宇宙模式｜搖桿控制 XYZ'}else $('#gpsBtn').click()};$('#navBtn').onclick=()=>openPanel('Google 導航',`<div class="tiny">目前遊戲疊圖使用可自由放角色與怪物的 GPS 地圖。Google Maps 真正導航由按鈕開啟；若未來提供 Google Maps Platform API key，可把同一套角色/怪物 overlay 搬到 Google 地圖。</div><button class="btn" id="gm">🧭 開啟 Google Maps 導航</button>`);$('#body').addEventListener('click',e=>{if(e.target.id==='gm'){const p=S.gamePos||S.gps;window.open(p?`https://www.google.com/maps/dir/?api=1&destination=${p[0]},${p[1]}`:'https://www.google.com/maps','_blank')}});$('#buildBtn').onclick=()=>openPanel('建設',`<button class="btn">🏠 建房子</button><button class="btn">🏬 建商場</button><button class="btn">🏭 建工廠</button><div class="tiny">目前仍為本機沙盒建設，不代表鏈上土地權利。</div>`);$('#atmBtn').onclick=()=>openPanel('固定 ATM ＋ 行動飛碟 ATM',`<div class="tiny">KGEN 是交易結算資產；KAIOS 是生活貨幣。ATM 負責兩者換鈔，行動飛碟可移動與自主報價。真資產仍 fail-closed。</div><button class="btn" id="k2a">1 KGEN → 1000 KAIOS（沙盒）</button><button class="btn" id="a2k">1000 KAIOS → 1 KGEN（沙盒）</button>`);$('#body').addEventListener('click',e=>{if(e.target.id==='k2a'&&S.kgen>=1){S.kgen-=1;S.kaios+=1000;hud()}if(e.target.id==='a2k'&&S.kaios>=1000){S.kaios-=1000;S.kgen+=1;hud()}});$('#lifeBtn').onclick=()=>openPanel('生活與能量',`<div class="tiny">KAIOS：吃飯、寵物飼料、日常生活費。<br>KUFO：長效仙丹／曲速能源，適合不想天天補充時使用。<br>目前消耗規則仍是遊戲沙盒。</div><button class="btn" id="eat">🍜 吃飯 −1 KAIOS</button><button class="btn" id="pet">🐾 餵寵物 −1 KAIOS</button><button class="btn" id="pill">💊 吃 KUFO 仙丹 −0.01 KUFO</button>`);$('#body').addEventListener('click',e=>{if(e.target.id==='eat'&&S.kaios>=1){S.kaios-=1;S.hp=Math.min(100,S.hp+8);hud()}if(e.target.id==='pet'&&S.kaios>=1){S.kaios-=1;hud()}if(e.target.id==='pill'&&S.kufo>=.01){S.kufo-=.01;S.hp=100;hud()}});$('#helpBtn').onclick=()=>openPanel('AI 引路人',`<div class="tiny">我會陪你認識地圖、打怪、ATM、KX/KY/KZ 與生活系統。</div><button class="btn" id="helloAI">🔊 語音說明現在玩法</button><button class="btn" id="replay2">🎬 重播出生故事</button>`);$('#body').addEventListener('click',e=>{if(e.target.id==='helloAI')speak('現在交易輸贏用 KGEN 結算，生活用 KAIOS，長效能源用 KUFO。左下搖桿在地圖與三維世界都可以移動。');if(e.target.id==='replay2'){closePanel();startStory(true)}});$('#sound').onclick=()=>{S.voice=!S.voice;$('#sound').textContent=S.voice?'🔊':'🔇';if(!S.voice&&'speechSynthesis'in window)speechSynthesis.cancel();save()};$('#fight').onclick=hit;$('#long').onclick=()=>trade('多');$('#short').onclick=()=>trade('空');$('#flat').onclick=closePos;const joy=$('#joy'),knob=$('#knob');function moveJoy(e){const r=joy.getBoundingClientRect(),p=e.touches?e.touches[0]:e,dx=p.clientX-(r.left+r.width/2),dy=p.clientY-(r.top+r.height/2),m=Math.min(1,Math.hypot(dx,dy)/55),ang=Math.atan2(dy,dx);joyV={x:Math.cos(ang)*m,y:Math.sin(ang)*m};knob.style.left=(42+joyV.x*42)+'px';knob.style.top=(42+joyV.y*42)+'px';S.heading=(Math.atan2(joyV.x,-joyV.y)*180/Math.PI+360)%360;if(marker)marker.setIcon(icon())}joy.onpointerdown=e=>{joyOn=true;joy.setPointerCapture(e.pointerId);moveJoy(e)};joy.onpointermove=e=>{if(joyOn)moveJoy(e)};joy.onpointerup=joy.onpointercancel=()=>{joyOn=false;joyV={x:0,y:0};knob.style.left='42px';knob.style.top='42px'};function loop(){if(joyOn){const speed=.7;if(S.mode==='gps'&&(S.gamePos||S.gps)){if(!S.gamePos)S.gamePos=[...(S.gps||[23.7,121])];const latStep=-joyV.y*0.0000025*speed,lngStep=joyV.x*0.0000025*speed/Math.max(.2,Math.cos(S.gamePos[0]*Math.PI/180));S.gamePos[0]+=latStep;S.gamePos[1]+=lngStep;setMarker(S.gamePos);map.panTo(S.gamePos,{animate:false});S.walk+=Math.hypot(joyV.x,joyV.y)*.12}else{S.xyz.x+=joyV.x*.12;S.xyz.z+=-joyV.y*.12}hud()}requestAnimationFrame(loop)}function startStory(replay=false){$('#guide').classList.remove('hide');$('#choices').innerHTML='<button data-go="hello">👋 好，帶我進去</button><button data-go="mute">🔇 先不要語音</button>';say(replay?'歡迎回來。這次我們重新走一次你的出生故事，但不會清掉你的資產和遊戲進度。':'嗨，我是花果山引路人。第一次來不用填一大張表，我陪你慢慢開始。')}$('#choices').onclick=e=>{const g=e.target.dataset.go;if(!g)return;if(g==='mute'){S.voice=false;$('#sound').textContent='🔇';greeting()}if(g==='hello')greeting();if(g==='gps'){locate();finishStory()}if(g==='nogps')finishStory();if(g&&g.startsWith('av:')){S.avatar=g.slice(3);birthStep()}};function greeting(){say('先告訴我，我怎麼稱呼你？');$('#choices').innerHTML='<input class="guideInput" id="nameInput" placeholder="你的稱呼"><button id="nameNext">下一步</button>';$('#nameNext').onclick=()=>{S.name=$('#nameInput').value.trim()||S.name;say(`${S.name}，很高興認識你。先選一個你喜歡的角色，之後還能再換。`);$('#choices').innerHTML='<button data-go="av:🧙‍♀️">🧙‍♀️ 女冒險者</button><button data-go="av:🧙‍♂️">🧙‍♂️ 男冒險者</button><button data-go="av:🥷">🥷 忍者</button><button data-go="av:🧑‍🚀">🧑‍🚀 宇航員</button>'}}function birthStep(){say('接下來是出生日期。慢慢來，這只是保存在你的裝置。');$('#choices').innerHTML='<input class="guideInput" id="birthInput" type="date"><button id="birthNext">好了</button>';$('#birthNext').onclick=()=>{S.birth=$('#birthInput').value;say('最後，要不要讓地球 GPS 成為你的起家地？你也可以稍後再授權。');$('#choices').innerHTML='<button data-go="gps">📍 好，用 GPS 起家</button><button data-go="nogps">🏔️ 先從花果山開始</button>'}}function finishStory(){S.storyDone=true;S.origin=S.gps?'GPS 起家地':'11520 花果山';$('#guide').classList.add('hide');speak(`${S.name}，歡迎正式進入花果山。先四處走走，遇到怪物我會提醒你。`);hud()}load();initMap();axes();quotes();setInterval(quotes,3000);hud();loop();if(S.storyDone)$('#guide').classList.add('hide');else startStory();</script></body></html>
