<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>11520 花果山 V2.4 · 5D K線西遊記</title><style>:root{--bg:#05080d;--panel:#0d1720ee;--gold:#f1ca73;--cyan:#68e4ff;--muted:#9ca8b3;--ok:#65e798}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif}.panel{background:var(--panel);border:1px solid #f1ca7366;box-shadow:0 10px 30px #0009}.world{position:fixed;inset:0;background:radial-gradient(circle at 50% 22%,#15344c 0,#071018 45%,#020509 100%)}.grid{position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(#17384a22 1px,transparent 1px),linear-gradient(90deg,#17384a22 1px,transparent 1px);background-size:34px 34px;transform:perspective(280px) rotateX(56deg);transform-origin:bottom center}.top{position:fixed;z-index:20;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px}.top b{color:var(--gold);font-size:16px}.top small{display:block;color:var(--muted);font-size:10px}.hud{position:fixed;z-index:20;left:8px;top:88px;border-radius:12px;padding:10px;font-size:13px;min-width:184px}.hud strong{color:var(--cyan)}.avatarWrap{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}.avatar{width:64px;height:96px;position:relative;transform-origin:50% 70%;transition:transform .08s}.head{position:absolute;left:19px;top:0;width:26px;height:26px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px #f1ca7355}.body{position:absolute;left:20px;top:27px;width:24px;height:42px;border-radius:10px;background:var(--cyan);box-shadow:0 0 18px #68e4ff44}.arrow{position:absolute;left:24px;top:-27px;font-size:22px}.joy{position:fixed;z-index:40;left:-28px;bottom:max(14px,env(safe-area-inset-bottom));width:170px;height:170px;touch-action:none;user-select:none}.plane{position:absolute;inset:0;border-radius:50%;border:2px solid #68e4ff99;background:#07141ddd;box-shadow:0 0 26px #00b7ff22}.plane:before,.plane:after{content:"";position:absolute;background:#68e4ff33}.plane:before{left:18px;right:18px;top:50%;height:1px}.plane:after{top:18px;bottom:18px;left:50%;width:1px}.lab{position:absolute;color:var(--cyan);font-weight:900;font-size:11px;pointer-events:none}.up{top:7px;left:50%;transform:translateX(-50%)}.dn{bottom:7px;left:50%;transform:translateX(-50%)}.lt{left:6px;top:50%;transform:translateY(-50%)}.rt{right:6px;top:50%;transform:translateY(-50%)}.knob{position:absolute;left:50%;top:50%;width:60px;height:60px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--cyan);background:#17445f;display:grid;place-items:center;font-weight:900;z-index:2;touch-action:none}.modeText{position:absolute;top:-20px;left:24px;right:-30px;color:var(--cyan);font-size:10px;text-align:center}.joy.y .plane,.joy.y .knob{border-color:var(--gold)}.joy.y .knob{background:#5a431d}.joy.y .modeText,.joy.y .lab{color:var(--gold)}.help{position:fixed;z-index:20;right:8px;bottom:18px;width:190px;padding:10px;border-radius:12px;font-size:11px;line-height:1.45}.help b{color:var(--gold)}.toast{position:fixed;z-index:100;left:50%;top:210px;transform:translateX(-50%);background:#07111bea;border:1px solid #68e4ff77;border-radius:10px;padding:8px 12px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}.badge{color:var(--ok);font-weight:800}@media(max-width:420px){.joy{left:-38px;width:158px;height:158px}.help{width:174px;font-size:10px}.top b{font-size:14px}.hud{font-size:12px;min-width:170px}}</style></head><body><div class="world"><div class="grid"></div></div><header class="top panel"><div><b>11520 花果山 V2.4<br>5D K線西遊記</b><small>Official Pages · Live Control Core</small></div><div style="text-align:right"><span class="badge">♥ ALIVE</span><small id="clock">--:--:--</small></div></header><section class="hud panel"><div id="xyz">X 0.0 · Y 0.0 · Z 0.0</div><div>控制：<strong id="mode">XZ MODE</strong></div><div>角色朝向：<span id="facing">Z+</span></div><div>Y 範圍：0 ~ 40</div></section><div class="avatarWrap"><div class="avatar" id="avatar"><div class="arrow">↑</div><div class="head"></div><div class="body"></div></div></div><div class="joy" id="joy"><div class="plane"></div><span class="lab up" id="up">Z+</span><span class="lab dn" id="dn">Z−</span><span class="lab lt" id="lt">X−</span><span class="lab rt" id="rt">X+</span><div class="knob" id="knob">K</div><div class="modeText" id="modeText">XZ MODE · 點中央 K 切換 Y</div></div><aside class="help panel"><b>全能遙桿</b><br>XZ：↑Z+ ↓Z− →X+ ←X−<br>點中央 K：切 Y MODE<br>Y MODE：按住約 0.5 秒後，上半 Y+、下半 Y−<br>再點 K：回 XZ</aside><div class="toast" id="toast"></div><script>(function(){var joy=document.getElementById('joy'),knob=document.getElementById('knob'),toast=document.getElementById('toast'),xyz=document.getElementById('xyz'),mode=document.getElementById('mode'),facing=document.getElementById('facing'),avatar=document.getElementById('avatar'),up=document.getElementById('up'),dn=document.getElementById('dn'),lt=document.getElementById('lt'),rt=document.getElementById('rt'),modeText=document.getElementById('modeText');var st={x:0,y:0,z:0,mode:'XZ',down:false,armed:false,timer:0,vx:0,vy:0,last:Date.now()};function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function say(t){toast.textContent=t;toast.className='toast show';clearTimeout(toast._t);toast._t=setTimeout(function(){toast.className='toast'},1100)}function setMode(m){st.mode=m;st.armed=false;clearTimeout(st.timer);joy.className=m==='Y'?'joy y':'joy';mode.textContent=m+' MODE';modeText.textContent=m==='Y'?'Y MODE · 按住 0.5 秒，上 Y+ / 下 Y−':'XZ MODE · 點中央 K 切換 Y';up.textContent=m==='Y'?'Y+':'Z+';dn.textContent=m==='Y'?'Y−':'Z−';lt.textContent=m==='Y'?'':'X−';rt.textContent=m==='Y'?'':'X+';say(m==='Y'?'Y 高度控制':'XZ 世界軸控制')}function toggleMode(e){if(e){e.preventDefault();e.stopPropagation()}setMode(st.mode==='XZ'?'Y':'XZ')}knob.addEventListener('pointerup',toggleMode);knob.addEventListener('click',function(e){if(e.detail===0)toggleMode(e)});function vec(e){var r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;return{x:clamp((e.clientX-cx)/(r.width*.36),-1,1),y:clamp((e.clientY-cy)/(r.height*.36),-1,1)}}function down(e){if(e.target===knob)return;st.down=true;var v=vec(e);st.vx=v.x;st.vy=v.y;if(st.mode==='Y'){st.armed=false;clearTimeout(st.timer);st.timer=setTimeout(function(){st.armed=true;say('Y 軸接管')},500)}try{joy.setPointerCapture&&joy.setPointerCapture(e.pointerId)}catch(_){}}function move(e){if(!st.down)return;var v=vec(e);st.vx=v.x;st.vy=v.y;knob.style.transform='translate(calc(-50% + '+(v.x*38)+'px),calc(-50% + '+(v.y*38)+'px))'}function release(){st.down=false;st.vx=st.vy=0;st.armed=false;clearTimeout(st.timer);knob.style.transform='translate(-50%,-50%)'}joy.addEventListener('pointerdown',down);joy.addEventListener('pointermove',move);joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);function tick(){var now=Date.now(),dt=Math.min(.05,(now-st.last)/1000);st.last=now;if(st.down){if(st.mode==='XZ'){st.x=clamp(st.x+st.vx*5*dt,-100,100);st.z=clamp(st.z-st.vy*5*dt,-100,100);if(Math.sqrt(st.vx*st.vx+st.vy*st.vy)>.15){var f,deg;if(Math.abs(st.vx)>Math.abs(st.vy)){f=st.vx>0?'X+':'X−';deg=st.vx>0?90:-90}else{f=st.vy<0?'Z+':'Z−';deg=st.vy<0?0:180}facing.textContent=f;avatar.style.transform='rotate('+deg+'deg)'}}else if(st.armed){st.y=clamp(st.y-st.vy*4*dt,0,40)}}xyz.textContent='X '+st.x.toFixed(1)+' · Y '+st.y.toFixed(1)+' · Z '+st.z.toFixed(1);requestAnimationFrame(tick)}requestAnimationFrame(tick);setInterval(function(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false})},1000);say('OFFICIAL CORE READY')})();</script></body></html>
