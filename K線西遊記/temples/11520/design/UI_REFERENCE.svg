  <rect x="270" y="230" width="560" height="470" rx="18" fill="#173a35" stroke="#5b8f72"/>
  <path d="M290 650 C390 520 430 580 520 430 C610 290 700 400 805 255" fill="none" stroke="#b28f61" stroke-width="34" opacity=".65"/>
