<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>11520 花果山 5D K 線西遊記 UI 施工母圖</title>
  <desc>Stable construction reference drawing. Version 1.0.0, revision 2026-09-03.1. Functional zoning mirrors GAME_UI_SPEC.md.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111c"/><stop offset="1" stop-color="#142331"/></linearGradient>
    <style>
      .frame{fill:url(#bg);stroke:#c89a3f;stroke-width:3}.panel{fill:#0b1722;stroke:#b88a36;stroke-width:2}.label{fill:#f1d28b;font-family:system-ui,sans-serif;font-size:22px;font-weight:700}.small{fill:#b8c7d0;font-family:system-ui,sans-serif;font-size:16px}.zone{fill:#ffffff08;stroke:#5f7280;stroke-width:1}.green{fill:#59d98d}.red{fill:#ff657f}.gold{fill:#e6b653}.cyan{fill:#67e8ff}
    </style>
