<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>11520 花果山 5D Playtest</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;z-index:5;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:none}.card{background:#07121ddd;border:1px solid #b88b45;border-radius:14px;padding:9px 12px;box-shadow:0 8px 22px #0008}.brand{flex:1}.brand b{color:#f4cd7d}.brand small{display:block;color:#aeb8c2}.stat{min-width:86px;text-align:center}.stat small{display:block;color:#aeb8c2}.info{position:fixed;z-index:5;left:10px;top:82px;max-width:250px;font-size:12px;pointer-events:none}.monster{position:fixed;z-index:5;right:10px;top:82px;max-width:230px;font-size:11px;pointer-events:none}.bar{height:7px;background:#27313a;border-radius:8px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#50e58c,#baf083)}#look{position:fixed;z-index:2;inset:0 0 150px 38%;touch-action:none}.joy{position:fixed;z-index:20;left:20px;bottom:max(28px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:#071821dd;border:2px solid #5bdcf3;box-shadow:0 8px 30px #0009;touch-action:none}.joy:after{content:'前後移動 · 左右旋轉';position:absolute;left:-18px;right:-18px;bottom:-20px;text-align:center;font-size:10px;color:#d7f7ff}.knob{position:absolute;left:39px;top:39px;width:52px;height:52px;border-radius:50%;background:#174b67;border:2px solid #6be6ff}.actions{position:fixed;z-index:25;right:18px;bottom:max(25px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,58px);gap:10px;align-items:end}.actions button{width:58px;height:58px;border-radius:50%;border:1px solid #b88b45;background:#0b1722e8;color:#fff;font-weight:800;font-size:12px;touch-action:manipulation}.actions .attack{width:72px;height:72px;margin-left:-14px;color:#ffc77e;font-size:16px}.actions .menu{border-radius:15px}.warp{position:fixed;z-index:25;right:18px;bottom:118px;width:190px;display:flex;gap:7px}.warp button{flex:1;border:1px solid #b88b45;border-radius:12px;background:#0b1722e8;color:#fff;padding:8px 5px;font-size:11px}.toast{position:fixed;z-index:30;left:50%;bottom:180px;transform:translateX(-50%);background:#07121eee;border:1px solid #b88b45;border-radius:12px;padding:8px 12px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}@media(max-width:520px){.brand small{font-size:9px}.stat{min-width:68px;font-size:12px}.info{top:78px}.monster{top:78px}.hud{font-size:12px}}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.166.1/build/three.module.js"}}</script></head><body><canvas id="c"></canvas><div id="look"></div><div class="hud"><div class="card brand"><b>11520 花果山 5D K線西遊記</b><small>3D PLAYTEST · 0C 正常步行</small></div><div class="card stat"><small>KAIOS</small><b id="kaios">1000</b></div></div><div class="card info"><b id="xyz">X 0.0 · Y 0.0 · Z 0.0</b><div>HP <span id="hp">100</span>/100 · C <span id="cv">0</span></div><div>左搖桿：前後走／左右轉身</div><div>右側拖曳：自由鏡頭</div></div><div class="card monster"><b>花果山巡守怪</b><div class="bar"><i id="mbar" style="width:100%"></i></div><div id="mh">120/120 · 巡守</div></div><div id="look"></div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="warp"><button data-c="0">0C 步行</button><button data-c="1">1C</button><button data-c="10">10C</button><button data-c="100">100C</button></div><div class="actions"><button id="skill">✦<br>技能</button><button class="attack" id="attack">⚔<br>打怪</button><button id="dodge">↯<br>閃避</button><button id="interact">◎<br>互動</button><button id="map">地圖</button><button class="menu" id="menu">☰</button></div><div class="toast" id="toast"></div><script type="module">import * as THREE from 'three';const $=s=>document.querySelector(s);const R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.outputColorSpace=THREE.SRGBColorSpace;const S=new THREE.Scene();S.background=new THREE.Color(0x8fc8e0);S.fog=new THREE.Fog(0x8fc8e0,28,95);const C=new THREE.PerspectiveCamera(55,1,.1,180);S.add(new THREE.HemisphereLight(0xe9f7ff,0x31512e,2.5));const sun=new THREE.DirectionalLight(0xfff0c8,3);sun.position.set(-18,28,12);sun.castShadow=true;S.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(130,130),new THREE.MeshStandardMaterial({color:0x477b46,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.8})}function tree(x,z,s=1){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(.13*s,.2*s,1.7*s,8),mat(0x6a4327));t.position.y=.85*s;g.add(t);for(let i=0;i<3;i++){const crown=new THREE.Mesh(new THREE.IcosahedronGeometry((.72-i*.08)*s,1),mat([0x2d7b43,0x3b8b4c,0x246638][i]));crown.position.set((i-1)*.22*s,(1.9+i*.35)*s,(i%2?.12:-.1)*s);g.add(crown)}g.position.set(x,0,z);S.add(g)}function flower(x,z,c){const stem=new THREE.Mesh(new THREE.CylinderGeometry(.015,.02,.28,5),mat(0x3d7b35));stem.position.set(x,.14,z);S.add(stem);const f=new THREE.Mesh(new THREE.SphereGeometry(.07,7,5),mat(c));f.position.set(x,.31,z);S.add(f)}for(let i=0;i<60;i++){const a=i*2.399,r=10+(i%9)*3.7;tree(Math.cos(a)*r,Math.sin(a)*r,.65+(i%4)*.12)}for(let i=0;i<130;i++){const a=i*1.71,r=5+(i%20)*1.8;flower(Math.cos(a)*r,Math.sin(a)*r,[0xffdf67,0xff7ea8,0xb794ff,0xffffff][i%4])}function house(x,z){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(5,3.2,4),mat(0xd8b57a));b.position.y=1.6;const roof=new THREE.Mesh(new THREE.ConeGeometry(4,2,4),mat(0x74362b));roof.position.y=4;roof.rotation.y=Math.PI/4;g.add(b,roof);g.position.set(x,0,z);S.add(g)}house(-8,-10);house(10,-15);const hero=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.9,8,16),mat(0x252a31));body.position.y=1.15;const armor=new THREE.Mesh(new THREE.BoxGeometry(.72,.72,.38),mat(0xb07b2c));armor.position.set(0,1.35,.12);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,18,14),mat(0xd6a27d));head.position.y=1.95;const staff=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,2.3,8),mat(0x9c6a25));staff.rotation.z=.25;staff.position.set(.48,1.25,0);hero.add(body,armor,head,staff);S.add(hero);const monster=new THREE.Group();const mb=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.65,7,12),mat(0x7d2724));mb.position.y=.95;const mh=new THREE.Mesh(new THREE.SphereGeometry(.32,14,10),mat(0xa94a2e));mh.position.y=1.65;monster.add(mb,mh);monster.position.set(0,0,-8);S.add(monster);let P={x:0,z:0,yaw:0,hp:100,kaios:1000,c:0},M={hp:120,max:120,dead:false,respawn:0,lastHit:0},joy=false,jx=0,jy=0,camYaw=0,look=false,lastX=0;function toast(t){$('#toast').textContent=t;$('#toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('on'),1400)}function setJoy(e){const r=$('#joy').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,max=43,d=Math.hypot(x,y)||1,k=Math.min(1,max/d),dx=x*k,dy=y*k;jx=dx/max;jy=dy/max;$('#knob').style.transform=`translate(${dx}px,${dy}px)`}function endJoy(){joy=false;jx=jy=0;$('#knob').style.transform='none'}$('#joy').addEventListener('pointerdown',e=>{e.preventDefault();joy=true;try{$('#joy').setPointerCapture(e.pointerId)}catch{}setJoy(e)});$('#joy').addEventListener('pointermove',e=>{if(joy){e.preventDefault();setJoy(e)}});$('#joy').addEventListener('pointerup',endJoy);$('#joy').addEventListener('pointercancel',endJoy);$('#look').addEventListener('pointerdown',e=>{look=true;lastX=e.clientX;try{$('#look').setPointerCapture(e.pointerId)}catch{}});$('#look').addEventListener('pointermove',e=>{if(!look)return;camYaw-=(e.clientX-lastX)*.006;lastX=e.clientX});$('#look').addEventListener('pointerup',()=>look=false);$('#look').addEventListener('pointercancel',()=>look=false);document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{P.c=+b.dataset.c;toast(P.c===0?'0C：正常步行':'曲速 '+P.c+'C')});function dist(){return Math.hypot(P.x-monster.position.x,P.z-monster.position.z)}function hit(dmg){if(M.dead)return toast('怪物重生中');const d=dist();if(d>2.2)return toast('距離 '+d.toFixed(1)+'m：太遠');M.hp=Math.max(0,M.hp-dmg);if(M.hp===0){M.dead=true;M.respawn=performance.now()+8000;P.kaios+=8;monster.visible=false;toast('擊殺 +8 KAIOS')}else toast('命中 '+dmg)}$('#attack').onclick=()=>hit(24);$('#skill').onclick=()=>hit(45);$('#dodge').onclick=()=>toast('閃避');$('#interact').onclick=()=>toast('附近沒有可互動物件');$('#map').onclick=()=>toast('世界地圖器官保留');$('#menu').onclick=()=>toast('主選單器官保留');function speed(){return .055+Math.log10(P.c+1)*.075}let last=performance.now();function loop(t){requestAnimationFrame(loop);const dt=Math.min(2,(t-last)/16.67);last=t;if(joy){P.yaw-=jx*.045*dt;const s=-jy*speed()*dt;P.x+=Math.sin(P.yaw)*s;P.z+=Math.cos(P.yaw)*s}hero.position.set(P.x,0,P.z);hero.rotation.y=P.yaw;if(!M.dead){const d=dist();if(d<8&&d>1.45){const dx=P.x-monster.position.x,dz=P.z-monster.position.z,l=Math.hypot(dx,dz)||1;monster.position.x+=dx/l*.018*dt;monster.position.z+=dz/l*.018*dt}if(d<1.65&&t-M.lastHit>1100){M.lastHit=t;P.hp=Math.max(0,P.hp-6);toast('怪物攻擊 -6 HP')}monster.lookAt(P.x,1,P.z)}else if(t>=M.respawn){M.dead=false;M.hp=M.max;monster.position.set(0,0,-8);monster.visible=true;toast('怪物 8 秒重生')}const a=P.yaw+camYaw,cd=7.2;C.position.set(P.x-Math.sin(a)*cd,4.1,P.z-Math.cos(a)*cd);C.lookAt(P.x,1.25,P.z);$('#xyz').textContent=`X ${P.x.toFixed(1)} · Y 0.0 · Z ${P.z.toFixed(1)}`;$('#hp').textContent=P.hp;$('#kaios').textContent=P.kaios;$('#cv').textContent=P.c;$('#mbar').style.width=(M.hp/M.max*100)+'%';$('#mh').textContent=M.dead?'DEAD · 8秒重生':`${M.hp}/${M.max} · ${dist()<8?'追擊':'巡守'}`;R.render(S,C)}function resize(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener('resize',resize);resize();requestAnimationFrame(loop);toast('11520 3D 核爆場已載入');</script></body></html>
