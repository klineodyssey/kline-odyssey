<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>11520 V2.4 Stage 2.2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}.boot,.app{position:fixed;inset:0}.boot{display:grid;place-items:center;background:#05080d;z-index:10}.card{width:min(88vw,420px);padding:24px;border:1px solid #f1ca73aa;border-radius:18px;background:#0d1720;text-align:center}.k{font-size:62px;font-weight:900;color:#f1ca73}.ok{color:#65e798;font-weight:800}.btn{padding:13px 18px;border-radius:12px;border:1px solid #68e4ff;background:#102331;color:#68e4ff;font-weight:800}.app{display:none;background:radial-gradient(circle at 50% 25%,#10263a,#05080d 58%)}.top{position:fixed;left:8px;right:8px;top:8px;padding:10px 12px;border:1px solid #f1ca7366;border-radius:14px;background:#0d1720}.top b{color:#f1ca73}.hud{position:fixed;left:8px;top:88px;padding:10px;border:1px solid #f1ca7366;border-radius:12px;background:#0d1720}.joy{position:fixed;left:-34px;bottom:14px;width:160px;height:160px;border-radius:50%;border:2px solid #68e4ff99;background:#07141ddd;touch-action:none;user-select:none}.joy:before,.joy:after{content:"";position:absolute;background:#68e4ff33}.joy:before{left:18px;right:18px;top:50%;height:1px}.joy:after{top:18px;bottom:18px;left:50%;width:1px}.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #68e4ff;background:#17445f;display:grid;place-items:center;font-weight:900;z-index:2}.lab{position:absolute;color:#68e4ff;font-size:11px;font-weight:800}.up{top:7px;left:50%;transform:translateX(-50%)}.dn{bottom:7px;left:50%;transform:translateX(-50%)}.lt{left:6px;top:50%;transform:translateY(-50%)}.rt{right:6px;top:50%;transform:translateY(-50%)}.mode{position:absolute;top:-20px;left:20px;right:-30px;text-align:center;color:#68e4ff;font-size:10px}.joy.y{border-color:#f1ca73}.joy.y .knob{border-color:#f1ca73;background:#5a431d}.joy.y .lab,.joy.y .mode{color:#f1ca73}.avatar{position:fixed;left:50%;top:55%;width:52px;height:76px;transform:translate(-50%,-50%)}.avatar .head{position:absolute;left:14px;width:24px;height:24px;border-radius:50%;background:#f1ca73}.avatar .body{position:absolute;left:17px;top:24px;width:18px;height:34px;border-radius:8px;background:#68e4ff}.help{position:fixed;right:8px;bottom:18px;width:180px;padding:10px;border:1px solid #f1ca7366;border-radius:12px;background:#0d1720;font-size:10px;line-height:1.5}</style><script>var entered=false;function enterCore(){if(entered)return;entered=true;var b=document.getElementById('boot'),a=document.getElementById('app'),btn=document.getElementById('enterBtn');if(btn)btn.innerHTML='正在進入…';if(b)b.style.display='none';if(a)a.style.display='block';}</script></head><body><section class="boot" id="boot"><main class="card"><div class="k">K</div><h1>11520 花果山 V2.4</h1><p>生命啟動器 · Stage 2.2</p><p class="ok">BOOT SHELL READY</p><p id="net">NETWORK CHECKING</p><button class="btn" id="enterBtn" onclick="enterCore();return false;">載入核心控制並進入</button><p><small>若手機事件被攔截，3 秒後自動進入。</small></p></main></section><main class="app" id="app"><header class="top"><b>11520 花果山 V2.4 · Control Core</b></header><section class="hud"><div id="xyz">X 0.0 · Y 0.0 · Z 0.0</div><div>模式：<span id="modeText">XZ MODE</span></div><div>朝向：<span id="face">Z+</span></div></section><div class="avatar" id="avatar"><div class="head"></div><div class="body"></div></div><div class="joy" id="joy"><span class="lab up" id="up">Z+</span><span class="lab dn" id="dn">Z−</span><span class="lab lt" id="lt">X−</span><span class="lab rt" id="rt">X+</span><div class="knob" id="knob">K</div><div class="mode" id="mode">XZ MODE · 點 K 切換 Y</div></div><aside class="help">XZ：↑Z+ ↓Z− →X+ ←X−<br>點 K：切換 Y MODE<br>Y MODE：按住 0.5 秒後，上 Y+、下 Y−</aside></main><script>(function(){var net=document.getElementById('net');if(net)net.innerHTML=navigator.onLine?'NETWORK ONLINE':'NETWORK OFFLINE';setTimeout(enterCore,3000);var joy=document.getElementById('joy'),knob=document.getElementById('knob');var st={x:0,y:0,z:0,mode:'XZ',down:false,armed:false,vx:0,vy:0,timer:null,last:Date.now()};function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function setMode(m){st.mode=m;st.armed=false;clearTimeout(st.timer);joy.className='joy'+(m==='Y'?' y':'');document.getElementById('modeText').innerHTML=m+' MODE';document.getElementById('mode').innerHTML=m==='Y'?'Y MODE · 按住 0.5 秒，上 Y+ / 下 Y−':'XZ MODE · 點 K 切換 Y';document.getElementById('up').innerHTML=m==='Y'?'Y+':'Z+';document.getElementById('dn').innerHTML=m==='Y'?'Y−':'Z−';document.getElementById('lt').innerHTML=m==='Y'?'':'X−';document.getElementById('rt').innerHTML=m==='Y'?'':'X+'}knob.onclick=function(e){if(e){e.preventDefault();e.stopPropagation()}setMode(st.mode==='XZ'?'Y':'XZ');return false};function vec(e){var r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;return{x:clamp((e.clientX-cx)/(r.width*.36),-1,1),y:clamp((e.clientY-cy)/(r.height*.36),-1,1)}}joy.onpointerdown=function(e){if(e.target===knob)return;st.down=true;var v=vec(e);st.vx=v.x;st.vy=v.y;if(st.mode==='Y'){st.armed=false;clearTimeout(st.timer);st.timer=setTimeout(function(){st.armed=true},500)}};joy.onpointermove=function(e){if(!st.down)return;var v=vec(e);st.vx=v.x;st.vy=v.y;knob.style.transform='translate(calc(-50% + '+(v.x*36)+'px),calc(-50% + '+(v.y*36)+'px))'};function release(){st.down=false;st.vx=st.vy=0;st.armed=false;clearTimeout(st.timer);knob.style.transform='translate(-50%,-50%)'}joy.onpointerup=release;joy.onpointercancel=release;function tick(){var now=Date.now(),dt=Math.min(.05,(now-st.last)/1000);st.last=now;if(st.down){if(st.mode==='XZ'){st.x=clamp(st.x+st.vx*5*dt,-100,100);st.z=clamp(st.z-st.vy*5*dt,-100,100);if(Math.abs(st.vx)+Math.abs(st.vy)>.15){var f;if(Math.abs(st.vx)>Math.abs(st.vy))f=st.vx>0?'X+':'X−';else f=st.vy<0?'Z+':'Z−';document.getElementById('face').innerHTML=f}}else if(st.armed){st.y=clamp(st.y-st.vy*4*dt,0,40)}}document.getElementById('xyz').innerHTML='X '+st.x.toFixed(1)+' · Y '+st.y.toFixed(1)+' · Z '+st.z.toFixed(1);requestAnimationFrame(tick)}requestAnimationFrame(tick)})();</script></body></html>
