<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101512">
  <meta name="description" content="KAIOS 真實因果世界決定性模擬。">
  <link rel="canonical" href="https://klineodyssey.github.io/kline-odyssey/world-viewer/causal-runtime/">
  <meta property="og:title" content="KAIOS 真實因果世界｜KGEN">
  <meta property="og:description" content="距離、道路、河流、橋梁、運輸、燃料、損耗、材料與施工時間。">
  <meta property="og:url" content="https://klineodyssey.github.io/kline-odyssey/world-viewer/causal-runtime/">
  <meta property="og:image" content="https://klineodyssey.github.io/kline-odyssey/assets/kgen/kgen-logo-256.png">
  <link rel="icon" type="image/png" href="../../assets/kgen/kgen-logo-64.png">
  <title>KAIOS 真實因果世界｜KGEN</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;color:#f1f5f2;background:#0d110e;font-family:system-ui,sans-serif}.route-state{width:min(90vw,520px);padding:24px;border:1px solid #34433a;border-radius:8px;background:#151b17}.route-state p{color:#a8b6ad}.route-state button{min-height:44px}</style>
</head>
<body>
  <main class="route-state" id="causal-route-state" role="status" aria-live="polite"><h1>KAIOS 真實因果世界</h1><p>正在載入 deterministic causal runtime…</p></main>
  <script>
    (async () => {
      const state = document.getElementById("causal-route-state");
      try {
        const base = "../../KGEN-KAIOS/world-viewer/causal-runtime/";
        const response = await fetch(`${base}index.html`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const parsed = new DOMParser().parseFromString(await response.text(), "text/html");
        const shell = parsed.querySelector("#causal-runtime-app");
        if (!shell) throw new Error("Canonical causal app shell missing");
        document.body.replaceChildren(shell);
        const stylesheet = document.createElement("link"); stylesheet.rel = "stylesheet"; stylesheet.href = `${base}styles.css`; document.head.append(stylesheet);
        const app = document.createElement("script"); app.type = "module"; app.src = `${base}app.js`; document.body.append(app);
      } catch (error) {
        state.setAttribute("role", "alert"); state.replaceChildren(Object.assign(document.createElement("h1"), { textContent: "KAIOS 因果世界載入失敗" }), Object.assign(document.createElement("p"), { textContent: error.message }), Object.assign(document.createElement("button"), { textContent: "重新載入", onclick: () => location.reload() }));
      }
    })();
  </script>
</body>
</html>
